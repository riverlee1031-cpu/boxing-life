<title>Boxing Life V26 · 生涯紀錄與分享卡</title>
<style>
:root{
  --bg:#061911; --bg2:#09251b; --panel:#0f3427; --panel2:#153d2f;
  --line:#315d4b; --line2:#436d5a; --ink:#eef0e5; --dim:#b9c8bf;
  --faint:#81998d; --gold:#f1c553; --good:#78dc91; --bad:#ff766d; --blue:#8fd0eb;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
body{font-size:16px;overflow:hidden;background:linear-gradient(135deg,rgba(65,103,79,.08) 0 1px,transparent 1px 24px),linear-gradient(180deg,#09261b,#051710)}
button,input,select{font:inherit}
button{cursor:pointer}
#app{height:100vh}
.shell{height:100vh;max-width:1600px;margin:auto;display:grid;grid-template-columns:275px minmax(620px,1fr) 430px;border-left:1px solid #234b3b;border-right:1px solid #234b3b}
.left{background:linear-gradient(180deg,#0b2b20,#08241a);border-right:1px solid #264c3d;padding:18px 18px 14px;display:flex;flex-direction:column;overflow-y:auto}
.brand{font-size:42px;font-weight:1000;letter-spacing:-2px;line-height:1;text-align:center}
.brand em{font-style:normal;color:var(--gold)}
.brandSub{margin:9px 0 15px;padding-bottom:13px;border-bottom:1px solid #2b5142;text-align:center;color:#7d9689;font-size:11px;letter-spacing:.24em}
.school{font-size:14px;font-weight:900;color:#dbe1da}
.school small{display:block;color:#859d90;font-size:12px;margin-top:5px}
.timeline{position:relative;margin:16px 0 6px;padding-left:28px}
.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:8px;width:1px;background:#527160}
.node{position:relative;padding-bottom:14px}
.node:before{content:"";position:absolute;left:-28px;top:2px;width:15px;height:15px;border-radius:50%;background:#0a291e;border:2px solid #567466}
.node.done:before{background:#315c49;border-color:#638271}
.node.on:before{border-color:var(--gold);background:#0a291e;box-shadow:0 0 10px rgba(241,197,83,.55)}
.node b{display:block;font-size:14px}.node span{display:block;color:#80978b;font-size:11px;margin-top:4px;line-height:1.4}
.node.on b{color:var(--gold)}
.menu{margin-top:8px;display:grid;gap:3px}
.menu div{padding:9px 10px;border-radius:7px;color:#b9c9c0;font-size:13px;font-weight:850}
.menu div.active{background:#173b2e;color:var(--gold)}
.version{margin-top:12px;padding-top:12px;border-top:1px solid #2b5142;font-size:10px;color:#789184;line-height:1.7}
.version b{color:var(--gold)}

.center{background:#04140e;border-right:1px solid #264c3d;min-width:0;overflow-y:auto}
.header{position:sticky;top:0;z-index:5;background:rgba(12,45,33,.97);border-bottom:1px solid #2b5544;padding:12px 24px 11px;backdrop-filter:blur(8px)}
.profile{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.no{height:52px;border:1px solid #907929;border-radius:10px;text-align:center;display:grid;place-items:center;color:var(--gold);font-size:26px;font-weight:1000;background:#1a3726}
.name b{font-size:24px;display:block}.tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid #567363;border-radius:5px;padding:3px 7px;color:#d3ddd6}.tag.gold{color:var(--gold);border-color:#877229}
.affil{text-align:right;color:#81998c;font-size:11px}.affil b{display:block;color:var(--gold);font-size:15px;margin-top:3px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.metric{background:#153c2e;border:1px solid #2d5948;border-radius:9px;padding:7px;text-align:center}
.metric b{display:block;font-size:19px;color:var(--gold)}.metric span{display:block;font-size:10px;color:#839c8f;margin-top:3px}
.content{padding:18px 24px 38px}
.date{text-align:center;color:#819a8d;font-size:12px;letter-spacing:.22em;margin:4px 0 15px}
.card{background:linear-gradient(180deg,#103529,#0d3024);border:1px solid #315b49;border-radius:12px;padding:15px 17px;margin-bottom:14px}
.card.major{border-color:#8b742b;box-shadow:0 0 0 1px rgba(241,197,83,.08) inset}
.kicker{font-size:11px;letter-spacing:.11em;color:#9ab2a5;font-weight:900;margin-bottom:8px}.kicker.gold{color:var(--gold)}
.card h2{margin:0 0 8px;font-size:24px}.card h3{margin:0 0 7px;font-size:19px}.card p{margin:0;color:#d1dbd4;line-height:1.72;font-size:15px}
.progressBox{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.progressText{font-size:13px;color:#9fb2a7}.progressText b{color:var(--gold)}
.turnDots{display:flex;gap:6px}.turnDots i{display:block;width:12px;height:12px;border-radius:50%;background:#244739;border:1px solid #456b59}.turnDots i.done{background:var(--gold);border-color:var(--gold)}
.log{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}.log:last-child{border-bottom:0}.log small{display:block;color:#66877a;font-size:10px;margin-bottom:4px}.log div{font-size:13px;color:#cbd7d0;line-height:1.55}
.deltaWrap{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.delta{font-size:12px;font-weight:900;border:1px solid #456858;border-radius:99px;padding:5px 8px;background:#16392c}.delta.good{color:var(--good);border-color:#32744a}.delta.bad{color:var(--bad);border-color:#80433e}.delta.point{color:var(--gold);border-color:#89732c}

.right{background:linear-gradient(180deg,#0b2a20,#082219);padding:16px;overflow-y:auto}
.rightTitle{font-size:12px;letter-spacing:.1em;color:#8fa89a;font-weight:900;margin:2px 0 9px}
.rhythm{border:1px solid #315a49;background:#103429;border-radius:11px;padding:11px;margin-bottom:10px}
.rhythmRow{display:flex;gap:8px;align-items:center;font-size:12px;color:#c6d2cb;margin:5px 0}.rhythmRow i{width:8px;height:8px;border-radius:50%;background:#456858}.rhythmRow.on i{background:var(--gold);box-shadow:0 0 7px rgba(241,197,83,.5)}
.pointsBox{border:1px solid #806d2b;background:linear-gradient(180deg,#203e2d,#17382a);border-radius:12px;padding:12px;margin-bottom:10px}
.pointsHead{display:flex;justify-content:space-between;align-items:center}.pointsHead span{font-size:13px;color:#dce2dc;font-weight:900}.pointsHead b{font-size:24px;color:var(--gold)}
.attr{background:#12382b;border:1px solid #315949;border-radius:9px;padding:9px 10px;margin-bottom:7px}
.attrTop{display:grid;grid-template-columns:66px 1fr 56px 31px;gap:8px;align-items:center}
.attrName{font-size:13px;font-weight:900}.attrBar{height:8px;background:#061710;border-radius:99px;overflow:hidden}.attrBar i{display:block;height:100%;background:linear-gradient(90deg,#6dd78c,#efc652);border-radius:99px}
.attrValue{text-align:right;font-size:12px;font-weight:900}.attrValue span{color:#779084;font-weight:700}
.plus{width:31px;height:31px;border-radius:7px;border:1px solid #806d2b;background:#284933;color:var(--gold);font-size:18px;font-weight:1000}.plus:disabled{opacity:.3;cursor:not-allowed}
.cost{text-align:right;margin-top:4px;color:#80998d;font-size:9px}
.sidePanel{border:1px solid #315a49;background:#103429;border-radius:11px;padding:12px;margin-bottom:10px}
.choiceTitle{font-size:14px;color:#dfe4de;font-weight:900;margin-bottom:9px}
.choice{width:100%;text-align:left;border:1px solid #466958;background:#153b2d;color:#eef0e6;border-radius:10px;padding:11px;margin-bottom:8px}.choice:last-child{margin-bottom:0}.choice b{display:block;font-size:16px}.choice span{display:block;font-size:12px;color:#c4d0c9;margin-top:4px}.choice em{display:block;font-size:10px;color:#86a092;font-style:normal;margin-top:5px}.choice:hover{border-color:#8a742b}
.die{width:58px;height:58px;margin:7px auto 10px;border:2px solid #c3b99f;border-radius:13px;background:#eee7d8;color:#294035;display:grid;place-items:center;font-size:30px;font-weight:1000}
.resultText{font-size:13px;line-height:1.65;color:#d2ddd6}
.action{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(180deg,transparent,#082219 24%)}
.action button{width:100%;border:1px solid #6d6030;background:linear-gradient(180deg,#36583e,#294a34);color:#f0f2e8;border-radius:11px;padding:13px;font-size:17px;font-weight:1000}.action button small{display:block;font-size:11px;color:#b9c7bf;margin-top:4px}

.start{height:100vh;overflow:auto;max-width:1000px;margin:auto;padding:34px 20px}
.start h1{text-align:center;font-size:52px;margin:0;letter-spacing:-2px}.start h1 em{color:var(--gold);font-style:normal}
.startIntro{text-align:center;max-width:760px;margin:12px auto 22px;color:#c6d3cb;line-height:1.8;font-size:16px}
.startGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid #315a49;background:#103429;border-radius:13px;padding:16px}.panel label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.panel input,.panel select{width:100%;padding:11px;border-radius:8px;border:1px solid #436857;background:#071d15;color:#eef0e5}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.startBtn{width:100%;margin-top:14px;padding:14px;border-radius:11px;border:1px solid #846f29;background:#2b4d35;color:#f2ce64;font-size:18px;font-weight:1000}
@media(max-width:1280px){.shell{grid-template-columns:245px minmax(520px,1fr) 390px}.brand{font-size:36px}.content{padding-left:18px;padding-right:18px}}
@media(max-width:980px){body{overflow:auto}#app{height:auto}.shell{height:auto;display:block}.left{display:none}.center,.right{overflow:visible}.header{position:static}.startGrid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}}
</style>

<style id="v26-career-css">

.careerMetric b{display:block;color:var(--gold);font-size:21px}.careerMetric span{display:block;color:#839b8f;font-size:10px;margin-top:4px}
.historyList{display:grid;gap:8px}

.historyWhen{font-size:10px;color:#80998c;line-height:1.6}
.historyWhen b{display:block;color:var(--gold);font-size:12px}
.historyText{font-size:13px;line-height:1.65;color:#d5ddd7}
.historyText strong{display:block;color:#edf0e6;font-size:14px;margin-bottom:2px}
.shareArea{margin-top:14px;padding-top:14px;border-top:1px solid #315547}
.shareButtons{display:flex;gap:8px;flex-wrap:wrap}

.retireCard{border-color:#91792a!important}
.retireBtn{

}
.sharePreview{
  margin-top:12px;background:#081d15;border:1px solid #315747;border-radius:11px;padding:10px;

.sharePreview canvas{max-width:100%;height:auto;border-radius:8px}
.endHero{background:linear-gradient(180deg,#183d2e,#102c22);border:1px solid #8a742a;border-radius:14px;padding:18px;margin-bottom:14px}
.endHero h2{margin:0;color:#f0cf61;font-size:28px}.endHero p{color:#cbd7cf;line-height:1.7}
@media(max-width:760px){
  .careerSummary{grid-template-columns:repeat(2,1fr)}
  .historyItem{grid-template-columns:1fr}.careerModal{padding:8px}.careerSheet{padding:12px}
}
</style>

let G=null;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>"$"+Math.round(n).toLocaleString();

function getSequence(){
  const branch=G?.lifePath;
  const middle=branch==="college"?COLLEGE_PHASES:branch==="work"?WORK_PHASES:[];
  return [...COMMON_PHASES,...middle,...PRO_PHASES];
}
function phase(){const s=getSequence();return s[Math.min(G.phaseIndex,s.length-1)]}
function phaseGroup(){
  const id=phase().id;
  if(id.startsWith("hs"))return "hs";
  if(id.startsWith("uni"))return "uni";
  if(id.startsWith("work"))return "work";
  return "pro";
}
function ovr(){return Math.round(SKILLS.reduce((s,k)=>s+G.stats[k],0)/SKILLS.length)}
function statCost(k){const v=G.stats[k];return v>=80?3:v>=70?2:1}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(G))}
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"null")}catch{return null}}
function log(t){G.logs.unshift({when:`${G.year}・${phase().name}・回合 ${G.turnInPhase+1}`,text:t});G.logs=G.logs.slice(0,18)}
function apply(k,v){
 if(k in G.stats){G.stats[k]=clamp(G.stats[k]+v,30,95);return `${NAMES[k]} ${v>0?"+":""}${v}`}
 if(k==="health"){G.health=clamp(G.health+v,0,100);return `健康 ${v>0?"+":""}${v}`}
 if(k==="morale"){G.morale=clamp(G.morale+v,0,100);return `士氣 ${v>0?"+":""}${v}`}
 if(k==="fame"){G.fame=Math.max(0,G.fame+v);return `名氣 ${v>0?"+":""}${v}`}
 if(k==="income"){G.income=Math.max(0,G.income+v);return `收入 ${v>0?"+":""}${money(v)}`}
 return "";
}
function spendPoint(k){const c=statCost(k);if(G.skillPoints<c||G.stats[k]>=95)return;G.skillPoints-=c;G.stats[k]++;log(`分配能力點：${NAMES[k]} +1（花費 ${c} 點）。`);save();render()}

function eventPool(){
 const id=phase().id,g=phaseGroup();
 const specific=(PHASE_EVENTS[id]||[]);
 const general=GENERAL_EVENTS.filter(e=>e.tags.includes(g));
 return [...specific,...general];
}
function forcedSpecial(){
 const id=phase().id;
 const specials=(PHASE_EVENTS[id]||[]).filter(e=>e.special&&!G.usedSpecial[e.id]);
 if(!specials.length)return null;
 // 五回合中第 2、4 回合優先出現階段限定特殊事件；每階段最多可遇到兩個。
 if(G.turnInPhase===1 || G.turnInPhase===3) return pick(specials);
 return null;
}
function drawEvent(){
 if(G.current||G.result)return;
 if(!Array.isArray(G.recentEvents))G.recentEvents=[];
 if(G.stageStory){G.current=buildStageStory();save();render();return;}
 const special=forcedSpecial();
 let ev;
 if(special){
   ev=special;
   G.usedSpecial[ev.id]=true;
 }else{
   const recent=new Set(G.recentEvents.slice(-3));
   let pool=eventPool().filter(e=>!e.special && !recent.has(e.id));
   if(!pool.length)pool=eventPool().filter(e=>!e.special && e.id!==G.lastEvent);
   if(!pool.length)pool=eventPool().filter(e=>!e.special);
   ev=pick(pool);
 }
 G.current=JSON.parse(JSON.stringify(ev));
 G.lastEvent=ev.id;
 G.recentEvents.push(ev.id);
 G.recentEvents=G.recentEvents.slice(-5);
 save();render();
}

 return storyFight(`年度劇情｜${p.story}`,`${p.name}走到尾聲。這個階段會用一場代表性比賽做結尾；無論輸贏，人生都會進下一階段。`,!p.id.startsWith("hs"));
}
function storyFight(cat,desc,pro){return {story:true,cat,title:phase().story,desc,choices:[
 {label:"全力搶勝",sub:"高風險、高回報",rate:"35%｜勝利時能力點較多",mode:"risk",fight:true,pro},
 {label:"照策略打",sub:"穩定執行教練計畫",rate:"50%｜標準",mode:"normal",fight:true,pro},
 {label:"保守累積經驗",sub:"降低失誤",rate:"70%｜低波動",mode:"safe",fight:true,pro}
]}}
function tierFor(mode,roll){if(mode==="risk")return roll>=5?"good":roll<=2?"bad":"mid";if(mode==="safe")return roll>=4?"good":roll===1?"bad":"mid";return roll>=5?"good":roll<=2?"bad":"mid"}
function choose(i){
 const ev=G.current,ch=ev?.choices[i];if(!ev||!ch)return;const roll=rnd(1,6);
 if(ch.special)resolveSpecial(ev,ch,roll); else if(ch.fight)resolveFight(ev,ch,roll); else resolveEvent(ev,ch,roll);
 G.current=null;save();render();
}
function resolveEvent(ev,ch,roll){
 const tier=tierFor(ch.mode,roll),effects=tier==="good"?(ch.good||[]):tier==="bad"?(ch.bad||[]):ch.mid||[],deltas=effects.map(([k,v])=>apply(k,v)).filter(Boolean);
 let pts=0;if(tier==="good")pts=roll===6?2:1;G.skillPoints+=pts;if(pts)deltas.push(`能力點 +${pts}`);
 G.turnInPhase++;if(G.turnInPhase>=phase().turns)G.stageStory=true;
 const text=tier==="good"?"這次選擇帶來正面收穫。":tier==="bad"?"結果不理想，但劇情不會因此停住。":"結果平穩，沒有太大波動。";
 G.result={title:ev.title,roll,tier,text,deltas,stageDone:false};log(`事件《${ev.title}》：選擇「${ch.label}」，擲出 ${roll}。`);
}
function resolveFight(ev,ch,roll){
 const my=ovr()+roll+rnd(-2,2),opp=ovr()+rnd(-4,5),win=my>=opp,p=phase(),deltas=[];
 const proFight=!p.id.startsWith("hs");
 if(proFight){win?G.pro.w++:G.pro.l++;if(win&&roll===6)G.pro.ko++;}else{win?G.amateur.w++:G.amateur.l++;}
 if(win){deltas.push(apply("fame",3),apply("morale",3));}else{deltas.push(apply("morale",-2),apply("health",-4));}
 const pts=win?(roll===6?6:4):(roll>=4?3:2);G.skillPoints+=pts;deltas.push(`能力點 +${pts}`);
 if(proFight)deltas.push(apply("income",win?rnd(3000,8000):rnd(1500,4000)));
 G.result={title:ev.title,roll,tier:win?"good":"bad",text:win?`你贏下 ${p.story}。`:`你輸掉 ${p.story}，但這不是門檻，生涯仍會進入下一階段。`,deltas:deltas.filter(Boolean),stageDone:true};
 log(`${p.story}：${win?"勝利":"落敗"}，獲得 ${pts} 能力點。`);
}
function resolveSpecial(ev,ch,roll){
 let deltas=[],text="";
 if(ch.special==="choose_college"){
   G.lifePath="college";G.skillPoints+=3;deltas=["能力點 +3",apply("morale",2)];text="你選擇進大學，接下來四年會一邊念書一邊拳擊。";
 }else if(ch.special==="choose_work"){
   G.lifePath="work";G.skillPoints+=3;deltas=["能力點 +3",apply("income",1200)];text="你選擇先工作，接下來會一邊上班一邊維持拳擊訓練。";
 }else if(ch.special==="college_grad_full"){
   G.skillPoints+=5;deltas=["能力點 +5",apply("fame",3),apply("morale",3)];text="大學畢業，你正式把拳擊變成主業。";
 }else if(ch.special==="college_grad_part"){
   G.skillPoints+=3;deltas=["能力點 +3",apply("income",1800),apply("morale",1)];text="你畢業後先保留兼職收入，再正式進入職業賽程。";
 }else if(ch.special==="work_full"){
   G.skillPoints+=5;deltas=["能力點 +5",apply("morale",3),apply("fame",2)];text="你辭掉工作，正式成為全職拳手。";
 }else if(ch.special==="work_part"){
   G.skillPoints+=3;deltas=["能力點 +3",apply("income",1800),apply("morale",1)];text="你把工作降成較少工時，同時正式進入職業賽程。";
 }
 G.result={title:ev.title,roll,tier:"good",text,deltas:deltas.filter(Boolean),stageDone:true};log(`重大選擇：${ch.label}。`);
}
function continueAfterResult(){
 if(!G.result)return;const done=G.result.stageDone;G.result=null;
 if(done){
   G.stageStory=false;G.turnInPhase=0;G.phaseIndex++;
   const seq=getSequence();if(G.phaseIndex>=seq.length)G.phaseIndex=seq.length-1;
   const p=phase();G.year=p.year;G.age=p.age;log(`進入下一階段：${p.name}。`);
 }
 save();render();
}
function timelineHTML(){
 const seq=getSequence(),max=Math.min(G.phaseIndex,seq.length-1);
 return seq.slice(0,max+1).map((p,i)=>`<div class="node ${i<max?"done":i===max?"on":""}"><b>${p.year}　${p.name.split("・")[0]}</b><span>${p.name}${i===max?`｜${G.turnInPhase}/${p.turns} 回合`:""}</span></div>`).join("");
}
function resetGame(){if(confirm("確定重開人生嗎？")){localStorage.removeItem(SAVE_KEY);G=null;render()}}
function startScreen(){return `<div class="start"><h1>Boxing <em>Life</em></h1><div class="startIntro">高一就開始海外留學。高一、高二、高三會照左側年表累積；高中畢業後，你可以選擇 <b style="color:var(--gold)">進大學邊讀邊練</b> 或 <b style="color:var(--gold)">工作邊練</b>。兩條人生線會出現不同事件，之後再匯入職業拳擊。</div><div class="startGrid"><div class="panel"><label>拳手名字</label><input id="name" value="李逍遙"><div class="row2" style="margin-top:12px"><div><label>拳風</label><select id="style"><option value="pressure">壓迫型</option><option value="boxer">技巧型</option><option value="puncher">重砲型</option></select></div><div><label>高一留學地</label><select id="country"><option value="usa">🇺🇸 美國</option><option value="japan">🇯🇵 日本</option><option value="philippines">🇵🇭 菲律賓</option></select></div></div></div><div class="panel"><label>人生事件會跟著階段改變</label><div style="color:#c6d4cc;line-height:1.9;font-size:15px">• 高中：想家、段考、談戀愛、分手<br>• 大學：同學吵架、室友、派對、實習、網紅偷拍、大學畢業<br>• 工作：加班、同事衝突、升職、收入、網紅偷拍<br>• 職業：經理、贊助、戀情曝光、媒體與排名<br>• 每階段約 5 回合後進重大劇情</div></div></div><button class="startBtn" onclick="createGame()">高一，出發 ▶</button></div>`}
function rightAttrs(){return `<div class="pointsBox"><div class="pointsHead"><span>可分配能力點</span><b>${G.skillPoints}</b></div></div>${SKILLS.map(k=>{const c=statCost(k);return `<div class="attr"><div class="attrTop"><div class="attrName">${NAMES[k]}</div><div class="attrBar"><i style="width:${G.stats[k]}%"></i></div><div class="attrValue">${G.stats[k]}<span>/95</span></div><button class="plus" ${G.skillPoints<c||G.stats[k]>=95?"disabled":""} onclick="spendPoint('${k}')">＋</button></div><div class="cost">升 1 點花費 ${c} 能力點</div></div>`}).join("")}`}
function render(){
 const app=document.getElementById("app");if(!G){G=load();if(!G){app.innerHTML=startScreen();return;}}if(!G.usedSpecial)G.usedSpecial={};if(!Array.isArray(G.recentEvents))G.recentEvents=[];
 const p=phase(),country=COUNTRIES[G.country],mode=G.current?"event":G.result?"result":"idle";
 const choices=mode==="event"?`<div class="sidePanel"><div class="choiceTitle">${G.current.cat}｜你要怎麼做？</div>${G.current.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c.label}</b><span>${c.sub}</span><em>${c.rate}</em></button>`).join("")}</div>`:"";
 const res=mode==="result"?`<div class="sidePanel"><div class="rightTitle">RESULT</div><div class="die">${G.result.roll}</div><div class="resultText">${G.result.text}</div><div class="deltaWrap">${G.result.deltas.map(x=>`<span class="delta ${x.includes("能力點")?"point":x.includes("+")?"good":x.includes("-")?"bad":""}">${esc(x)}</span>`).join("")}</div></div>`:"";
 const nextSeq=getSequence();const nextName=nextSeq[Math.min(G.phaseIndex+1,nextSeq.length-1)]?.name||"下一階段";
 const action=mode==="idle"?`<button onclick="drawEvent()">${G.stageStory?`進入重大劇情：${p.story}`:`開始第 ${G.turnInPhase+1} / ${p.turns} 回合`}<small>${G.stageStory?"完成後進下一個人生階段":"每個人生階段都有不同事件池，且會避開最近抽過的內容"}</small></button>`:mode==="result"?`<button onclick="continueAfterResult()">${G.result.stageDone?"進入下一階段":"繼續"}<small>${G.result.stageDone?`下一站：${nextName}`:"回到下一個事件回合"}</small></button>`:"";
 const center=mode==="event"?`<div class="card ${G.current.story||G.current.special?"major":""}"><div class="kicker ${G.current.story||G.current.special?"gold":""}">■ ${G.current.cat}</div><h2>${G.current.title}</h2><p>${G.current.desc}</p></div>`:mode==="result"?`<div class="card ${G.result.stageDone?"major":""}"><div class="kicker ${G.result.stageDone?"gold":""}">■ ${G.result.stageDone?"重大劇情結果":"事件結果"}</div><h2>${G.result.title}</h2><p>${G.result.text}</p><div class="deltaWrap">${G.result.deltas.map(x=>`<span class="delta ${x.includes("能力點")?"point":x.includes("+")?"good":x.includes("-")?"bad":""}">${esc(x)}</span>`).join("")}</div></div>`:`<div class="card"><div class="kicker">■ ${p.name}</div><h2>${G.stageStory?`5 回合完成：${p.story}`:`第 ${G.turnInPhase+1} 回合準備開始`}</h2><p>${G.stageStory?`這個人生階段的日常事件已完成，現在進入重大劇情。`:p.desc}</p><div class="progressBox"><div class="progressText">本階段進度 <b>${G.turnInPhase} / ${p.turns}</b></div><div class="turnDots">${Array.from({length:p.turns},(_,i)=>`<i class="${i<G.turnInPhase?"done":""}"></i>`).join("")}</div></div></div>`;
 app.innerHTML=`<div class="shell">
 <aside class="left"><div class="brand">Boxing <em>Life</em></div><div class="brandSub">拳 擊 人 生 模 擬 器</div><div class="school">台灣高中・拳擊部<small>${country.route}｜${country.name}・${G.base}</small></div><div class="timeline">${timelineHTML()}</div><div class="menu"><div class="active">▣ 生涯事件</div><div>◆ 能力點</div><div>♜ 劇情比賽</div><div>▦ 人生年表</div><div>★ 技能</div><div>▥ 數據</div><div>◉ 成就</div><div onclick="save()">▣ 儲存</div><div onclick="resetGame()">⚙ 重開人生</div></div><div class="version"><b>v2.6.0</b><br>${G.lifePath==="college"?"大學人生線":G.lifePath==="work"?"工作人生線":"高中人生線"}<br>5 回合推進・大量階段限定事件</div></aside>
 <main class="center"><header class="header"><div class="profile"><div class="no">1</div><div class="name"><b>${esc(G.name)}</b><div class="tags"><span class="tag">${p.identity}</span><span class="tag gold">${STYLES[G.style]}</span></div></div><div class="affil">所屬地區<b>${country.name}・${G.base}</b></div></div><div class="metrics"><div class="metric"><b>${G.age}</b><span>年齡</span></div><div class="metric"><b>${G.year}</b><span>年份</span></div><div class="metric"><b>${ovr()}</b><span>綜合</span></div><div class="metric"><b>${G.skillPoints}</b><span>能力點</span></div><div class="metric"><b>${G.pro.w}-${G.pro.l}</b><span>職業戰績</span></div></div></header><div class="content"><div class="card"><div class="kicker">■ 人生主線</div><p>左側會永久保留走過的年級／人生階段。高中畢業後會真正分成 <b>大學線</b> 或 <b>工作線</b>；每條線都有自己的特殊事件，再於 23 歲左右匯入職業拳擊。</p></div><div class="date">${G.year} 年 ・ ${G.age} 歲 ・ ${p.name}</div>${center}<div class="card"><div class="kicker">■ 最近紀錄</div>${G.logs.slice(0,7).map(l=>`<div class="log"><small>${l.when}</small><div>${esc(l.text)}</div></div>`).join("")}</div></div></main>
 <aside class="right"><div class="rhythm"><div class="rightTitle">LIFE RHYTHM</div><div class="rhythmRow ${!G.stageStory&&!G.current&&!G.result?"on":""}"><i></i>${p.name}：${G.turnInPhase}/${p.turns} 回合</div><div class="rhythmRow ${G.current?"on":""}"><i></i>階段專屬事件／特殊事件</div><div class="rhythmRow ${G.result?"on":""}"><i></i>命運骰結算</div><div class="rhythmRow ${G.stageStory?"on":""}"><i></i>第 5 回合後：${p.story}</div></div>${rightAttrs()}${choices}${res}<div class="action">${action}</div></aside>
 </div>`;
}
render();
</script>

<script id="v26-career-js">
function ensureCareerData(){
  if(!G)return;
  if(!Array.isArray(G.careerHistory))G.careerHistory=[];
  if(!G.careerStats)G.careerStats={peakOvr:ovr(),peakFame:G.fame||0,totalEvents:0,specialEvents:0,fights:0};
  if(G.retired===undefined)G.retired=false;
  if(!G.retireReason)G.retireReason="";
}
function updateCareerPeaks(){
  ensureCareerData();
  G.careerStats.peakOvr=Math.max(G.careerStats.peakOvr||0,ovr());
  G.careerStats.peakFame=Math.max(G.careerStats.peakFame||0,G.fame||0);
}
function addCareerRecord(title,text,type="life"){
  ensureCareerData();
  const p=phase();
  const item={
    year:G.year,age:G.age,phase:p.name,title,text,type,
    route:G.lifePath||"highschool"
  };
  G.careerHistory.unshift(item);
  G.careerHistory=G.careerHistory.slice(0,80);
  updateCareerPeaks();
}
function routeLabel(){
  if(G.lifePath==="college")return "高中留學 → 大學邊讀邊練 → 職業拳擊";
  if(G.lifePath==="work")return "高中留學 → 工作邊練 → 職業拳擊";
  return "海外高中拳擊";
}
function proRecord(){return `${G.pro.w}-${G.pro.l}-${G.pro.d||0} (${G.pro.ko||0}KO)`}
function amateurRecord(){return `${G.amateur.w}-${G.amateur.l}`}
function careerRecordModal(){
  ensureCareerData();
  let modal=document.getElementById("careerModal");
  if(modal)modal.remove();
  const list=G.careerHistory.length?G.careerHistory.map(x=>`
    <div class="historyItem">
      <div class="historyWhen"><b>${x.year}</b>${x.age} 歲<br>${x.phase}</div>
      <div class="historyText"><strong>${esc(x.title)}</strong>${esc(x.text)}</div>
    </div>`).join(""):`<div class="historyItem"><div class="historyText">目前還沒有重大生涯紀錄。</div></div>`;
  document.body.insertAdjacentHTML("beforeend",`
   <div id="careerModal" class="careerModal">
    <div class="careerSheet">
      <div class="careerTop">
        <div><h2>${esc(G.name)} · 生涯紀錄</h2><p>${routeLabel()}｜${COUNTRIES[G.country].name}・${G.base}</p></div>
        <button class="closeX" onclick="document.getElementById('careerModal').remove()">關閉</button>
      </div>
      <div class="careerSummary">
        <div class="careerMetric"><b>${amateurRecord()}</b><span>業餘戰績</span></div>
        <div class="careerMetric"><b>${proRecord()}</b><span>職業戰績</span></div>
        <div class="careerMetric"><b>${G.careerStats.peakOvr}</b><span>最高 OVR</span></div>
        <div class="careerMetric"><b>${money(G.income)}</b><span>生涯收入</span></div>
      </div>
      <div class="historyList">${list}</div>
      <div class="shareArea">
        <div class="shareButtons">
          <button onclick="buildShareCard()">產生生涯分享圖</button>
          ${G.retired?`<button onclick="downloadShareCard()">下載 PNG</button>`:""}
        </div>
        <div id="sharePreview" class="sharePreview" style="display:none"></div>
      </div>
    </div>
   </div>`);
}
function getShareHighlights(){
  ensureCareerData();
  return G.careerHistory.slice(0,7).reverse();
}
function buildShareCard(){
  ensureCareerData();
  const preview=document.getElementById("sharePreview");
  if(!preview)return;
  preview.style.display="block";
  preview.innerHTML="";
  const canvas=document.createElement("canvas");
  canvas.width=1200;canvas.height=1500;
  const ctx=canvas.getContext("2d");
  const bg=ctx.createLinearGradient(0,0,0,1500);
  bg.addColorStop(0,"#0c3024");bg.addColorStop(1,"#061912");
  ctx.fillStyle=bg;ctx.fillRect(0,0,1200,1500);

  // decorative lines
  ctx.strokeStyle="#365f4d";ctx.lineWidth=2;
  for(let y=80;y<1480;y+=120){ctx.globalAlpha=.13;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1200,y);ctx.stroke();}
  ctx.globalAlpha=1;

  ctx.fillStyle="#f1c553";ctx.font="900 44px sans-serif";
  ctx.fillText("BOXING LIFE · CAREER RECORD",70,85);

  ctx.fillStyle="#eef0e5";ctx.font="900 76px sans-serif";
  ctx.fillText(G.name,70,185);
  ctx.font="700 30px sans-serif";ctx.fillStyle="#a6b8ad";
  ctx.fillText(`${routeLabel()} · ${COUNTRIES[G.country].name} ${G.base}`,70,235);

  // summary cards
  const cards=[
    ["AMATEUR",amateurRecord()],["PRO",proRecord()],["PEAK OVR",String(G.careerStats.peakOvr)],
    ["FAME",String(G.careerStats.peakFame)],["INCOME",money(G.income)],["AGE",`${G.age} 歲`]
  ];
  let cx=70,cy=290;
  cards.forEach((c,i)=>{
    const col=i%3,row=Math.floor(i/3),x=70+col*355,y=290+row*145;
    ctx.fillStyle="#143a2d";ctx.strokeStyle="#345d4b";ctx.lineWidth=2;
    roundRect(ctx,x,y,320,115,18,true,true);
    ctx.fillStyle="#81998d";ctx.font="700 20px sans-serif";ctx.fillText(c[0],x+20,y+34);
    ctx.fillStyle="#f1c553";ctx.font="900 35px sans-serif";ctx.fillText(c[1],x+20,y+82);
  });

  ctx.fillStyle="#eef0e5";ctx.font="900 34px sans-serif";ctx.fillText("生涯重要經歷",70,610);
  ctx.strokeStyle="#315b49";ctx.beginPath();ctx.moveTo(70,630);ctx.lineTo(1130,630);ctx.stroke();

  let y=685;
  const hs=getShareHighlights();
  if(!hs.length){
    ctx.fillStyle="#a6b8ad";ctx.font="26px sans-serif";ctx.fillText("尚無生涯紀錄",90,y);
  }else{
    hs.forEach((h,idx)=>{
      ctx.fillStyle="#f1c553";ctx.font="800 22px sans-serif";
      ctx.fillText(`${h.year} · ${h.age}歲`,80,y);
      ctx.fillStyle="#eef0e5";ctx.font="800 27px sans-serif";
      ctx.fillText(trimText(ctx,h.title,780),280,y);
      ctx.fillStyle="#9fb2a7";ctx.font="21px sans-serif";
      wrapCanvasText(ctx,h.text,280,y+34,800,28,2);
      y+=112;
    });
  }

  ctx.fillStyle="#80998c";ctx.font="700 21px sans-serif";
  ctx.fillText("從高一留學開始，每一次選擇都留下紀錄。",70,1430);
  ctx.fillStyle="#f1c553";ctx.font="900 23px sans-serif";
  ctx.fillText(G.retired?"CAREER COMPLETE":"CAREER IN PROGRESS",900,1430);

  canvas.id="careerShareCanvas";
  preview.appendChild(canvas);
}
function roundRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function trimText(ctx,text,maxWidth){
  let s=String(text);while(ctx.measureText(s).width>maxWidth&&s.length>2)s=s.slice(0,-2)+"…";return s;
}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const chars=String(text).split("");let line="",lines=[];
  for(const ch of chars){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length>=maxLines)break;}
    else line=test;
  }
  if(lines.length<maxLines&&line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
}
function downloadShareCard(){
  let c=document.getElementById("careerShareCanvas");
  if(!c){buildShareCard();c=document.getElementById("careerShareCanvas")}
  if(!c)return;
  const a=document.createElement("a");
  a.download=`${G.name}-boxing-career.png`;
  a.href=c.toDataURL("image/png");
  a.click();
}
function retireCareer(reason="完成最後階段，正式引退"){
  ensureCareerData();
  G.retired=true;G.retireReason=reason;
  addCareerRecord("正式引退",reason,"retire");
  save();render();
  setTimeout(()=>careerRecordModal(),50);
}
function retirementPanel(){
  if(!G)return "";
  const seq=getSequence(),last=seq[seq.length-1];
  if(phase().id!=="decline")return "";
  if(G.retired)return `<div class="card retireCard"><div class="kicker gold">■ CAREER COMPLETE</div><h2>拳擊生涯已結束</h2><p>${esc(G.retireReason||"你正式結束拳擊生涯。")}</p><button class="retireBtn" onclick="careerRecordModal()">查看生涯紀錄與分享圖</button></div>`;
  if(G.stageStory && G.turnInPhase>=phase().turns){
    return `<div class="card retireCard"><div class="kicker gold">■ 生涯最後選擇</div><h2>這一段拳擊人生，走到最後了</h2><p>你可以把最後的大賽當成告別，也可以現在就結束。無論最後戰績如何，所有高中、大學／工作、職業拳擊經歷都會整理成一份生涯紀錄。</p><button class="retireBtn" onclick="retireCareer('在生涯後段完成最後一輪挑戰後正式引退。')">正式引退並結算生涯</button></div>`;
  }
  return "";
}

// wrap logics so important moments enter career history
const V26_oldCreateGame=createGame;
createGame=function(){
  V26_oldCreateGame();
  ensureCareerData();
  addCareerRecord("高一海外留學",`${G.name} 從台灣前往 ${COUNTRIES[G.country].name}・${G.base}，開始高中拳擊人生。`,"stage");
  save();
};

const V26_oldResolveEvent=resolveEvent;
resolveEvent=function(ev,ch,roll){
  V26_oldResolveEvent(ev,ch,roll);
  ensureCareerData();G.careerStats.totalEvents++;
  if(ev.special){
    G.careerStats.specialEvents++;
    addCareerRecord(ev.title,`選擇「${ch.label}」，命運骰 ${roll}。${G.result.text}`,"special");
  }
  updateCareerPeaks();
  save();
};

const V26_oldResolveFight=resolveFight;
resolveFight=function(ev,ch,roll){
  const beforeA=`${G.amateur.w}-${G.amateur.l}`,beforeP=proRecord();
  V26_oldResolveFight(ev,ch,roll);
  ensureCareerData();G.careerStats.fights++;
  addCareerRecord(ev.title,`${G.result.text}｜業餘 ${amateurRecord()}｜職業 ${proRecord()}`,"fight");
  updateCareerPeaks();
  save();
};

const V26_oldResolveSpecial=resolveSpecial;
resolveSpecial=function(ev,ch,roll){
  V26_oldResolveSpecial(ev,ch,roll);
  addCareerRecord(ev.title,`選擇「${ch.label}」。${G.result.text}`,"choice");
  updateCareerPeaks();save();
};

const V26_oldContinue=continueAfterResult;
continueAfterResult=function(){
  const wasDone=G.result?.stageDone;
  const oldPhase=phase()?.name;
  V26_oldContinue();
  if(wasDone && !G.retired){
    addCareerRecord("進入新階段",`結束「${oldPhase}」，進入「${phase().name}」。`,"stage");
    save();
  }
};

// augment main render
const V26_oldRender=render;
render=function(){
  V26_oldRender();
  if(!G)return;
  ensureCareerData();updateCareerPeaks();

  // left menu: convert 生涯事件 menu to add clickable 生涯紀錄 item
  const menus=document.querySelectorAll(".menu div");
  if(menus.length){
    let exists=[...menus].some(x=>x.textContent.includes("生涯紀錄"));
    if(!exists){
      const anchor=[...menus].find(x=>x.textContent.includes("數據"))||menus[menus.length-1];
      anchor.insertAdjacentHTML("afterend",`<div class="careerBtn" onclick="careerRecordModal()">▣ 生涯紀錄</div>`);
    }
  }

  // insert compact record box in center
  const content=document.querySelector(".content");
  if(content && !document.getElementById("careerMini")){
    const p=document.createElement("div");p.id="careerMini";p.className="card";
    const last=G.careerHistory[0];
    p.innerHTML=`<div class="kicker">■ 生涯紀錄</div>
      <p>業餘 <b>${amateurRecord()}</b>　職業 <b>${proRecord()}</b>　最高 OVR <b>${G.careerStats.peakOvr}</b>　重大紀錄 <b>${G.careerHistory.length}</b> 筆。</p>
      ${last?`<p style="margin-top:7px;color:#91a69a;font-size:12px">最近：${esc(last.year+" · "+last.title)}</p>`:""}
      <button class="retireBtn" style="padding:9px;margin-top:9px" onclick="careerRecordModal()">打開完整生涯紀錄</button>`;
    content.appendChild(p);
  }
  const ret=retirementPanel();
  if(ret && content){
    const holder=document.createElement("div");
    holder.innerHTML=ret;content.appendChild(holder.firstElementChild);
  }
};
</script>
