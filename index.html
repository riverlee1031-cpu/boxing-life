<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxing Life V18 · Yakyo Style</title>
<style>
:root{
  --bg:#061814;
  --bg2:#0a241e;
  --panel:#0f2f28;
  --panel2:#13392f;
  --panel3:#11261f;
  --line:#285645;
  --gold:#f3c14d;
  --ink:#f1efe6;
  --dim:#a9b7ae;
  --faint:#6f897d;
  --accent:#68c994;
  --red:#ff7b7b;
  --cyan:#7fd5cf;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:linear-gradient(180deg,#061511,#081d18 40%,#061511);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
#app{min-height:100vh}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0a2a22,#09231d);border-right:1px solid #1f4b3d;padding:24px 22px;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:900;font-size:42px;letter-spacing:-2px;line-height:1}
.brand .ball{color:var(--gold)}
.brand-sub{font-size:12px;color:var(--faint);letter-spacing:.35em;margin-top:4px}
.side-card{border-top:1px solid #2d5e4e;padding-top:18px}
.side-mini{font-size:12px;color:var(--faint);line-height:1.7}
.timeline-node{position:relative;padding-left:18px;color:#d8d9c8;font-weight:700;margin:12px 0}
.timeline-node::before{content:"";position:absolute;left:0;top:2px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(243,193,77,.15)}
.timeline-node::after{content:"";position:absolute;left:4px;top:-18px;bottom:-18px;width:2px;background:#275342;z-index:-1}
.nav-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.nav-item{padding:12px 14px;border:1px solid transparent;border-radius:14px;background:transparent;color:#dce5df;font-weight:800;text-align:left}
.nav-item.active,.nav-item:hover{background:linear-gradient(180deg,#1e462f,#173b28);border-color:#476f47;color:#fff}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{padding:22px 26px;border-bottom:1px solid #214638;background:linear-gradient(90deg,#0e2b23,#143b2f)}
.player-grid{display:grid;grid-template-columns:1.25fr repeat(4,1fr) 92px;gap:10px;align-items:stretch}
.identity{display:flex;gap:14px;align-items:center}
.avatar{width:82px;height:82px;border-radius:18px;background:linear-gradient(180deg,#10261f,#0a1814);border:1px solid #43664f;display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:34px;box-shadow:inset 0 0 0 3px rgba(243,193,77,.08)}
.id-main h1{margin:0;font-size:40px;line-height:1;font-weight:900;letter-spacing:-1px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.badge{padding:4px 8px;border-radius:10px;border:1px solid #58785d;background:#123124;color:#f8efc7;font-size:12px;font-weight:800}
.meta-line{margin-top:6px;color:#d2dccf;font-size:13px}
.stat-card{background:linear-gradient(180deg,#173f2d,#123425);border:1px solid #2a5b43;border-radius:14px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.stat-card .v{font-size:18px;font-weight:900;color:var(--gold)}
.stat-card .k{font-size:12px;color:#a0b4a4;margin-top:4px}
.menu-btn{border:1px dashed #46684f;border-radius:18px;display:grid;place-items:center;color:#f0d58b;background:rgba(12,39,29,.7)}
.center-area{padding:20px 26px 26px;display:flex;flex-direction:column;gap:14px}
.stage-banner{background:linear-gradient(180deg,#132219,#111a16);border:1px solid #7f5c11;border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px rgba(243,193,77,.08) inset}
.stage-banner h2{margin:0;font-size:14px;color:#ffe28e;letter-spacing:.08em}
.stage-banner p{margin:6px 0 0;color:#d6d1ba;font-size:13px}
.story-card{background:linear-gradient(180deg,#0e2b23,#0b231d);border:1px solid #285646;border-radius:16px;padding:16px}
.story-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.story-tag{font-size:12px;font-weight:900;color:#7cc7ff;letter-spacing:.12em}
.story-title{font-size:18px;font-weight:900;margin-top:4px}
.story-date{font-size:12px;color:#9eb2a6}
.story-text{color:#ebefe8;line-height:1.85;font-size:15px;white-space:pre-line}
.story-hint{font-size:12px;color:#a4b5ac;margin-top:8px}
.story-image{margin:12px 0 8px;border:1px solid #395b51;border-radius:16px;overflow:hidden;background:#000}
.story-image img{display:block;width:100%;height:auto}
.rightbar{padding:20px 20px 24px;border-left:1px solid #214638;background:linear-gradient(180deg,#0b211b,#0b1915)}
.panel{background:linear-gradient(180deg,#161839,#111227);border:1px solid #473f7c;border-radius:16px;padding:16px;margin-bottom:12px}
.panel h3{margin:0 0 12px;font-size:12px;color:#ff768f;letter-spacing:.12em}
.panel.green{background:linear-gradient(180deg,#14372b,#10281f);border-color:#305a47}
.panel.green h3{color:#9be3c0}
.record-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rec{background:#112920;border:1px solid #295241;border-radius:12px;padding:10px}
.rec .num{font-size:22px;font-weight:900;color:var(--gold)}
.rec .lab{font-size:12px;color:#9daf9f;margin-top:2px}
.attr{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;margin-bottom:10px}
.bar{height:10px;background:#232347;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff7b7b,#f3c14d)}
.action-btn{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #527d61;background:linear-gradient(180deg,#295740,#204534);color:#f2f0e8;font-weight:900;margin-top:10px}
.action-btn.alt{background:linear-gradient(180deg,#283250,#1a2238);border-color:#58648c}
.action-btn.warn{background:linear-gradient(180deg,#5e332d,#43211d);border-color:#8c5349}
.offer{background:linear-gradient(180deg,#26224d,#1a1836);border:1px solid #554c8c;border-radius:16px;padding:14px;margin-top:12px}
.offer .name{font-size:16px;font-weight:900}
.offer .sub{font-size:12px;color:#b9b7d6;margin:5px 0 12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid #7f6323;color:#ffde8b;background:rgba(243,193,77,.1);font-weight:800}
.setup-wrap{display:grid;place-items:center;min-height:100vh;padding:24px}
.setup{width:min(960px,100%);background:linear-gradient(180deg,#0f2c24,#0d211c);border:1px solid #2c5949;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.setup-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
.setup h1{font-size:54px;line-height:1;margin:0 0 10px;letter-spacing:-2px}
.setup p{color:#b7c4bc;line-height:1.8}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#dce7e0;font-weight:800;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;background:#0a1b17;color:#f1efe6;border:1px solid #355f50;border-radius:14px}
.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{padding:14px;border-radius:16px;border:1px solid #3b6958;background:linear-gradient(180deg,#133127,#10261f);text-align:left;color:#f6f2e8}
.choice.active{border-color:#d5aa45;box-shadow:0 0 0 1px rgba(243,193,77,.15) inset;background:linear-gradient(180deg,#203d2d,#173326)}
.choice .tt{font-size:15px;font-weight:900}
.choice .ss{font-size:12px;color:#bcc7c1;margin-top:4px;line-height:1.5}
.small-note{font-size:12px;color:#9eafa6}
.footer-note{margin-top:8px;color:#6d8579;font-size:12px}
@media (max-width:1200px){.layout{grid-template-columns:220px minmax(0,1fr)}.rightbar{grid-column:1 / -1;border-left:0;border-top:1px solid #214638}}
@media (max-width:860px){.layout{display:block}.sidebar,.rightbar{padding:18px}.topbar{padding:18px}.center-area{padding:18px}.player-grid{grid-template-columns:1fr 1fr}.identity{grid-column:1 / -1}.setup-grid{grid-template-columns:1fr}.choice-row{grid-template-columns:1fr}}
</style>
</head>

    if(totalMonths() < 36) return '海外業餘三年目';
    return '是否轉職業';
  }
  const pf = G.pro.w + G.pro.l;
  if(G.age >= 35) return '衰退期';
  if(pf < 5) return '職業新人';
  if(pf < 12) return '地區排名';
  if(pf < 20) return '世界挑戰';
  return '生涯巔峰';
}
function stageDescription(){
  const map = {
    '海外業餘一年目':'來自台灣的高中畢業生，正在適應海外生活與業餘拳擊節奏。',
    '海外業餘二年目':'身體與節奏慢慢進入狀況，開始累積更像樣的業餘戰績。',
    '海外業餘三年目':'最後一年業餘期，你的一舉一動都決定能否順利踏進職業圈。',
    '是否轉職業':'三年養成告一段落，是否簽下職業合約，改寫你的拳擊人生。',
    '職業新人':'你剛踏上職業舞台，每一場比賽都在建立名片。',
    '地區排名':'你已經不是菜鳥，開始被拿來和真正的地區好手相比。',
    '世界挑戰':'名氣與壓力同步上升，你正在往世界排名靠近。',
    '生涯巔峰':'能力、經驗與名氣都來到高點，這是最接近冠軍的時期。',
    '衰退期':'恢復速度開始變慢，每一次選擇都更珍貴。',
    '引退':'比賽已經結束，但故事不會消失。'
  };
  return map[currentStage()] || '';
}
function rollDie(){ const n = 1 + Math.floor(Math.random()*6); G.dice.rolls++; G.dice.sum += n; G.dice.last = n; if(n===1) G.dice.ones++; if(n===6) G.dice.sixes++; return n; }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(s){ return String(s).replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
function addLog(obj){ G.logs.unshift(Object.assign({time:dateLabel()}, obj)); }
function dateLabel(){ return `${G.year} · ${seasonLabel()} · ${G.age}歲`; }
function maybeLevelAging(){ const prevAge = G.age; G.age = 18 + Math.floor(G.monthIndex/12); G.year = 2026 + Math.floor(G.monthIndex/12); if(G.age !== prevAge){ addLog({category:'LIFE', title:`迎來 ${G.age} 歲`, text:`你在 ${route().country} 度過了新的生日。這一年，無論好壞，都是拳擊人生的一部分。`, major:false}); }
  if(!G.proTurned && G.monthIndex >= 36 && !G.pendingTurnPro){ G.pendingTurnPro = true; addLog({category:'CAREER', title:'三年養成結束，站上分岔路', text:`你在 ${route().country} 的三年養成告一段落。現在，經紀人問你：要不要正式轉職業？`, major:true, image: 'media'}); }
  if(G.proTurned && G.age >= 38 && !G.retired && (G.pro.w + G.pro.l) >= 18 && Math.random()<0.22){ addLog({category:'LATE CAREER', title:'引退的念頭開始浮現', text:'身體恢復速度不再像以前那麼快。你知道，最後幾年將會比任何時候都更需要取捨。', major:false}); }
}
function statGain(key, amt){ G.stats[key] = Math.max(30, Math.min(99, G.stats[key] + amt)); }
function advanceMonth(mode='train'){
  if(G.retired) return;
  const d = rollDie();
  G.monthIndex += 1;
  maybeLevelAging();
  if(G.pendingFight){
    G.pendingFight.weeks -= 1;
    if(G.pendingFight.weeks > 0){
      const t = d>=5 ? '備戰狀態很不錯，訓練強度與節奏都抓得住。' : d<=2 ? '備戰有些疲勞堆積，但你還是撐完了今天的課表。':'這個月的備戰按部就班，教練持續修正你的節奏。';
      if(d>=5) statGain('stamina',1);
      if(d===6) statGain('tech',1);
      G.health = Math.max(72, G.health - (d<=2?3:1));
      addLog({category:'FIGHT CAMP', title:`備戰 ${G.pendingFight.opponent}`, text:`${t}\n距離比賽還有 ${G.pendingFight.weeks} 個月。`, major:false});
    } else {
      resolveFight(d);
    }
    save(); render(); return;
  }
  if(mode==='rest'){
    G.health = Math.min(100, G.health + 7 + (d>=5?2:0));
    G.morale = Math.min(100, G.morale + 4);
    addLog({category:'REST', title:'短暫調整', text:`你給自己一段喘息時間。身體恢復了一些，心也重新穩定下來。\n命運骰：${d}`, major:false});
  } else {
    // training / life progress
    const gains = d>=5 ? 2 : 1;
    const keys = d>=5 ? ['power','tech'] : d<=2 ? ['defense'] : ['stamina'];
    keys.forEach(k=>statGain(k,gains));
    G.morale = Math.min(100, Math.max(48, G.morale + (d>=5?2:-1)));
    G.health = Math.max(58, G.health - (d===1?5:2));
    if(d===6 && Math.random()<0.55){
      const ev = rand(MAJOR_EVENT_POOL);
      if(ev.id==='injury'){ G.health = Math.max(45, G.health - 12); G.morale = Math.max(45, G.morale - 6); }
      if(ev.id==='viral'){ G.fame += 5; }
      if(ev.id==='romance'){ G.fame += 3; G.morale += 4; }
      if(ev.id==='title' && G.proTurned){ G.fame += 4; }
      if(ev.id==='camp'){ statGain('tech',2); statGain('stamina',1); }
      addLog({category:ev.category, title:ev.title, text:ev.text, major:true, image:ev.image});
    } else {
      const extra = Math.random()<0.5 ? rand(MINOR_EVENTS.general) : rand(MINOR_EVENTS[G.routeKey]);
      addLog({category:'TEXT EVENT', title:d>=5?'訓練進展':'日常推進', text:`${extra}\n命運骰：${d}`, major:false});
    }
  }
  save(); render();
}
function createFightOffer(){
  if(G.retired || G.pendingFight) return;
  const isPro = G.proTurned;
  const rec = isPro ? `${G.pro.w}-${G.pro.l}` : `${G.amateur.w}-${G.amateur.l}`;
  const opp = rand(route().names);
  const rounds = isPro ? rand(FIGHT_BOUTS.slice(1, Math.min(5, 1+Math.floor((G.pro.w+G.pro.l)/3)+2))) : rand(['3回合','3回合','4回合']);
  const base = isPro ? Math.max(38, ovr()-8 + Math.floor(Math.random()*16)) : Math.max(34, ovr()-10 + Math.floor(Math.random()*14));
  G.pendingFight = { opponent:opp, rounds, oppOvr:base, weeks:2, isPro, titleShot: isPro && G.pro.w>=8 && Math.random()<0.18 };
  if(G.pendingFight.titleShot) G.pendingFight.rounds = rand(['8回合','10回合']);
  addLog({category:'MATCH', title:'你接下了一場比賽', text:`對手：${opp}　｜　形式：${rounds}\n從現在開始，你將進入備戰狀態；一般事件會暫停，直到這場比賽結束。`, major:false});
  save(); render();
}
function cancelFight(){ if(!G.pendingFight) return; addLog({category:'MATCH', title:'取消比賽', text:'你取消了這場比賽安排，普通事件重新恢復推進。', major:false}); G.pendingFight=null; save(); render(); }
function resolveFight(seedRoll){
  const f = G.pendingFight; if(!f) return;
  const roll = seedRoll || rollDie();
  const playerScore = ovr() + roll*4 + (G.morale-65)/4 + (G.health-75)/5 + (f.isPro?2:0);
  const oppScore = f.oppOvr + (1+Math.floor(Math.random()*6))*4;
  const win = playerScore >= oppScore;
  const ko = win && Math.random() < Math.max(.15, (G.stats.power + G.stats.tech - 95)/120);
  const titleWin = f.titleShot && win;
  if(f.isPro){ if(win) G.pro.w++; else G.pro.l++; if(ko && win) G.pro.ko++; }
  else { if(win) G.amateur.w++; else G.amateur.l++; if(ko && win) G.amateur.ko++; }
  if(win){ G.morale = Math.min(100, G.morale + 7); G.fame += f.titleShot ? 6 : 2; G.money += f.isPro ? (f.titleShot?2500:700) : 120; G.points += 1; }
  else { G.morale = Math.max(35, G.morale - 6); G.health = Math.max(42, G.health - 8); }
  const rec = f.isPro ? `${G.pro.w}-${G.pro.l}` : `${G.amateur.w}-${G.amateur.l}`;
  const body = win
    ? `你擊敗了 ${f.opponent}，留下了一場 ${ko?'漂亮的 KO':'紮實的勝利'}。\n目前戰績：${rec}\n獲得自由點數 +1。`
    : `你輸給了 ${f.opponent}。這場比賽不如預期，但生涯不會因此停下來。\n目前戰績：${rec}`;
  addLog({category:f.titleShot?'TITLE BOUT':'BOUT', title: win? (f.titleShot? '拿下關鍵勝利':'比賽獲勝') : '比賽失利', text: body, major: !!(f.titleShot || (f.isPro && (G.pro.w+G.pro.l)<=2) || (!f.isPro && (G.amateur.w+G.amateur.l)<=1)), image: win ? (titleWin?'world':'fight') : 'fight'});
  if(titleWin){ G.titleCount += 1; addLog({category:'CHAMPION', title:'你拿下了第一條重要腰帶', text:'這一夜，名字終於開始被更多人記住。你不再只是旅外的台灣拳手，而是一個被認真看待的挑戰者。', major:true, image:'world'}); }
  G.pendingFight = null;
  save(); render();
}
function turnPro(){
  if(!G.pendingTurnPro || G.proTurned) return;
  G.proTurned = true; G.pendingTurnPro = false; G.fame += 4; G.money += 1000;
  addLog({category:'CAREER', title:'你正式轉職業', text:`在 ${route().country} 的三年養成之後，你簽下了職業合約。從今天開始，記錄你的不只是夢想，還有每一場真正的職業比賽。`, major:true, image:'media'});
  save(); render();
}
function retireNow(){
  if(G.retired) return;
  G.retired = true;
  G.retireText = `業餘 ${G.amateur.w}-${G.amateur.l} ／ 職業 ${G.pro.w}-${G.pro.l} ／ KO ${G.pro.ko + G.amateur.ko} ／ 重要腰帶 ${G.titleCount} 條。`;
  addLog({category:'RETIRE', title:'你選擇了引退', text:`你脫下手套，回頭看這一路的曲折與光亮。\n${G.retireText}`, major:true, image:'world'});
  save(); render();
}
function spendPoint(attr){ if(G.points<=0) return; statGain(attr,1); G.points--; save(); render(); }
function startFromForm(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const name = (fd.get('name') || '').toString().trim() || '李逍遙';
  const styleKey = fd.get('style');
  const routeKey = fd.get('route');
  G = newGame(name, styleKey, routeKey);
  addLog({category:'PROLOGUE', title:'序章 · 離開台灣的那一天', text:`2026 年春，你從台灣高中畢業，18 歲，帶著拳套與一點不確定，選擇前往 ${ROUTES[routeKey].country} 展開留學與拳擊養成生活。\n你知道，這一趟不是旅行，而是決定拳擊人生走向的第一步。`, major:true, image:ROUTES[routeKey].image});
  addLog({category:'LIFE', title:'新的起點', text:`你以台灣高中畢業生的身份來到 ${ROUTES[routeKey].city}。未來三年，你將一邊適應海外生活，一邊累積業餘拳擊實力。`, major:false});
  save(); render();
}
function routeSteps(){
  return [
    '台灣高中畢業',
    `${route().label} · ${route().country}`,
    currentStage(),
    G.proTurned ? '職業生涯進行中' : '業餘養成中',
    G.retired ? '引退完成' : '故事仍在繼續'
  ];
}
function renderSetup(){
  const styleCards = Object.entries(STYLES).map(([k,v],i)=>`<button type="button" class="choice ${i===0?'active':''}" data-style="${k}"><div class="tt">${v.label}</div><div class="ss">力量 ${v.base.power} / 速度 ${v.base.speed} / 技術 ${v.base.tech}</div></button>`).join('');
  const routeCards = Object.entries(ROUTES).map(([k,v],i)=>`<button type="button" class="choice ${i===0?'active':''}" data-route="${k}"><div class="tt">${v.label}</div><div class="ss">${v.country} · ${v.city}<br>18 歲從台灣出發</div></button>`).join('');
  app.innerHTML = `<div class="setup-wrap"><div class="setup"><div class="setup-grid"><div><div class="brand">Boxing<span class="ball">◎</span>Life</div><div class="brand-sub">台灣高中畢業生・海外拳擊人生模擬器</div><h1>18 歲，從台灣出發。</h1><p>參考你要的橫版養成風格，這版從 <b>台灣高中畢業</b>開始，18 歲直接踏上旅外拳擊路。你可以在 <b>旅日 / 旅美 / 旅菲</b> 三條路線中選一條，三年養成後再進入職業、巔峰、衰退與引退。</p><p>這次改成：<br>・<b>重大事件才有圖片</b><br>・其他日常與訓練事件都用文字推進<br>・接下比賽後一般事件會暫停，直到比賽打完</p></div><div><form id="startForm"><div class="field"><label>拳手名字</label><input name="name" value="李逍遙" maxlength="14"></div><div class="field"><label>拳風</label><input type="hidden" name="style" id="styleInput" value="pressure"><div class="choice-row">${styleCards}</div></div><div class="field"><label>留學路線</label><input type="hidden" name="route" id="routeInput" value="USA"><div class="choice-row">${routeCards}</div></div><button class="action-btn" style="margin-top:18px">開始人生</button><div class="footer-note">台灣高中生 → 旅日 / 旅美 / 旅菲 → 業餘養成 → 職業賽 → 巔峰 → 衰退與引退</div></form></div></div></div></div>`;
  document.querySelectorAll('[data-style]').forEach(btn=>btn.onclick=()=>{document.getElementById('styleInput').value=btn.dataset.style;document.querySelectorAll('[data-style]').forEach(b=>b.classList.toggle('active',b===btn));});
  document.querySelectorAll('[data-route]').forEach(btn=>btn.onclick=()=>{document.getElementById('routeInput').value=btn.dataset.route;document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b===btn));});
  document.getElementById('startForm').onsubmit = startFromForm;
}
function statBar(label, key){ const val=G.stats[key]; return `<div class="attr"><div>${label}</div><div class="bar"><i style="width:${val}%"></i></div><div>${val}</div></div>`; }
function logCard(item){
  return `<div class="story-card"><div class="story-head"><div><div class="story-tag">${esc(item.category||'EVENT')}</div><div class="story-title">${esc(item.title||'')}</div></div><div class="story-date">${esc(item.time||'')}</div></div>${item.major && item.image ? `<div class="story-image"><img src="${IMAGES[item.image]}" alt="${esc(item.title)}"></div>`:''}<div class="story-text">${esc(item.text||'')}</div></div>`;
}
function renderMain(){
  const pRec = `${G.pro.w}-${G.pro.l}`;
  const aRec = `${G.amateur.w}-${G.amateur.l}`;
  const avgDice = G.dice.rolls ? (G.dice.sum / G.dice.rolls).toFixed(1) : '0.0';
  const fightOffer = G.pendingFight ? `<div class="offer"><div class="pill">備戰中</div><div class="name" style="margin-top:8px">${esc(G.pendingFight.opponent)}</div><div class="sub">${route().country} · ${G.pendingFight.rounds} · OVR ${G.pendingFight.oppOvr}${G.pendingFight.titleShot?' · 冠軍機會':''}<br>距離比賽：${G.pendingFight.weeks} 個月</div><button class="action-btn" onclick="advanceMonth('camp')">推進備戰</button><button class="action-btn warn" onclick="cancelFight()">取消比賽</button></div>` : `<button class="action-btn" onclick="createFightOffer()">安排下一場比賽</button>`;
  const turnProBox = G.pendingTurnPro && !G.proTurned ? `<div class="offer"><div class="pill">生涯分岔</div><div class="name" style="margin-top:8px">是否轉職業？</div><div class="sub">三年養成已結束，你可以選擇簽下第一紙職業合約。</div><button class="action-btn" onclick="turnPro()">接受職業合約</button></div>` : '';
  const retireBox = (G.proTurned && G.age>=36 && !G.retired) ? `<button class="action-btn alt" onclick="retireNow()">選擇引退</button>` : '';
  const currentLogs = G.logs.slice(0, 12).map(logCard).join('');
  app.innerHTML = `<div class="layout"><aside class="sidebar"><div><div class="brand">Boxing<span class="ball">◎</span>Life</div><div class="brand-sub">拳擊人生模擬器</div></div><div class="side-card"><div class="side-mini">台灣高中畢業生 ・ ${route().country}</div>${routeSteps().map(s=>`<div class="timeline-node">${esc(s)}</div>`).join('')}</div><div class="nav-list"><button class="nav-item active">📖 事件劇情</button><button class="nav-item">🥊 生涯階段</button><button class="nav-item">📅 時間線</button><button class="nav-item">📊 數據</button><button class="nav-item">🏅 成就</button><button class="nav-item" onclick="save()">💾 儲存</button><button class="nav-item" onclick="resetGame()">↺ 重開人生</button></div><div style="margin-top:auto" class="side-mini">SEED · 台灣高中生旅外拳擊線<br>${G.year} · ${seasonLabel()}<br>重大事件顯示圖片，其他事件以文字推進</div></aside><main class="main"><div class="topbar"><div class="player-grid"><div class="identity"><div class="avatar">${esc((G.name||'李').slice(0,1))}</div><div class="id-main"><h1>${esc(G.name)}</h1><div class="badges"><span class="badge">拳手</span><span class="badge">${style().label}</span></div><div class="meta-line">18 歲從台灣出發 · ${route().label} · ${route().country} / ${route().city}</div></div></div><div class="stat-card"><div class="v">${G.age}</div><div class="k">年齡</div></div><div class="stat-card"><div class="v">${G.year}</div><div class="k">年份</div></div><div class="stat-card"><div class="v">${ovr()}</div><div class="k">綜合</div></div><div class="stat-card"><div class="v">$${G.money}</div><div class="k">收入</div></div><div class="menu-btn">☰</div></div></div><div class="center-area"><div class="stage-banner"><h2>目前階段：${currentStage()}</h2><p>${stageDescription()}　｜　業餘戰績 ${aRec}　｜　職業戰績 ${pRec}　｜　自由點數 ${G.points}</p></div>${currentLogs || `<div class="story-card"><div class="story-text">還沒有事件記錄。</div></div>`}</div></main><aside class="rightbar"><div class="panel green"><h3>CAREER</h3><div class="record-grid"><div class="rec"><div class="num">${aRec}</div><div class="lab">業餘戰績</div></div><div class="rec"><div class="num">${pRec}</div><div class="lab">職業戰績</div></div><div class="rec"><div class="num">${G.titleCount}</div><div class="lab">重要腰帶</div></div><div class="rec"><div class="num">${G.points}</div><div class="lab">可用點數</div></div></div></div><div class="panel"><h3>ATTRIBUTES</h3>${statBar('力量','power')}${statBar('速度','speed')}${statBar('體能','stamina')}${statBar('防守','defense')}${statBar('抗擊打','chin')}${statBar('技術','tech')}${G.points>0?`<div class="record-grid" style="margin-top:12px"><button class="action-btn alt" onclick="spendPoint('power')">+力量</button><button class="action-btn alt" onclick="spendPoint('speed')">+速度</button><button class="action-btn alt" onclick="spendPoint('stamina')">+體能</button><button class="action-btn alt" onclick="spendPoint('tech')">+技術</button></div>`:''}</div><div class="panel"><h3>DICE / CHOICES</h3><div class="record-grid"><div class="rec"><div class="num">${G.dice.last||'-'}</div><div class="lab">上一顆骰子</div></div><div class="rec"><div class="num">${avgDice}</div><div class="lab">平均骰值</div></div><div class="rec"><div class="num">${G.dice.ones}</div><div class="lab">骰到 1</div></div><div class="rec"><div class="num">${G.dice.sixes}</div><div class="lab">骰到 6</div></div></div><button class="action-btn" onclick="advanceMonth('train')" ${G.pendingFight?'disabled style="opacity:.45;cursor:not-allowed"':''}>推進一個月</button><button class="action-btn alt" onclick="advanceMonth('rest')" ${G.pendingFight?'disabled style="opacity:.45;cursor:not-allowed"':''}>休息調整</button>${turnProBox}${fightOffer}${retireBox}</div>${G.retired?`<div class="panel green"><h3>RETIREMENT</h3><div class="story-text" style="font-size:14px">${esc(G.retireText || '你的拳擊人生已經告一段落。')}</div></div>`:''}</aside></div>`;
}
function render(){ if(!G || !G.started) renderSetup(); else renderMain(); }
render();
window.advanceMonth=advanceMonth; window.createFightOffer=createFightOffer; window.cancelFight=cancelFight; window.turnPro=turnPro; window.retireNow=retireNow; window.resetGame=resetGame; window.save=save; window.spendPoint=spendPoint;
</script>
</body>
