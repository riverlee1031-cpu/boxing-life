<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Boxing Life V22 · Career Rhythm</title>
<style>
:root{
  --bg:#072218;
  --bg2:#04140f;
  --bg3:#0f3428;
  --panel:#0d2f24;
  --panel2:#123b2d;
  --line:#2e5a49;
  --line2:#3d6a58;
  --gold:#f2c455;
  --ink:#eef1e3;
  --dim:#a6b8ad;
  --faint:#769082;
  --good:#7fdb8d;
  --bad:#ff7c73;
  --accent:#8fd6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:
  linear-gradient(180deg,#072117,#04150f 65%),
  repeating-linear-gradient(120deg,rgba(255,255,255,.02) 0 2px,transparent 2px 24px);
}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:250px minmax(420px,1fr) 380px;min-height:100vh;max-width:1480px;margin:0 auto;border-left:1px solid #1c4638;border-right:1px solid #1c4638;background:rgba(0,0,0,.12)}
.left{background:linear-gradient(180deg,#08251a,#062117);border-right:1px solid #214b3b;padding:22px 22px 14px;display:flex;flex-direction:column}
.brand{font-weight:1000;font-size:58px;line-height:.9;letter-spacing:-3px;text-align:center}
.brand .ball{font-size:.65em;vertical-align:middle;display:inline-block;transform:translateY(-2px)}
.sub{margin-top:10px;text-align:center;color:var(--faint);font-size:10px;letter-spacing:.38em;padding-bottom:16px;border-bottom:1px solid #214b3b}
.side-group{margin-top:22px}
.side-school{color:#dce0d3;font-size:14px;font-weight:800}
.side-school small{display:block;color:var(--faint);font-size:11px;font-weight:700;margin-top:6px}
.timeline{margin-top:18px;padding-left:25px;position:relative}
.timeline:before{content:"";position:absolute;left:9px;top:2px;bottom:4px;width:1px;background:#50705f}
.node{position:relative;padding:0 0 18px 0}
.node:before{content:"";position:absolute;left:-25px;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid #6c8377;background:#08251a}
.node.active:before{border-color:var(--gold);box-shadow:0 0 10px rgba(242,196,85,.45)}
.node strong{display:block;font-size:13px;color:var(--ink)}
.node span{display:block;font-size:10px;color:var(--faint);margin-top:5px;line-height:1.5}
.menu{margin-top:24px;display:grid;gap:4px}
.menu div{padding:10px 12px;border-radius:8px;color:#c4d0c8;font-size:14px;font-weight:800}
.menu div.active{background:#163b2d;color:var(--gold)}
.seed{margin-top:auto;padding-top:16px;border-top:1px solid #214b3b;color:#7e9589;font-size:11px;line-height:1.9}
.seed b{color:var(--gold)}
.center{background:linear-gradient(180deg,#062018,#04140f 25%);border-right:1px solid #214b3b;display:flex;flex-direction:column}
.topbar{padding:18px 26px 14px;background:linear-gradient(180deg,#0d3024,#0b281f);border-bottom:1px solid #214b3b}
.topline{display:grid;grid-template-columns:60px 1fr auto auto;gap:12px;align-items:center}
.noBox{border:1px solid #8c7527;border-radius:12px;padding:7px 0;text-align:center;min-height:60px;background:rgba(255,214,100,.05)}
.noBox small{display:block;font-size:10px;letter-spacing:.18em;color:#c7c19c}.noBox b{display:block;font-size:34px;color:var(--gold);line-height:1.1}
.heroName b{display:block;font-size:26px;line-height:1.05}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.tag{border:1px solid #486a59;border-radius:6px;padding:4px 8px;font-size:11px;color:#d0dacf;font-weight:800}.tag.gold{border-color:#8c7527;color:var(--gold)}
.schoolRight{text-align:right;color:var(--faint);font-size:10px;font-weight:700}.schoolRight b{display:block;font-size:16px;color:var(--gold);margin-top:5px}
.menuBtn{width:46px;height:46px;border-radius:12px;background:#0f2f24;border:1px solid #496655;color:#d6ddd7;font-size:24px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr) 84px;gap:10px;margin-top:14px}
.metric{background:#133729;border:1px solid #2b5745;border-radius:12px;padding:10px;text-align:center}
.metric b{display:block;font-size:18px;color:var(--gold)}.metric span{display:block;font-size:11px;color:var(--faint);margin-top:4px}
.metric.detail{border-style:dashed;color:#9db2a6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.seasonRow{text-align:center;margin-top:10px;color:#6d8a7a;font-size:12px;font-weight:800}
.seasonDot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#335547;border:1px solid #507463}
.seasonDot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 9px rgba(242,196,85,.4)}
.mainScroll{padding:20px 26px 36px;overflow:auto}
.dateLine{text-align:center;color:#91a598;font-size:13px;letter-spacing:.35em;margin:12px 0 16px}
.card{background:linear-gradient(180deg,#0f3528,#0d2f24);border:1px solid #2d5b48;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card.major{border-color:#897229;box-shadow:0 0 0 1px rgba(242,196,85,.08) inset}
.kicker{font-size:12px;color:#9cb5aa;font-weight:900;letter-spacing:.12em;margin-bottom:8px}
.kicker.gold{color:var(--gold)}
.card h3{margin:0 0 8px;font-size:18px}
.card p{margin:0;color:#d6ddd6;font-size:15px;line-height:1.75}
.logItem{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}.logItem:last-child{border-bottom:0}
.logItem .when{font-size:10px;color:#6f8b7d;margin-bottom:4px}
.logItem .text{font-size:13px;color:#d5ddd6;line-height:1.7}
.startWrap{max-width:900px;margin:0 auto;padding:48px 18px}
.startHero{text-align:center;margin-bottom:20px}
.startHero h1{margin:0;font-size:64px;letter-spacing:-3px}
.startHero p{margin:12px auto 0;color:#bfd0c5;max-width:680px;line-height:1.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:linear-gradient(180deg,#11372a,#0d2d22);border:1px solid #2d5a48;border-radius:16px;padding:18px}.panel label{display:block;color:#ccd7d0;font-size:13px;font-weight:800;margin-bottom:8px}.panel input,.panel select{width:100%;background:#072117;border:1px solid #395b4d;color:var(--ink);border-radius:11px;padding:12px}.panel .row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.startBtn{width:100%;margin-top:18px;border:1px solid #8b7527;background:linear-gradient(180deg,#2b4c35,#20402d);color:#f3cd61;border-radius:14px;padding:16px;font-size:18px;font-weight:1000}
.right{padding:18px 18px 24px;background:linear-gradient(180deg,#0a281d,#082319);display:flex;flex-direction:column;gap:14px}
.sidePanel{background:linear-gradient(180deg,#12392c,#103327);border:1px solid #2c5947;border-radius:14px;padding:14px}
.sidePanel h4{margin:0 0 10px;font-size:12px;letter-spacing:.12em;color:#9db4a9}
.statusGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.miniStat{background:#163d2f;border:1px solid #2c5846;border-radius:10px;padding:10px;text-align:center}.miniStat b{display:block;color:var(--gold);font-size:16px}.miniStat span{display:block;font-size:11px;color:#81978c;margin-top:4px}
.statRow{margin-bottom:12px}.statRow:last-child{margin-bottom:0}.statHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:13px;font-weight:800}.statHead span{color:#dfe4df}.statHead b{color:#dfe4df}.bar{height:10px;background:#082017;border-radius:99px;overflow:hidden;border:1px solid #254939}.bar > i{display:block;height:100%;background:linear-gradient(90deg,#77d98a,#f0c554);border-radius:99px}
.actionBox{margin-top:auto}
.drawBtn,.nextBtn{width:100%;border-radius:14px;padding:18px 16px;font-size:27px;font-weight:1000;border:1px solid #6f6130;background:linear-gradient(180deg,#34553b,#274931);color:#f0f2e8}
.drawBtn small,.nextBtn small{display:block;font-size:13px;color:#b4c3ba;font-weight:700;margin-top:6px}
.choiceTitle{font-size:15px;color:#dce3dd;font-weight:900;margin-bottom:10px;line-height:1.55}
.choiceBtn{width:100%;text-align:left;background:linear-gradient(180deg,#153c2e,#123628);border:1px solid #456556;color:var(--ink);border-radius:14px;padding:14px 15px;margin-bottom:10px}
.choiceBtn b{display:block;font-size:18px;margin-bottom:5px}.choiceBtn span{display:block;color:#cdd6d0;font-size:13px;line-height:1.5}.choiceBtn em{display:block;color:#7fa192;font-size:12px;font-style:normal;margin-top:6px}
.choiceBtn:hover{border-color:#8b7527}
.resultBox{background:linear-gradient(180deg,#143b2d,#0d3024);border:1px solid #335c4a;border-radius:14px;padding:14px}.die{width:66px;height:66px;border-radius:16px;border:2px solid #c6baa0;background:#efe9da;color:#293f36;display:grid;place-items:center;font-size:34px;font-weight:1000;margin:10px auto 12px}.resultText{font-size:14px;line-height:1.75;color:#dce4dd;text-align:left}.deltaList{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.delta{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;border:1px solid #416454;background:#173a2d}.delta.good{color:var(--good);border-color:#2c7a43}.delta.bad{color:var(--bad);border-color:#8a4640}
.muted{color:#8ca295}
@media (max-width:1200px){.shell{grid-template-columns:220px minmax(0,1fr)}.right{grid-column:2;min-height:0}.actionBox{margin-top:0}.drawBtn,.nextBtn{font-size:24px}}
@media (max-width:820px){.shell{display:block}.left{display:none}.topline{grid-template-columns:54px 1fr auto}.schoolRight{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.metric.detail{display:none}.mainScroll{padding:14px}.topbar{padding:12px}.right{padding:12px}.grid2{grid-template-columns:1fr}}
</style>

<style id="v22-patch">
/* V22：更靠近參考圖的右側能力條與生涯節奏 */
.right{padding-top:26px}
.sidePanel.attributes{padding:0;background:transparent;border:0}
.attrCard{
  background:linear-gradient(180deg,#143b2d,#103326);
  border:1px solid #315a49;border-radius:11px;padding:11px 12px;margin-bottom:8px
}
.attrTop{display:grid;grid-template-columns:74px 1fr 58px;gap:10px;align-items:center}
.attrName{font-size:13px;font-weight:900;color:#e2e8e1}
.attrNum{text-align:right;font-weight:900;color:#e2e8e1;font-size:12px}
.attrNum span{color:#789486;font-weight:700}
.attrBar{height:8px;background:#061812;border-radius:99px;position:relative;overflow:visible}
.attrBar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#67d38a,#f3c856)}
.attrBar:after{
  content:"";position:absolute;top:-3px;bottom:-3px;left:66%;
  width:1px;background:#a88b2f;opacity:.9
}
.attrHint{
  grid-column:1/4;text-align:center;margin-top:6px;
  color:#d2b94f;font-size:9px;line-height:1.4
}
.rhythmBox{
  background:linear-gradient(180deg,#13382b,#0d3024);
  border:1px solid #315a49;border-radius:12px;padding:12px;margin-bottom:12px
}
.rhythmTitle{font-size:10px;letter-spacing:.12em;color:#8fa89a;font-weight:900;margin-bottom:8px}
.rhythmStep{display:flex;gap:8px;align-items:center;color:#cbd6cf;font-size:11px;margin:5px 0}
.rhythmStep i{width:8px;height:8px;border-radius:50%;background:#466858;display:inline-block}
.rhythmStep.on i{background:var(--gold);box-shadow:0 0 8px rgba(242,196,85,.45)}
.fightForecast{
  border-top:1px solid rgba(255,255,255,.06);margin-top:9px;padding-top:8px;
  color:#8ea396;font-size:10px;line-height:1.6
}
.card p b{color:var(--gold)}
</style>

</head>
<body>
<div id="app"></div>
<script>
const SAVE_KEY = 'boxing-life-v22-career-rhythm';
const COUNTRIES = {
  usa:{name:'美國', base:'Las Vegas', path:'旅美拳擊'},
  japan:{name:'日本', base:'東京', path:'旅日拳擊'},
  philippines:{name:'菲律賓', base:'宿霧', path:'旅菲拳擊'}
};
const STYLES = {pressure:'壓迫型', outboxer:'技巧型', slugger:'重砲型'};
const STAT_KEYS = ['power','speed','stamina','defense','chin','technique'];
const STAT_NAMES = {power:'力量',speed:'速度',stamina:'體能',defense:'防守',chin:'抗擊打',technique:'技術'};
const EVENT_DECK = [
  {id:'gym', cat:'事件 · 拳館', title:'球隊讀書會？不，是拳館晨練', desc:'教練突然宣布明天清晨 5 點加開晨練。這次訓練不只會影響體能，也會影響你在拳館的第一印象。', choices:[
      {label:'全力一搏', sub:'5點準時到，主動多做兩輪', rate:'成功率 35%｜加成／減益幅度大（±3）', mode:'aggressive', good:[['stamina',3],['fame',2],['morale',1]], mid:[['stamina',1]], bad:[['health',-4],['morale',-2]]},
      {label:'照常執行', sub:'正常完成訓練內容', rate:'成功率 50%｜標準幅度（±2）', mode:'balanced', good:[['stamina',2],['morale',1]], mid:[['stamina',1]], bad:[['morale',-1],['health',-2]]},
      {label:'保守應對', sub:'先跟上節奏，不逞強', rate:'成功率 70%｜加成／減益較小（±1）', mode:'safe', good:[['health',1],['stamina',1]], mid:[['morale',1]], bad:[['morale',-1]]}
  ]},
  {id:'study', cat:'事件 · 生活', title:'留學課業壓力上來了', desc:'期中報告與拳館訓練撞在一起。你要怎麼分配精力？', choices:[
      {label:'熬夜雙線硬扛', sub:'課業和訓練都不想放', rate:'成功率 35%｜高風險高回報', mode:'aggressive', good:[['technique',2],['fame',1]], mid:[['morale',-1]], bad:[['health',-4],['morale',-3]]},
      {label:'先顧課業再補訓', sub:'短期少練一些', rate:'成功率 50%｜穩定', mode:'balanced', good:[['morale',1],['technique',1]], mid:[], bad:[['stamina',-1],['morale',-1]]},
      {label:'請教練幫你調課', sub:'維持節奏不硬碰硬', rate:'成功率 70%｜低波動', mode:'safe', good:[['morale',2]], mid:[['morale',1]], bad:[['fame',-1]]}
  ]},
  {id:'spar', cat:'事件 · 拳館', title:'前輩臨時找你對打', desc:'館內資深拳手點名要跟你來幾回合。這是機會，也可能是教訓。', choices:[
      {label:'主動壓上去', sub:'用氣勢證明自己', rate:'成功率 35%｜可能一戰成名', mode:'aggressive', good:[['power',3],['fame',2]], mid:[['power',1]], bad:[['health',-5],['morale',-2]]},
      {label:'照教練策略打', sub:'穩穩完成對練', rate:'成功率 50%｜標準型', mode:'balanced', good:[['technique',2],['defense',1]], mid:[['technique',1]], bad:[['health',-3]]},
      {label:'先以防守為主', sub:'先看懂對手節奏', rate:'成功率 70%｜偏安全', mode:'safe', good:[['defense',2],['chin',1]], mid:[['defense',1]], bad:[['fame',-1]]}
  ]},
  {id:'social', cat:'事件 · 人際', title:'網紅主動約合作', desc:'當地小有名氣的網紅想拍你的訓練日常。這可能帶來名氣，也可能打亂節奏。', choices:[
      {label:'大方合作', sub:'趁機提高曝光', rate:'成功率 35%｜名氣波動大', mode:'aggressive', good:[['fame',4],['income',800]], mid:[['fame',2]], bad:[['morale',-2],['stamina',-1]]},
      {label:'有條件合作', sub:'只留部分拍攝時間', rate:'成功率 50%｜中庸', mode:'balanced', good:[['fame',2],['income',400]], mid:[['fame',1]], bad:[['morale',-1]]},
      {label:'先婉拒', sub:'把重心放在訓練', rate:'成功率 70%｜穩定', mode:'safe', good:[['stamina',1],['morale',1]], mid:[], bad:[['fame',-1]]}
  ]},
  {id:'diet', cat:'事件 · 生活', title:'飲食控制的抉擇', desc:'體重略微上升，教練提醒你該注意飲食。要狠一點還是慢慢調？', choices:[
      {label:'立刻嚴格控食', sub:'直接把作息跟飲食鎖死', rate:'成功率 35%｜大幅調整', mode:'aggressive', good:[['stamina',2],['speed',2]], mid:[['stamina',1]], bad:[['morale',-3],['health',-2]]},
      {label:'正常減量', sub:'逐步修正飲食', rate:'成功率 50%｜平衡型', mode:'balanced', good:[['speed',1],['stamina',1]], mid:[], bad:[['morale',-1]]},
      {label:'先從宵夜戒起', sub:'保守微調', rate:'成功率 70%｜低幅度', mode:'safe', good:[['morale',1],['speed',1]], mid:[], bad:[['speed',-1]]}
  ]},
  {id:'coach', cat:'事件 · 拳館', title:'教練額外留下你', desc:'訓練結束後，教練要你多留半小時。他覺得你有一些細節能再進步。', choices:[
      {label:'馬上加練', sub:'把握這次一對一機會', rate:'成功率 35%｜高回報', mode:'aggressive', good:[['technique',3],['fame',1]], mid:[['technique',1]], bad:[['health',-3],['morale',-2]]},
      {label:'按節奏加練', sub:'依教練安排做完', rate:'成功率 50%｜穩定', mode:'balanced', good:[['technique',2]], mid:[['technique',1]], bad:[['morale',-1]]},
      {label:'請教重點回去練', sub:'維持身體狀態', rate:'成功率 70%｜低風險', mode:'safe', good:[['morale',1],['technique',1]], mid:[], bad:[['fame',-1]]}
  ]}
];
let state = null;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const save=()=>localStorage.setItem(SAVE_KEY,JSON.stringify(state));
const load=()=>{try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch{return null}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ovr=()=>Math.round(STAT_KEYS.reduce((a,k)=>a+state.stats[k],0)/STAT_KEYS.length);
const currentSeasonLabel=()=>['季初','賽季中','季末'][state.seasonIndex];
const phaseLabel=()=>['第一年','第二年','第三年'][state.overseasYear-1] || '職業';
const titlePhase=()=>!state.isPro?`海外業餘 · ${phaseLabel()}`:(state.proStage==='debut'?'職業出道':'職業生涯');
const remainingEventText=()=>`抽事件卡（剩 ${state.cardsRemaining} 張）`;
function log(txt){state.logs.unshift({when:`${state.year} · ${currentSeasonLabel()}`,text:txt});state.logs=state.logs.slice(0,18)}
function createNew(form){const country=form.country;state={version:21,seed:Math.random().toString(36).slice(2,10),name:form.name||'李逍遙',style:form.style,country,base:COUNTRIES[country].base,age:18,year:2026,seasonIndex:0,cardsRemaining:2,overseasYear:1,turn:0,isPro:false,proStage:'none',amateur:{w:0,l:0},record:{w:0,l:0,d:0,ko:0},health:100,morale:70,fame:5,income:0,stats:{power:rnd(45,51),speed:rnd(45,51),stamina:rnd(45,51),defense:rnd(44,50),chin:rnd(45,52),technique:rnd(45,51)},currentEvent:null,result:null,logs:[],scheduledFight:null};log(`18 歲高中畢業，${state.name} 從台灣前往 ${COUNTRIES[country].name}・${state.base}，開始海外拳擊人生。`);save();render();}
function maybeScheduleFight(){if(state.scheduledFight)return;if(!state.isPro){if((state.turn===2&&state.overseasYear===1)||(state.turn>2&&state.turn%3===0))state.scheduledFight=generateFight(false);if(state.overseasYear>=3&&state.turn>=8&&state.amateur.w+state.amateur.l>=3)state.scheduledFight={type:'turn_pro'};}else{if(state.turn%2===0)state.scheduledFight=generateFight(true);}}
function generateFight(isPro){const pools={usa:['Marcus Johnson','Tyler Miller','Anthony Lewis','Isaiah Jackson','Jamal Wilson'],japan:['佐藤健太','中村隼人','高橋蓮','山口大地','伊藤優真'],philippines:['Mark Dela Cruz','Rico Santos','Jomari Flores','Paolo Reyes','Carlo Mendoza']};return{type:'fight',pro:isPro,title:isPro?'下一場職業賽':'下一場業餘賽',name:pick(pools[state.country]),ovr:!isPro?rnd(46,54):rnd(52,66),venue:`${COUNTRIES[state.country].name} · ${state.base}`,rounds:isPro?pick([4,6,8]):3,blurb:isPro?'團隊替你安排了下一場正式職業比賽。':'教練幫你排到下一場海外業餘賽。'};}
function buildScheduledEvent(){if(state.scheduledFight.type==='turn_pro')return{id:'turnpro',cat:'重大事件 · 生涯',major:true,title:'是否轉職業？',desc:'海外業餘生涯打到一個段落了。你可以繼續留在業餘體系，也可以正式轉職業，讓拳擊人生進入下一個階段。',choices:[{label:'正式轉職業',sub:'拿到執照，開始職業賽程',rate:'命運骰 4–6 成功銜接；1–3 先適應一陣子',special:'turnpro_yes'},{label:'再磨一年',sub:'先繼續以業餘賽累積',rate:'穩定發展｜士氣 +1，技術 +1',special:'turnpro_wait'}]};const f=state.scheduledFight;return{id:'fight',cat:'重大事件 · 比賽',major:true,title:f.title,desc:`${f.blurb} 對手是 ${f.name}（OVR ${f.ovr}），地點在 ${f.venue}，採 ${f.rounds} 回合。`,choices:[{label:'接下比賽',sub:'按照劇情節奏進入備戰與出賽',rate:'擲出比賽命運骰，決定勝敗與收穫',special:'fight_accept'},{label:'這次先不打',sub:'讓人生繼續前進，之後還會再有比賽',rate:'穩定｜士氣 -1，但不會卡關',special:'fight_decline'}]};}
function drawEvent(){if(state.cardsRemaining<=0||state.currentEvent||state.result)return;state.currentEvent=state.scheduledFight?buildScheduledEvent():JSON.parse(JSON.stringify(pick(EVENT_DECK)));save();render();}
function applyDelta(target,amt){if(target in state.stats){state.stats[target]=clamp(state.stats[target]+amt,30,99);return `${STAT_NAMES[target]} ${amt>0?'+':''}${amt}`;}if(target==='health'){state.health=clamp(state.health+amt,0,100);return `健康 ${amt>0?'+':''}${amt}`;}if(target==='morale'){state.morale=clamp(state.morale+amt,0,100);return `士氣 ${amt>0?'+':''}${amt}`;}if(target==='fame'){state.fame=clamp(state.fame+amt,0,999);return `名氣 ${amt>0?'+':''}${amt}`;}if(target==='income'){state.income=Math.max(0,state.income+amt);return `收入 +${money(amt)}`;}return '';}
function resolveStandardEvent(ev,choice,roll){let tier='mid';if(choice.mode==='aggressive'||choice.mode==='balanced')tier=roll>=5?'good':(roll<=2?'bad':'mid');if(choice.mode==='safe')tier=roll>=4?'good':(roll===1?'bad':'mid');const effects=tier==='good'?(choice.good||[]):tier==='bad'?(choice.bad||[]):(choice.mid||[]);const deltas=effects.map(([k,v])=>applyDelta(k,v));const tierText=tier==='good'?'結果很不錯，這次選擇幫你拿到正面收穫。':tier==='bad'?'結果不太理想，這次選擇付出了代價。':'結果平穩，沒有爆發，但也沒有太傷。';state.result={title:ev.title,roll,text:`你選擇了「${choice.label}」。${tierText}`,deltas,tier};log(`事件《${ev.title}》：選擇「${choice.label}」，擲出 ${roll}。`);}
function resolveSpecial(type,ev,roll){let text='',deltas=[],tier='mid';if(type==='fight_decline'){deltas=[applyDelta('morale',-1)];text='你暫時沒有接下這場比賽。生涯會繼續往前走，之後還會再安排新的機會。';state.scheduledFight=null;}else if(type==='turnpro_wait'){deltas=[applyDelta('morale',1),applyDelta('technique',1)];text='你決定先不急著轉職業，再用一年時間磨技術與成熟度。';state.scheduledFight=null;}else if(type==='turnpro_yes'){if(roll>=4){tier='good';state.isPro=true;state.proStage='debut';deltas=[applyDelta('fame',4),applyDelta('morale',4)];text='你正式轉職業，拳擊人生進入新階段。接下來的劇情節奏將改為職業賽為主。';}else{deltas=[applyDelta('morale',-1)];text='你本來想立即轉職業，但團隊認為還需要一些時間適應與準備。';}state.scheduledFight=null;}else if(type==='fight_accept'){const f=state.scheduledFight,my=ovr()+rnd(-3,3),opp=f.ovr+rnd(-3,3);if(my>=opp+3){tier='good';if(f.pro){state.record.w++;if(rnd(1,100)<=35)state.record.ko++;deltas.push(applyDelta('income',rnd(1800,5200)));}else state.amateur.w++;deltas.push(applyDelta('fame',3),applyDelta('morale',4),applyDelta('health',-3));text=`你接下了對 ${f.name} 的比賽，最後順利取勝。這一場讓你在 ${COUNTRIES[state.country].name} 的拳擊圈開始被記住。`;}else if(my>=opp-2){if(f.pro){state.record.l++;deltas.push(applyDelta('income',rnd(1200,3200)));}else state.amateur.l++;deltas.push(applyDelta('morale',-1),applyDelta('health',-5),applyDelta('technique',1));text=`你接下了對 ${f.name} 的比賽，雖然結果不算漂亮，但你撐完整場，也學到了實戰經驗。`;}else{tier='bad';if(f.pro){state.record.l++;deltas.push(applyDelta('income',rnd(1000,2400)));}else state.amateur.l++;deltas.push(applyDelta('morale',-3),applyDelta('health',-8),applyDelta('chin',1));text=`你接下了對 ${f.name} 的比賽，但今晚不是你的夜晚。你吃了敗仗，不過這不會阻止你的人生繼續前進。`;}state.scheduledFight=null;}state.result={title:ev.title,roll,text,deltas,tier};log(`事件《${ev.title}》完成，擲出 ${roll}。`);}
function chooseResponse(index){const ev=state.currentEvent,choice=ev?.choices[index];if(!ev||!choice||state.result)return;const roll=rnd(1,6);if(choice.special)resolveSpecial(choice.special,ev,roll);else resolveStandardEvent(ev,choice,roll);state.cardsRemaining=Math.max(0,state.cardsRemaining-1);state.currentEvent=null;save();render();}
function nextStage(){if(state.cardsRemaining>0||state.currentEvent||!state.result)return;state.result=null;state.turn++;if(state.seasonIndex<2)state.seasonIndex++;else{state.seasonIndex=0;state.year++;state.age++;if(!state.isPro)state.overseasYear=clamp(state.overseasYear+1,1,3);}state.cardsRemaining=2;maybeScheduleFight();log(`時間推進到 ${state.year} 年 ${currentSeasonLabel()}。`);save();render();}
function resetGame(){if(confirm('確定要重開人生嗎？')){localStorage.removeItem(SAVE_KEY);state=null;render();}}
function startScreen(){return `<div class="startWrap"><div class="startHero"><h1>Boxing🥊Life</h1><p>這版改成更接近你給的介面與玩法：<b>左邊時間線＋中間事件卡＋右側選項區</b>。開局是 <b>18 歲台灣高中畢業生</b>，選擇旅日／旅美／旅菲其中一條路，事件以文字呈現，先不放任何圖片。</p></div><div class="grid2"><div class="panel"><label>拳手名字</label><input id="name" value="李逍遙" maxlength="14"><div class="row" style="margin-top:14px"><div><label>拳風</label><select id="style"><option value="pressure">壓迫型</option><option value="outboxer">技巧型</option><option value="slugger">重砲型</option></select></div><div><label>起點國家</label><select id="country"><option value="usa">🇺🇸 美國</option><option value="japan">🇯🇵 日本</option><option value="philippines">🇵🇭 菲律賓</option></select></div></div></div><div class="panel"><label>玩法說明</label><div class="muted" style="line-height:1.9;font-size:14px">• 每個階段有 <b>2 張事件卡</b><br>• 先抽卡，再在右側做選擇<br>• 做完選擇後系統會擲出命運骰（1–6）<br>• 根據風險不同，成功率與加減幅度也不同<br>• 沒有勝場門檻，不會因為輸了就卡關<br>• 比賽會按照劇情節奏出現，不再固定掛在右下角</div></div></div><button class="startBtn" onclick="createNew({name:document.getElementById('name').value.trim(),style:document.getElementById('style').value,country:document.getElementById('country').value})">開始拳擊人生</button></div>`}
function render(){const app=document.getElementById('app');if(!state){state=load();if(!state){app.innerHTML=startScreen();return;}}const country=COUNTRIES[state.country],mode=state.currentEvent?'event':state.result?'result':'idle',event=state.currentEvent,result=state.result;const sidebarAction=mode==='idle'?`<button class="drawBtn" onclick="drawEvent()">${remainingEventText()}<small>照圖一玩法：先抽事件卡，再到右側做選擇</small></button>`:mode==='result'&&state.cardsRemaining===0?`<button class="nextBtn" onclick="nextStage()">進入下一階段<small>${state.year} · ${currentSeasonLabel()} 已完成，前往下一個節奏</small></button>`:mode==='result'?`<button class="drawBtn" onclick="state.result=null;save();render()">繼續抽下一張事件卡<small>本階段還剩 ${state.cardsRemaining} 張事件卡</small></button>`:`<div class="sidePanel"><h4>事件選擇中</h4><div class="muted" style="font-size:14px;line-height:1.8">請從下方選擇你要怎麼面對這次事件。系統會在你選擇後擲出命運骰。</div></div>`;const eventChoices=mode==='event'?`<div class="sidePanel"><div class="choiceTitle">${event.cat} — 你要怎麼應對？</div>${event.choices.map((c,i)=>`<button class="choiceBtn" onclick="chooseResponse(${i})"><b>${c.label}</b><span>${c.sub}</span><em>${c.rate}</em></button>`).join('')}</div>`:'';const resultPanel=mode==='result'?`<div class="sidePanel"><h4>RESULT</h4><div class="resultBox"><div class="die">${result.roll}</div><div class="resultText">${result.text}</div><div class="deltaList">${result.deltas.map(t=>`<span class="delta ${t.includes('+')?'good':t.includes('-')?'bad':''}">${esc(t)}</span>`).join('')}</div></div></div>`:'';const centerCard=mode==='event'?`<div class="card ${event.major?'major':''}"><div class="kicker ${event.major?'gold':''}">■ ${event.cat}</div><h3>${event.title}</h3><p>${event.desc}</p></div>`:mode==='result'?`<div class="card ${result.tier==='good'?'major':''}"><div class="kicker ${result.tier==='good'?'gold':''}">■ 事件結果</div><h3>${result.title}</h3><p>${result.text}</p><div class="deltaList">${result.deltas.map(t=>`<span class="delta ${t.includes('+')?'good':t.includes('-')?'bad':''}">${esc(t)}</span>`).join('')}</div></div>`:`<div class="card"><div class="kicker">■ 季初特訓</div><h3>目前階段：${titlePhase()}</h3><p>你現在人在 <b style="color:var(--gold)">${country.name}・${state.base}</b>。這個階段還有 <b style="color:var(--gold)">${state.cardsRemaining}</b> 張事件卡可以抽。抽卡後，到右側做出選擇，系統會擲出命運骰，依照風險決定成長或代價。</p></div>`;app.innerHTML=`<div class="shell"><aside class="left"><div class="brand">Boxing<span class="ball">🥊</span>Life</div><div class="sub">拳 擊 人 生 模 擬 器</div><div class="side-group"><div class="side-school">台灣高中 · 拳擊部<small>${country.path}</small></div><div class="timeline"><div class="node active"><strong>${state.year}　${state.age}歲</strong><span>高中畢業 · 海外出發</span></div><div class="node ${state.turn>0?'active':''}"><strong>${country.name} · ${state.base}</strong><span>${titlePhase()}</span></div></div></div><div class="menu"><div class="active">▣ 準事件</div><div>◆ 訓練</div><div>♜ 比賽</div><div>▦ 行程</div><div>★ 技能</div><div>▥ 數據</div><div>◉ 成就</div><div onclick="save()">▣ 儲存</div><div onclick="resetGame()">⚙ 重開人生</div></div><div class="seed">SEED <b>${state.seed}</b><br>v2.2.0<br>無圖片版 · 事件卡玩法</div></aside><main class="center"><div class="topbar"><div class="topline"><div class="noBox"><small>NO.</small><b>1</b></div><div class="heroName"><b>${esc(state.name)}</b><div class="tags"><span class="tag">拳手</span><span class="tag gold">${STYLES[state.style]}</span></div></div><div class="schoolRight">所屬地區<b>${country.name}　${state.base}</b></div><button class="menuBtn">☰</button></div><div class="metrics"><div class="metric"><b>${state.age}</b><span>年齡</span></div><div class="metric"><b>${state.year}</b><span>年份</span></div><div class="metric"><b>${ovr()}</b><span>綜合</span></div><div class="metric"><b>${Math.floor(state.income/1000)}</b><span>生涯薪（萬）</span></div><div class="metric detail">詳情<br>⌄</div></div><div class="seasonRow"><span class="seasonDot ${state.seasonIndex===0?'on':''}"></span>季初　<span class="seasonDot ${state.seasonIndex===1?'on':''}"></span>賽季中　<span class="seasonDot ${state.seasonIndex===2?'on':''}"></span>季末</div></div><div class="mainScroll"><div class="card"><div class="kicker">■ 拳手誕生</div><p>18 歲高中畢業，<b style="color:var(--gold)">${esc(state.name)}</b> 從台灣前往 <b style="color:var(--gold)">${country.name}</b>。接下來每個階段你都會抽出事件卡，從右側選擇應對方式，然後由命運骰決定這段拳擊人生怎麼前進。</p></div><div class="dateLine">${state.year} 年 ・ ${state.age} 歲 ・ ${titlePhase()} ・ ${currentSeasonLabel()}</div>${centerCard}<div class="card"><div class="kicker">■ 最近紀錄</div>${state.logs.slice(0,8).map(l=>`<div class="logItem"><div class="when">${l.when}</div><div class="text">${esc(l.text)}</div></div>`).join('')}</div></div></main><aside class="right"><div class="sidePanel"><h4>CAREER STATUS</h4><div class="statusGrid"><div class="miniStat"><b>${state.health}</b><span>健康</span></div><div class="miniStat"><b>${state.morale}</b><span>士氣</span></div><div class="miniStat"><b>${state.fame}</b><span>名氣</span></div><div class="miniStat"><b>${state.isPro?`${state.record.w}-${state.record.l}`:`${state.amateur.w}-${state.amateur.l}`}</b><span>${state.isPro?'職業戰績':'業餘戰績'}</span></div></div></div><div class="sidePanel"><h4>ATTRIBUTES</h4>${STAT_KEYS.map(k=>`<div class="statRow"><div class="statHead"><span>${STAT_NAMES[k]}</span><b>${state.stats[k]}</b></div><div class="bar"><i style="width:${state.stats[k]}%"></i></div></div>`).join('')}</div>${eventChoices}${resultPanel}<div class="actionBox">${sidebarAction}</div></aside></div>`;}

const V22_EVENT_TEXT = {
  gym:{
    title:"清晨五點，教練把燈打開了",
    desc:"你才剛適應海外生活，教練就宣布明天清晨加練。沒有人強迫你留下，但拳館裡每個人都在看：這個從台灣來的高中生，究竟能撐多久？"
  },
  study:{
    title:"報告期限撞上拳館實戰週",
    desc:"學校的期中報告和拳館的高強度實戰撞在同一週。你第一次真正感受到：留學和拳擊不是兩條分開的路，而是在搶同一份時間。"
  },
  spar:{
    title:"館內前輩點名要跟你打",
    desc:"一名經驗比你多很多的拳手突然叫你戴上頭盔。教練沒有阻止，只說了一句：『上去看看你現在在哪裡。』"
  },
  social:{
    title:"你的訓練片段開始有人轉發",
    desc:"一段你打靶的短影片被當地健身帳號轉發。原本沒有人認識你，現在卻開始有人私訊、標記，甚至問你下一場什麼時候打。"
  },
  diet:{
    title:"體重開始逼近警戒線",
    desc:"最近課業、訓練和外食讓體重慢慢往上。教練提醒你：現在還不是正式比賽週，但如果一直放著不管，真正要打時會付出更多代價。"
  },
  coach:{
    title:"所有人走了，教練叫你留下",
    desc:"晚間訓練結束後，拳館的人一個個離開。教練卻把你叫回鏡子前，說你的動作有一個問題，如果現在不改，以後會變成習慣。"
  }
};

for(const e of EVENT_DECK){
  if(V22_EVENT_TEXT[e.id]){
    e.title = V22_EVENT_TEXT[e.id].title;
    e.desc = V22_EVENT_TEXT[e.id].desc;
  }
}

function v22FightScheduleText(){
  if(state.scheduledFight){
    if(state.scheduledFight.type==="turn_pro") return "下一個重大節點：轉職業選擇";
    return `下一場已排定：${state.scheduledFight.name}`;
  }
  if(!state.isPro){
    if(state.overseasYear===1){
      if(state.turn<2) return `第一場業餘賽：約再 ${2-state.turn} 個階段`;
      return "第一年：大約每 3 個階段安排一場業餘賽";
    }
    if(state.overseasYear===2) return "第二年：大約每 2～3 個階段安排一場業餘賽";
    return "第三年：持續累積業餘賽，之後自然進入轉職業選擇";
  }
  return "職業階段：大約每 2 個階段安排一場比賽";
}

function v22Rhythm(){
  const idx = state.currentEvent ? 1 : state.result ? 2 : 0;
  return `<div class="rhythmBox">
    <div class="rhythmTitle">CAREER RHYTHM</div>
    <div class="rhythmStep ${idx===0?'on':''}"><i></i>① 抽本階段事件卡</div>
    <div class="rhythmStep ${idx===1?'on':''}"><i></i>② 選擇你的應對方式</div>
    <div class="rhythmStep ${idx===2?'on':''}"><i></i>③ 命運骰結算結果</div>
    <div class="rhythmStep ${state.cardsRemaining===0?'on':''}"><i></i>④ 事件卡用完，時間前進</div>
    <div class="fightForecast">${v22FightScheduleText()}</div>
  </div>`;
}

function v22Attributes(){
  return `<div class="sidePanel attributes">
    ${STAT_KEYS.map(k=>{
      const v=state.stats[k];
      const ceiling=Math.min(99,Math.max(v+18,78));
      return `<div class="attrCard">
        <div class="attrTop">
          <div class="attrName">${STAT_NAMES[k]}</div>
          <div class="attrBar"><i style="width:${Math.min(100,(v/ceiling)*100)}%"></i></div>
          <div class="attrNum">${v}<span>/${ceiling}</span></div>
          <div class="attrHint">${v>=70?'高能力區：成長效率開始下降':'目前仍有明顯成長空間'}</div>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

const V22_originalRender = render;
render = function(){
  V22_originalRender();
  if(!state) return;
  const right=document.querySelector(".right");
  if(!right) return;

  const oldAttr=[...right.querySelectorAll(".sidePanel")].find(x=>x.querySelector("h4")?.textContent.includes("ATTRIBUTES"));
  if(oldAttr) oldAttr.outerHTML = v22Attributes();

  right.insertAdjacentHTML("afterbegin", v22Rhythm());
};

render();
</script>
</body>
</html>
