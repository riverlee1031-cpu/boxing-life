<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拳擊人生 · Boxing Life V11 Horizontal Pixel Edition</title>
<style>
:root{
  --bg:#120b1d;--surface:#1b1832;--surface2:#241f42;--line:#5b4f8c;
  --ink:#fdfbff;--dim:#c4bce7;--faint:#8f88bc;
  --red:#ff5f66;--gold:#ffd25a;--green:#6ce7a2;--blue:#6bc6ff;--violet:#9c73ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -80px,rgba(255,95,102,.22),transparent 330px), radial-gradient(circle at 10% 20%,rgba(107,198,255,.10),transparent 260px),
    linear-gradient(180deg,#090b10,#0c1017 55%,#090b10);
}
button,input,select{font:inherit}
button{border:0;color:inherit;cursor:pointer}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.wrap{padding:14px}
.hero{padding:42px 18px 22px;text-align:center}
.hero .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--red);font-weight:800}
.hero h1{font-size:48px;line-height:.92;margin:8px 0 8px;letter-spacing:-2px}
.hero p{color:var(--dim);font-size:14px;margin:0 auto;max-width:360px;line-height:1.6}
.panel{
  background:linear-gradient(180deg,var(--surface),#14112a);
  border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;
  box-shadow:0 10px 0 rgba(0,0,0,.20), 0 18px 30px rgba(0,0,0,.25)
}
.label{font-size:10px;letter-spacing:.15em;color:var(--faint);font-weight:800;text-transform:uppercase}
.field{margin-top:13px}
.field label{display:block;color:var(--dim);font-size:12px;margin-bottom:7px}
input,select{
  width:100%;border:1px solid var(--line);background:#0f0c21;color:var(--ink);
  border-radius:11px;padding:11px 12px;outline:none
}
input:focus,select:focus{border-color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  flex:1;min-width:88px;padding:10px 10px;border-radius:999px;background:#131028;
  border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700
}
.chip.on{background:var(--red);border-color:var(--red);color:white}
.btn{
  width:100%;padding:12px 14px;border-radius:12px;background:linear-gradient(100deg,var(--red),#ff8d55);
  font-weight:850;color:white;box-shadow:0 8px 24px -14px var(--red)
}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.gold{background:linear-gradient(100deg,#e5a72a,var(--gold));color:#201504}
.btn.small{width:auto;padding:9px 12px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.hud{
  position:sticky;top:0;z-index:30;background:rgba(18,11,29,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);border-top:3px solid var(--gold)
}
.hud-top{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:9px 12px}
.avatar{
  width:76px;height:76px;border-radius:14px;background:#0f0c21;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.chibi{
  width:72px;height:72px;image-rendering:pixelated;background:#16132c;position:relative;
  display:grid;place-items:center;border-radius:10px
}
.chibi svg{width:72px;height:72px;shape-rendering:crispEdges}
.hud-name{min-width:0}.hud-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-name span{display:block;color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ovr{text-align:center;border-left:1px solid var(--line);padding-left:10px}
.ovr b{display:block;font-size:27px;color:var(--gold);line-height:1}.ovr span{font-size:9px;color:var(--faint);letter-spacing:.1em}
.hud-stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.hs{text-align:center;padding:6px 2px;border-right:1px solid var(--line)}.hs:last-child{border-right:0}
.hs b{display:block;font-size:13px}.hs span{display:block;font-size:8.5px;color:var(--faint);margin-top:1px}
.season{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:5px}
.season b{font-size:12px;color:var(--red);letter-spacing:.08em}.season span{font-size:11px;color:var(--faint)}
.title{font-size:21px;font-weight:900;margin:4px 0 7px}
.text{font-size:14px;color:var(--dim);line-height:1.65}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.opt{
  background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--red);
  padding:12px;border-radius:12px;text-align:left;display:grid;grid-template-columns:35px 1fr;gap:10px;align-items:center
}
.opt:active{transform:scale(.99)}
.ico{width:35px;height:35px;border-radius:9px;background:#141028;display:flex;align-items:center;justify-content:center;font-size:18px}
.ot b{display:block;font-size:14px}.ot span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}
.dice-stage{text-align:center;padding:8px 0}
.die{
  width:82px;height:82px;border-radius:17px;background:linear-gradient(145deg,#fff,#ddd8ca);
  margin:8px auto;color:#141414;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;
  box-shadow:0 10px 25px rgba(0,0,0,.35)
}
.die.rolling{animation:shake .16s linear infinite}
@keyframes shake{0%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-5px)}100%{transform:rotate(-9deg)}}
.outcome{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--surface2);border-radius:12px;padding:12px;margin-top:10px}
.outcome.good{border-left-color:var(--green)}.outcome.bad{border-left-color:var(--red)}
.deltas{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.delta{font-size:11px;padding:3px 7px;border-radius:6px;background:#141028;border:1px solid var(--line)}
.delta.pos{color:var(--green)}.delta.neg{color:#ff8989}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px 13px}
.attr .r{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.attr .r b{color:var(--ink)}
.bar{height:6px;background:#222a37;border-radius:999px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8872)}
.xp{font-size:8.5px;color:var(--faint);margin-top:3px;text-align:right}
.offer{
  padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;margin-top:9px
}
.offer.titlefight{border-color:#7e662e;background:linear-gradient(135deg,#211b0d,var(--surface2))}
.offer-h{display:flex;justify-content:space-between;gap:8px}.offer-h b{font-size:15px}.offer-h span{font-size:10px;color:var(--gold)}
.offer-meta{color:var(--dim);font-size:11px;margin-top:4px;line-height:1.6}
.offer-actions{display:flex;gap:8px;margin-top:10px}.offer-actions .btn{flex:1}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{padding:5px 9px;border-radius:999px;border:1px solid #66562a;background:#211b0e;color:var(--gold);font-size:11px;font-weight:700}
.timeline{max-height:310px;overflow:auto}
.log{padding:9px 0;border-bottom:1px dashed #273041;font-size:12.5px;line-height:1.5}
.log:last-child{border-bottom:0}.log .when{display:block;color:var(--faint);font-size:9.5px;margin-bottom:2px}
.log.good{color:#c8f5d8}.log.bad{color:#ffd0d0}.log.titlelog{color:#ffe39a}
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,transparent,rgba(9,11,16,.97) 28%);padding:12px 14px 16px
}
.actionbar .inner{max-width:540px;margin:auto;display:flex;gap:8px}
.actionbar .btn{flex:1}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.modalbox{width:min(500px,100%);max-height:90vh;overflow:auto;background:#16132c;border:1px solid var(--line);border-radius:18px;padding:16px}
.fightlog{white-space:pre-line;background:#090d13;border:1px solid var(--line);border-radius:12px;padding:11px;font:12px/1.6 ui-monospace,monospace;max-height:310px;overflow:auto}
.note{font-size:11px;color:var(--faint);line-height:1.55}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.hidden{display:none!important}
.stage{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px
}
.stage-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#141028;text-align:center}
.stage-card.on{border-color:var(--gold);background:#1b170e}
.stage-card b{display:block;font-size:12px}
.stage-card span{display:block;font-size:10px;color:var(--faint);margin-top:4px}
.alloc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.points-left{font-size:12px;color:var(--gold);font-weight:900}
.alloc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alloc{background:#141028;border:1px solid var(--line);border-radius:11px;padding:9px}
.alloc .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.alloc .name{font-size:11px;color:var(--dim);font-weight:800}
.alloc .value{font-size:17px;font-weight:900}
.alloc .ctrl{display:flex;gap:5px;margin-top:7px}
.alloc .ctrl button{flex:1;background:#221c42;border:1px solid var(--line);border-radius:8px;padding:5px;color:var(--ink);font-weight:900}
.special-panel{
  border-color:#72561c!important;
  background:linear-gradient(160deg,#20190b,#111722 46%,#0f141d)!important;
}
.special-tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#2b210c;border:1px solid #735919;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.13em}
.phase-banner{
  border:1px solid #6b541d;background:linear-gradient(180deg,#251d0c,#141922);padding:12px;border-radius:12px;margin:10px 0
}
.phase-banner b{color:var(--gold)}
.small-chibi{width:50px;height:50px}
.event-art{margin:10px 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b1018}
.event-art svg{display:block;width:100%;height:auto;image-rendering:pixelated;shape-rendering:crispEdges}
.trip{font-size:11px;color:var(--gold);font-weight:800;margin-top:3px}
.hero h1{text-shadow:3px 3px 0 #3a2e72,6px 6px 0 rgba(0,0,0,.25)}
.panel,.offer,.outcome,.opt,.stage-card,.alloc,.modalbox,.event-art{image-rendering:pixelated}
.panel{position:relative}
.panel:before{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.04);border-radius:16px;pointer-events:none}
.btn,.chip,.offer,.opt,.stage-card,.alloc{box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.chibi, .avatar{box-shadow:0 0 0 2px rgba(255,210,90,.15)}
.event-art{background:linear-gradient(180deg,#1b1832,#100d1f);box-shadow:inset 0 0 0 2px rgba(255,255,255,.03)}
.special-tag{background:#39290d;border-color:#c39121;color:#ffd25a}
.title{letter-spacing:-.03em}



.story-card{border:2px solid #6d5ed1;background:linear-gradient(180deg,#1b1832,#100d20);border-radius:16px;overflow:hidden;margin:10px 0;box-shadow:0 10px 0 rgba(0,0,0,.23)}
.story-head{padding:13px 14px 8px;background:linear-gradient(90deg,#2b2150,#1b1832);border-bottom:1px solid #5b4f8c}
.story-kicker{font-size:10px;letter-spacing:.18em;color:#ffd25a;font-weight:900}
.story-title{font-size:25px;line-height:1.1;font-weight:950;margin:4px 0;color:#fff;text-shadow:2px 2px 0 #493b85}
.story-year{font-size:11px;color:#9b94c6}
.story-body{padding:14px}
.story-copy{font-size:14px;color:#d9d4ef;line-height:1.85;white-space:pre-line}
.story-copy strong{color:#fff}
.story-profile{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center;margin:10px 0 13px;padding:10px;background:#131027;border:1px solid #4d4475;border-radius:12px}
.story-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.story-stat{background:#0f0c21;border:1px solid #403862;border-radius:9px;padding:7px;text-align:center}.story-stat b{display:block;font-size:15px;color:#ffd25a}.story-stat span{font-size:8px;color:#8f88bc}
.story-art{border-bottom:1px solid #5b4f8c;background:#0f0c20}.story-art svg{display:block;width:100%;height:auto;image-rendering:pixelated;shape-rendering:crispEdges}
.result-art{margin:8px 0 12px;border:1px solid #5b4f8c;border-radius:12px;overflow:hidden;background:#100d20}.result-art svg{display:block;width:100%;height:auto;image-rendering:pixelated}


.story-identity{padding:13px 14px 0}.story-country{font-size:12px;font-weight:900;color:#ffd25a}.story-country-en{font-size:9px;letter-spacing:.15em;color:#8f88bc;margin-top:2px}
.story-fighter-name{font-size:22px;font-weight:950;margin-top:9px}.story-fighter-sub{font-size:11px;color:#c4bce7;margin-top:4px;line-height:1.5}
.story-major{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.story-major .m{background:#0f0c21;border:1px solid #403862;border-radius:9px;padding:8px 4px;text-align:center}.story-major b{display:block;color:#ffd25a;font-size:17px}.story-major span{display:block;color:#8f88bc;font-size:8px;margin-top:2px}
.story-abilities{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px;padding:10px;background:#100d20;border:1px solid #403862;border-radius:11px;margin-bottom:13px}.story-ability{display:flex;justify-content:space-between;font-size:11px;color:#c4bce7}.story-ability b{color:#fff}
.story-chapter-label{border-top:1px solid #4d4475;padding-top:13px;margin-top:12px}.story-chapter-title{font-size:22px;font-weight:950;color:#fff;margin:4px 0}.story-chapter-year{font-size:11px;color:#8f88bc}.story-age-title{font-size:17px;font-weight:900;margin:14px 0 7px;color:#fff}
.story-photo{margin:10px 14px 0;border:2px solid #5b4f8c;border-radius:13px;overflow:hidden;background:#0f0c20}.story-photo img{display:block;width:100%;height:auto;image-rendering:pixelated}.story-photo-fallback svg{display:block;width:100%;height:auto}


/* ===== V11 HORIZONTAL REAL PIXEL EDITION ===== */
body{background:#060a0e;background-image:linear-gradient(90deg,#07110f 0,#07110f 11%,#071014 11%,#05090d 100%)}
#app{max-width:1480px;margin:0 auto;min-height:100vh;padding-bottom:30px}
.real-pixel-art img,.story-photo img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.event-art{aspect-ratio:16/9;max-height:420px;background:#05070a;border:1px solid #3f4961;overflow:hidden;border-radius:12px;margin:11px 0 13px}
.result-picture{aspect-ratio:16/9;max-height:360px;overflow:hidden;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.result-picture img{width:100%;height:100%;object-fit:cover}
.desktop-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;border-left:1px solid #24302d;border-right:1px solid #24302d}
.desktop-side{background:linear-gradient(180deg,#0b2019,#091813);border-right:1px solid #2b433a;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:30px;font-weight:950;letter-spacing:-1px;margin-bottom:4px}.brand em{font-style:normal;color:var(--gold)}
.brand-sub{font-size:11px;letter-spacing:.2em;color:#8ca89d;padding-bottom:18px;border-bottom:1px solid #284139}
.side-route{margin:18px 0;padding:12px;border:1px solid #2c4c41;border-radius:12px;background:#0d251e}.side-route b{display:block;color:var(--gold);font-size:12px}.side-route span{font-size:11px;color:#a4bbb3;line-height:1.55}
.side-nav{display:flex;flex-direction:column;gap:7px}.side-nav button{background:transparent;border:1px solid transparent;color:#b8cbc5;text-align:left;padding:11px 12px;border-radius:9px;font-weight:800}.side-nav button.active{border-color:#80662b;background:#25341f;color:#ffd25a;box-shadow:0 0 16px rgba(255,210,90,.1)}
.side-mini{margin-top:22px;padding-top:15px;border-top:1px solid #284139;color:#80968f;font-size:10px;line-height:1.8}
.game-main{min-width:0;background:radial-gradient(circle at 50% -40px,rgba(255,95,102,.10),transparent 320px),#070c10}
.hud{position:sticky;top:0;z-index:30;border-top:0;background:rgba(7,12,16,.96);border-bottom:1px solid #29323e}
.hud-top{grid-template-columns:82px minmax(220px,1fr) 140px;max-width:none;padding:12px 26px}.avatar{width:82px;height:82px}.chibi,.chibi svg{width:78px;height:78px}
.hud-name b{font-size:22px}.hud-name span{font-size:12px}.trip{font-size:11px}
.ovr{min-width:100px}.ovr b{font-size:34px}
.hud-stats{grid-template-columns:repeat(5,minmax(90px,1fr));padding:0 26px}.hs{padding:9px 5px}.hs b{font-size:16px}
.wrap{padding:20px 26px 34px;max-width:none}.phase-banner{margin-top:0}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr);gap:16px;align-items:start}.primary-col,.secondary-col{min-width:0}.primary-col .panel:first-child{margin-top:0}.secondary-col .panel:first-child{margin-top:0}
.stage{grid-template-columns:repeat(4,1fr)}.stage-card{min-height:78px;display:flex;flex-direction:column;justify-content:center}.panel{border-radius:12px;margin:0 0 14px;padding:15px}
.title{font-size:24px}.text{font-size:14px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.opt{min-height:72px}
.attrs{grid-template-columns:1fr 1fr}.offer{margin-top:9px}.timeline{max-height:400px}
.story-card{display:grid;grid-template-columns:minmax(380px,.92fr) minmax(440px,1.08fr);overflow:hidden;min-height:610px}.story-identity{grid-column:1/3;padding:18px 20px 10px;background:#0b1218}.story-photo{grid-column:1;grid-row:2;margin:0;border:0;border-right:1px solid #5b4f8c;border-radius:0;min-height:540px}.story-photo img{min-height:540px;object-fit:cover}.story-body{grid-column:2;grid-row:2;padding:24px 28px;max-height:calc(100vh - 190px);overflow:auto}.story-major{grid-template-columns:repeat(5,1fr)}.story-abilities{grid-template-columns:repeat(3,1fr)}.story-copy{font-size:15px;line-height:1.95}.story-age-title{font-size:20px}
.actionbar{position:static;background:transparent;padding:0 26px 26px}.actionbar .inner{max-width:none;justify-content:flex-end}.actionbar .btn{max-width:180px;flex:0 0 180px}
.start-desktop{max-width:1180px;margin:0 auto;padding:24px}.start-desktop .hero{padding:20px 18px}.start-desktop .panel{max-width:980px;margin:0 auto}.start-desktop .alloc-grid{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){
  body{background:#090b10}.desktop-shell{display:block}.desktop-side{display:none}.hud-top{padding:9px 12px;grid-template-columns:76px 1fr auto}.hud-stats{padding:0;grid-template-columns:repeat(5,1fr)}.wrap{padding:14px}.dashboard-grid{display:block}.opts{display:flex}.story-card{display:block;min-height:0}.story-identity{display:block}.story-photo{margin:10px 14px 0;border:2px solid #5b4f8c;border-radius:13px;min-height:0}.story-photo img{min-height:0}.story-body{max-height:none;padding:14px}.actionbar{position:fixed;padding:12px 14px 16px;background:linear-gradient(180deg,transparent,rgba(9,11,16,.97) 28%)}.actionbar .inner{max-width:540px}.actionbar .btn{max-width:none;flex:1}.start-desktop{padding:0}.start-desktop .alloc-grid{grid-template-columns:1fr 1fr}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="fightModal" class="modal hidden">
  <div class="modalbox">
    <div class="label">Fight Night</div>
    <h2 id="fightModalTitle" style="margin:5px 0 10px"></h2>
    <div id="fightResultArt" class="result-art"></div>
    <div id="fightLog" class="fightlog"></div>
    <button class="btn" style="margin-top:12px" onclick="closeFightModal()">繼續生涯</button>
  </div>
</div>
<script>
const SAVE_KEY="boxing-life-v11-horizontal-real-pixel";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let rng=Math.random;
function seedHash(s){let h=2166136261>>>0; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)} return h>>>0;}
function setSeed(s){ let a=seedHash(String(s||"boxing")); rng=function(){ a+=0x6D2B79F5; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296;};}

function trainXP(skill,amount){
  if(G.stats[skill]>=99)return 0;
  const potential=G.potential[skill]||80;
  let ageFactor=G.age<=27?1:G.age<=31?.90:G.age<=34?.76:G.age<=37?.60:.43;
  let fatigueFactor=G.fatigue<45?1:G.fatigue<65?.78:.53;
  let potFactor=G.stats[skill]<potential?1:G.stats[skill]<potential+4?.45:.15;
  G.xp[skill]+=amount*ageFactor*fatigueFactor*potFactor;
  let ups=0;
  while(G.stats[skill]<99 && G.xp[skill]>=xpNeed(G.stats[skill])){G.xp[skill]-=xpNeed(G.stats[skill]);G.stats[skill]++;ups++}
  return ups;
}

function realisticRecord(stage, strength){

    return `${wins}-${losses}`;
  }
  let total;
  if(strength<50) total=rnd(0,4);
  else if(strength<58) total=rnd(1,7);
  else if(strength<66) total=rnd(4,11);
  else if(strength<74) total=rnd(7,15);
  else if(strength<82) total=rnd(10,20);

function generateOffers(boost=0){
  if(!G || G.retired) return;
  const me=ovr(), count=3; G.offers=[];
  for(let i=0;i<count;i++){
    let oppOvr, rounds, purse, stage;
    if(!G.isPro){
      stage="amateur";
      oppOvr=clamp(me + (i-1)*rnd(1,4)+rnd(-2,2),40,72);
      rounds=3; purse=0;
      const boutCity=pick(START_DESTINATIONS[G.destinationCountry]?.cities||[G.baseCity]);
      G.offers.push({
        id:String(Date.now())+i+String(rnd(10,99)), name:opponentNameForCity(boutCity), ovr:oppOvr, record:realisticRecord(stage,oppOvr),
        purse, rounds, title:null, city:boutCity, rank:"業餘"
      });
    }else{
      stage="pro";
      let diff=(i-1)*rnd(3,6)+boost*2;
      oppOvr=clamp(me+diff+rnd(-2,3),38,96);
      let oppRank=clamp(Math.round(G.rank*(1+(me-oppOvr)/55)+rnd(-80,80)),1,2500);
      purse=Math.max(350,Math.round(300+oppOvr*17+G.fame*12+(1600/Math.max(35,G.rank))*300));
      purse=Math.round(purse*(1+i*.22));
      rounds=G.record.w<4?4:G.rank>650?6:G.rank>220?8:G.rank>40?10:12;
      let title=null;
      for(const t of TITLE_DEFS){
        if(!G.titles.includes(t.id) && G.rank<=t.rank && chance(.25+i*.09)){title=t.id; rounds=Math.max(rounds,t.id==="world"?12:10); purse=Math.round(purse*1.7); break}
      }
      const boutCity=pick(["Las Vegas","Los Angeles","New York","Tokyo","Osaka","Fukuoka","Manila","Cebu","Davao"]);
      G.offers.push({
        id:String(Date.now())+i+String(rnd(10,99)), name:opponentNameForCity(boutCity), ovr:oppOvr, rank:oppRank,
        record:realisticRecord(stage,oppOvr), purse, rounds, title, city:boutCity
      });
    }
  }
}

function applyDelta(delta){
  const labels=[];
  const simple={health:"健康",fatigue:"疲勞",morale:"士氣",fame:"人氣",money:"資金",readiness:"備戰",
                weightRisk:"減重風險",manager:"經紀關係",promoterInterest:"Promoter 興趣",discipline:"自律"};
  Object.entries(delta||{}).forEach(([k,v])=>{
    if(k==="xp"){
      Object.entries(v).forEach(([sk,amt])=>{
        const up=trainXP(sk,amt);
        labels.push({txt:`${SKILL_NAMES[sk]} ${up?`+${up}`:`+${amt} XP`}`,pos:true});
      });
    }else if(k==="offerBoost"){
      generateOffers(v); labels.push({txt:"比賽機會 ↑",pos:true});
    }else if(k==="skillPoints"){
      G.skillPoints+=v; labels.push({txt:`自由點數 +${v}`,pos:true});
    }else if(k==="turnPro"){
      G.isPro=true; G.rank=1350; labels.push({txt:"正式轉職業",pos:true});
    }else if(G[k]!==undefined){
      G[k]+=v;
      if(["health","fatigue","morale","fame","readiness","weightRisk","manager","promoterInterest","discipline"].includes(k))G[k]=clamp(G[k],0,100);
      if(k==="money")G.money=Math.max(0,G.money);
      labels.push({txt:`${simple[k]||k} ${v>0?"+":""}${v}${k==="money"?"$":""}`,pos:(k==="fatigue"||k==="weightRisk")?v<0:v>0});
    }
  });
  return labels;
}

function pickEvent(){
  const valid=EVENTS.filter(e=>!e.cond||e.cond(G));
  const special=valid.filter(e=>e.special);
  const normal=valid.filter(e=>!e.special);
  let pool=(special.length && chance(.13))?special:normal;
  let ev=pick(pool);
  if(G.currentEvent && pool.length>1){
    let tries=0; while(ev.id===G.currentEvent.id && tries++<6) ev=pick(pool);
  }
  return ev;
}
function chooseEvent(idx){
  const ev=G.currentEvent, op=ev.options[idx];
  document.querySelector("#eventBox").innerHTML=`
    ${isSpecialEvent(ev)?`<div class="special-tag">★ SPECIAL EVENT</div>`:""}
    <div class="season" style="margin-top:${isSpecialEvent(ev)?"9px":"0"}"><b>${ev.cat}</b><span>${G.year} · Week ${G.week}</span></div>
    <div class="title">${ev.title}</div>
    ${eventImageHTML(ev)}
    <div class="dice-stage"><div id="die" class="die rolling">?</div><div class="text">命運骰子正在決定結果…</div></div>`;
  let ticks=0;
  const timer=setInterval(()=>{
    const d=document.querySelector("#die"); if(d)d.textContent=rnd(1,6); ticks++;
    if(ticks>=10){ clearInterval(timer); const roll=rnd(1,6); resolveEvent(ev,op,roll); }
  },70);
}
function resolveEvent(ev,op,roll){
  let mod=0;
  if(G.morale>=80)mod++;
  if(G.fatigue>=70)mod--;
  if(G.health<55)mod--;
  if(G.discipline<40)mod--;
  const final=clamp(roll+mod,1,6);
  const tier=final<=2?"low":final<=4?"mid":"high";
  const [txt,delta]=op[tier];
  const labels=applyDelta(delta);
  advanceWeek();
  G.lastEventId=ev.id; G.lastEventTheme=eventThemeKey(ev); G.lastOutcome={ev:ev.title,roll,final,tier,txt,labels};
  addLog(`${ev.title}：${txt}`,tier==="high"?"good":tier==="low"?"bad":"");
  if(G.week%2===0 || G.offers.length===0) generateOffers();
  G.currentEvent=pickEvent();
  save(false); renderOutcome();
}
function renderOutcome(){
  const o=G.lastOutcome;

function acceptFight(id){
  const f=G.offers.find(x=>x.id===id); if(!f)return;
  if(G.health<45){ addLog("醫療狀況不適合現在接賽。","bad"); render(); return; }
  G.pendingFight=f; renderFightPrep(f);
}
function cancelFight(){ delete G.pendingFight; render(); }
function fightStrategy(strategy){ const f=G.pendingFight; if(!f)return; simulateFight(f,strategy); }
function simulateFight(f,strategy){
  const log=[]; let myHP=100,opHP=100,myPts=0,opPts=0,winner=null,method="",end=f.rounds;
  const a=G.stats; const readiness=.82+G.readiness/400; const health=.78+G.health/455; const fatigue=1-G.fatigue/330;
  const age=G.age<=33?1:Math.max(.80,1-(G.age-33)*.018);
  let atk=a.power*.27+a.speed*.16+a.technique*.25+a.stamina*.17+a.chin*.05+a.defense*.10;
  let def=a.defense*.31+a.speed*.20+a.technique*.24+a.chin*.16+a.stamina*.09;
  let koMod=1,scoreMod=1;
  if(strategy==="pressure"){atk*=1.05;def*=.96;koMod=1.13}
  if(strategy==="box"){atk*=.98;def*=1.06;scoreMod=1.12;koMod=.86}
  if(strategy==="counter"){atk*=1.01;def*=1.04;koMod=1.04}
  atk*=readiness*health*fatigue*age; def*=readiness*health*fatigue*age;
  log.push(`${G.name}  vs  ${f.name}`);
  log.push(`${G.isPro?`${G.record.w}-${G.record.l}-${G.record.d} (${G.record.ko}KO)`:`業餘 ${G.amateur.w}-${G.amateur.l}`}  vs  ${f.record}`);
  log.push(`${f.city} · ${f.rounds} rounds\n`);
  for(let r=1;r<=f.rounds;r++){
    const ma=atk*rnd(90,110)/100,md=def*rnd(91,109)/100;
    const oa=f.ovr*rnd(90,111)/100,od=f.ovr*rnd(89,109)/100;
    const myRound=(ma-od)+rnd(-11,11),opRound=(oa-md)+rnd(-11,11);
    let line=`R${r}: `;
    if(myRound*scoreMod>opRound+3){myPts++;line+="你控制了有效進攻。";}
    else if(opRound>myRound*scoreMod+3){opPts++;line+=`${f.name} 拿下這回合。`;}
    else{myPts+=.5;opPts+=.5;line+="雙方非常接近。";}
    const dmgMe=clamp(Math.round((oa-md*.70+rnd(-7,10))/8),0,14);
    const dmgOp=clamp(Math.round((ma-od*.70+rnd(-7,10))/8),0,16);
    myHP-=dmgMe;opHP-=dmgOp;
    let myKo=clamp(((a.power-f.ovr)/520)+dmgOp/145+(100-opHP)/700,.004,.28)*koMod;
    let opKo=clamp(((f.ovr-a.chin)/510)+dmgMe/135+(100-myHP)/680,.004,.29);
    if(strategy==="counter"&&chance(.12))myKo*=1.6;
    if(chance(myKo)){winner="me";method=chance(.62)?"KO":"TKO";end=r;line+=` 你抓到終結機會，${method}！`;log.push(line);break}
    if(chance(opKo)){winner="opp";method=chance(.55)?"KO":"TKO";end=r;line+=" 你遭到重擊，比賽被終止。";log.push(line);break}
    log.push(line);
  }
  if(!winner){
    if(Math.abs(myPts-opPts)<1){winner="draw";method="Draw"}
    else if(myPts>opPts){winner="me";method=chance(.18)?"SD":"UD"}
    else{winner="opp";method=chance(.20)?"SD":"UD"}
  }
  applyFight(f,winner,method,end,log);
}
function applyFight(f,winner,method,end,log){
  if(G.isPro){
    const oldRank=G.rank; G.money+=f.purse; G.careerIncome=(G.careerIncome||0)+f.purse; G.fatigue=clamp(G.fatigue+rnd(18,29),0,100);
    G.health=clamp(G.health-rnd(5,14)-(winner==="opp"?rnd(3,8):0),0,100);
    G.readiness=clamp(G.readiness-rnd(18,28),0,100); G.weightRisk=clamp(G.weightRisk-rnd(5,15),0,100);
    const title=TITLE_DEFS.find(x=>x.id===f.title);
    if(winner==="me"){
      G.record.w++; if(["KO","TKO"].includes(method))G.record.ko++;
      const quality=Math.max(.5,f.ovr/Math.max(45,ovr()));
      const jump=Math.round(rnd(50,150)*quality*(1+Math.min(2.2,oldRank/700)));
      G.rank=clamp(G.rank-jump,1,2500); G.fame=clamp(G.fame+rnd(3,7)+(method==="KO"?3:0),0,100);
      G.morale=clamp(G.morale+rnd(5,9),0,100); G.promoterInterest=clamp(G.promoterInterest+rnd(4,9),0,100);
      trainXP("technique",rnd(3,6)); trainXP("stamina",rnd(2,5)); addSkillPoints(1,"贏下職業賽"); addLog(`擊敗 ${f.name}（${method}${["KO","TKO"].includes(method)?" R"+end:""}），世界排名 #${oldRank} → #${G.rank}。`,"good");
      if(title&&!G.titles.includes(title.id)){G.titles.push(title.id);G.fame=clamp(G.fame+10,0,100);addSkillPoints(title.id==="world"?3:2,`贏得${title.zh}`);addLog(`🏆 贏得 ${title.zh}！`,"titlelog")}
      log.push(`\n✅ ${G.name} wins by ${method}${["KO","TKO"].includes(method)?" R"+end:""}`);
    }else if(winner==="opp"){
      G.record.l++; G.rank=clamp(G.rank+rnd(50,140),1,2500); G.morale=clamp(G.morale-rnd(6,11),0,100);
      addLog(`敗給 ${f.name}（${method}${["KO","TKO"].includes(method)?" R"+end:""}），排名退到 #${G.rank}。`,"bad");
      log.push(`\n❌ ${f.name} wins by ${method}${["KO","TKO"].includes(method)?" R"+end:""}`);
    }else{
      G.record.d++; G.rank=clamp(G.rank+rnd(-15,20),1,2500); addLog(`與 ${f.name} 戰成平手。`,"");
      log.push("\n➖ Draw");
    }
    log.push(`Ranking: ${winner==="me"?"up":"adjusted"}`); log.push(`Purse: ${money(f.purse)}`);
  }else{
    G.fatigue=clamp(G.fatigue+rnd(10,18),0,100); G.health=clamp(G.health-rnd(2,8),0,100); G.readiness=clamp(G.readiness+rnd(2,7),0,100);
    if(winner==="me"){ G.amateur.w++; G.fame=clamp(G.fame+rnd(1,4),0,100); G.morale=clamp(G.morale+rnd(3,7),0,100); addSkillPoints(1,"贏下業餘賽"); addLog(`你在業餘賽擊敗 ${f.name}（${method}）。`,"good"); trainXP("technique",rnd(3,5)); trainXP("stamina",rnd(2,4)); }
    else if(winner==="opp"){ G.amateur.l++; G.morale=clamp(G.morale-rnd(2,6),0,100); addLog(`你在業餘賽輸給 ${f.name}（${method}）。`,"bad"); trainXP("chin",rnd(2,4)); }
    else { addLog(`你與 ${f.name} 在業餘賽打成平手。`,""); }
    log.push(`\n業餘戰績：${G.amateur.w}-${G.amateur.l}`);
  }
  delete G.pendingFight; advanceWeek(rnd(2,5)); generateOffers(); G.currentEvent=pickEvent(); checkPhaseUp(); save(false);
  document.querySelector("#fightModalTitle").textContent=`${G.name} vs ${f.name}`;
  const art=document.querySelector("#fightResultArt"); if(art){
    const src=winner==="me"?"assets/champion.png":winner==="opp"?"assets/medical.png":"assets/fight.png";
    art.innerHTML=`<div class="real-pixel-art result-picture"><img src="${src}" alt="比賽結果"></div>`;
  }
  document.querySelector("#fightLog").textContent=log.join("\n");
  document.querySelector("#fightModal").classList.remove("hidden"); render();
}
function closeFightModal(){ document.querySelector("#fightModal").classList.add("hidden") }
function save(show=true){ if(G)localStorage.setItem(SAVE_KEY,JSON.stringify(G)); if(show&&G){addLog("生涯已儲存。","good"); render()} }
function loadGame(){
  const r=localStorage.getItem(SAVE_KEY); if(!r)return;
  G=JSON.parse(r); setSeed(G.seed||"boxing");
  if(!G.currentEvent)G.currentEvent=pickEvent();
  if(!G.offers||!G.offers.length)generateOffers();
  render();
}
function resetGame(){ if(confirm("確定要結束這次人生並重新建立拳手嗎？")){ localStorage.removeItem(SAVE_KEY); G=null; render(); } }

function avatarSVG(a, gender="male"){
  const hair2 = a.hair, skin=a.skin, glove=a.glove, shirt=a.shirt, eye=a.eye;
  const bow = gender==="female" ? `<rect x="13" y="7" width="11" height="5" fill="#ff5aa8"/><rect x="48" y="7" width="11" height="5" fill="#ff5aa8"/><rect x="28" y="6" width="16" height="6" fill="#ffd6ea"/>` : ``;
  return `<svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
    <rect width="72" height="72" fill="#141028"/>
    <rect y="54" width="72" height="18" fill="#0d0a1d"/>
    <rect x="11" y="14" width="50" height="36" fill="${skin}"/>
    <rect x="8" y="10" width="56" height="12" fill="${hair2}"/>
    <rect x="7" y="18" width="8" height="12" fill="${hair2}"/>
    <rect x="57" y="18" width="8" height="12" fill="${hair2}"/>
    <rect x="12" y="48" width="48" height="12" fill="${shirt}"/>
    <rect x="7" y="49" width="12" height="12" fill="${glove}"/>
    <rect x="53" y="49" width="12" height="12" fill="${glove}"/>
    <rect x="25" y="28" width="5" height="5" fill="${eye}"/>
    <rect x="42" y="28" width="5" height="5" fill="${eye}"/>
    <rect x="29" y="38" width="14" height="3" fill="#8b5a3c"/>
    <rect x="23" y="23" width="10" height="2" fill="#000" opacity=".25"/><rect x="40" y="23" width="10" height="2" fill="#000" opacity=".25"/>
    ${bow}
  </svg>`;
}
function miniAvatar(g){ return `<div class="chibi small-chibi">${avatarSVG(g.avatar||defaultAvatar(), g.gender)}</div>` }
function fullAvatar(g){ return `<div class="chibi">${avatarSVG(g.avatar||defaultAvatar(), g.gender)}</div>` }

function phaseHTML(){
  return `<div class="stage">${CAREER_PHASES.slice(0,4).map((p,i)=>`<div class="stage-card ${i===Math.min(G.phaseIndex,3)?"on":""}">
    <b>${p.zh}</b><span>${p.need} 勝門檻</span></div>`).join("")}</div>`;
}
function startScreen(){
  return `<div class="start-desktop"><div class="hero">
    <div class="eyebrow">BOXING LIFE · V11 STORY MODE</div>
    <h1>拳擊<br>人生</h1>
    <p>你是來自台灣的拳手，先選擇前往美國、日本或菲律賓留學兼學拳，從業餘起步，一步步走向職業與世界舞台。整體視覺改成 Q版復古像素風格，致敬 90 年代街機格鬥遊戲的熱血感。</p>
  </div>
  <div class="wrap">
    <div class="panel">
      <div class="label">Create Fighter</div>
      <div class="field"><label>拳手姓名</label><input id="nm" value="李逍遙"></div>
      <div class="field"><label>性別</label><div class="chips">
        <button class="chip gender on" data-v="male" onclick="chipOne('gender',this)">♂ 男子</button>
        <button class="chip gender" data-v="female" onclick="chipOne('gender',this)">♀ 女子</button>
      </div></div>
      <div class="field"><label>起始年齡（業餘）</label><select id="age">${Array.from({length:13},(_,i)=>`<option ${i===0?"selected":""}>${18+i}</option>`).join("")}</select></div>
      <div class="field"><label>量級</label><select id="weight">${WEIGHTS.map(x=>`<option ${x==="Lightweight"?"selected":""}>${x}</option>`).join("")}</select></div>
      <div class="field"><label>拳風</label><div class="note">所有序章、章節升級、隨機事件、賽前與賽後畫面都支援 Q版復古像素場景。</div><div class="chips">
        ${Object.entries(STYLES).map(([k,s],i)=>`<button class="chip style ${i===0?"on":""}" data-v="${k}" onclick="chipOne('style',this)">${s.zh}</button>`).join("")}
      </div></div>
      <div class="field">
        <div class="alloc-head"><label style="margin:0">開局自由能力點數</label><span id="pointsLeft" class="points-left">剩餘 ${START_POINTS} 點</span></div>
        <div class="note" style="margin-bottom:8px">總共只有 ${START_POINTS} 點，單一能力最多 +3。之後每個生涯階段升級還會再拿少量自由點數。</div>
        <div class="alloc-grid">
          ${SKILLS.map(k=>`<div class="alloc"><div class="top"><span class="name">${SKILL_NAMES[k]}</span><span id="alloc-${k}" class="value">+0</span></div>
          <div class="ctrl"><button onclick="changeAlloc('${k}',-1)">−</button><button onclick="changeAlloc('${k}',1)">＋</button></div></div>`).join("")}
        </div>
      </div>
      <div class="field"><label>出發地設定</label><div class="note">劇情固定為台灣人出國留學＋打拳。</div></div>
      <div class="field"><label>留學起點國家</label><select id="country" onchange="updateCityOptions()">${Object.entries(START_DESTINATIONS).map(([k,v],i)=>`<option value="${k}" ${i===0?"selected":""}>${v.zh}</option>`).join("")}</select></div>
      <div class="field"><label>落腳城市</label><select id="city"></select></div>
      <div class="field"><label>種子碼</label><input id="seed" value="${makeSeed()}"></div>
      <button class="btn" style="margin-top:16px" onclick="createGame()">從業餘開始 🥊</button>
    </div>
    ${localStorage.getItem(SAVE_KEY)?`<button class="btn ghost" onclick="loadGame()">讀取上次生涯</button>`:""}
  </div></div>`;
}
function chipOne(cls,el){ document.querySelectorAll("."+cls).forEach(x=>x.classList.remove("on")); el.classList.add("on"); }
function updateCityOptions(){
  const country=document.querySelector("#country"); const city=document.querySelector("#city");
  if(!country||!city)return;
  const arr=(START_DESTINATIONS[country.value]||START_DESTINATIONS.USA).cities;
  city.innerHTML=arr.map((x,i)=>`<option ${i===0?"selected":""}>${x}</option>`).join("");
}
function resetAlloc(){ alloc={power:0,speed:0,stamina:0,defense:0,chin:0,technique:0}; }
function allocUsed(){ return SKILLS.reduce((s,k)=>s+(alloc[k]||0),0); }
function changeAlloc(skill,delta){
  const used=allocUsed();
  if(delta>0){ if(used>=START_POINTS)return; if((alloc[skill]||0)>=3)return; alloc[skill]=(alloc[skill]||0)+1; }
  else{ if((alloc[skill]||0)<=0)return; alloc[skill]-=1; }
  updateAllocUI();
}
function updateAllocUI(){
  SKILLS.forEach(k=>{ const el=document.querySelector("#alloc-"+k); if(el)el.textContent="+"+(alloc[k]||0); });
  const left=document.querySelector("#pointsLeft"); if(left)left.textContent=`剩餘 ${START_POINTS-allocUsed()} 點`;
}
function spendSkillPoint(skill){
  if(G.skillPoints<=0)return;
  G.skillPoints--; G.stats[skill]=clamp(G.stats[skill]+1,1,99); addLog(`${SKILL_NAMES[skill]} +1。`, "good"); render();
}
function attrHTML(k){
  const v=G.stats[k], need=xpNeed(v), x=G.xp[k]||0;
  return `<div class="attr"><div class="r"><span>${SKILL_NAMES[k]}</span><b>${v}</b></div>
    <div class="bar"><i style="width:${v}%"></i></div><div class="xp">${Math.floor(x)}/${Math.ceil(need)} XP ${G.skillPoints>0?` · <a href="#" onclick="spendSkillPoint('${k}');return false;" style="color:#f2bf54;text-decoration:none">+1</a>`:""}</div></div>`;
}
function offersHTML(){
  if(!G.offers.length) generateOffers();
  return G.offers.map(f=>{
    const t=TITLE_DEFS.find(x=>x.id===f.title);
    const oppMini = `<div class="small-chibi">${miniAvatar({avatar:defaultAvatar(),gender:G.gender})}</div>`;
    return `<div class="offer ${t?"titlefight":""}">
      <div class="offer-h"><b>${f.name}</b><span>${countryLabelFromCity(f.city)} · ${t?"🏆 "+t.zh:(G.isPro?`#${f.rank}`:"業餘")}</span></div>
      <div class="offer-meta">${f.record} · OVR ${f.ovr}<br>${f.city} · ${f.rounds} 回合 ${G.isPro?`· ${money(f.purse)}`:""}</div>
      <div class="offer-actions"><button class="btn small" onclick="acceptFight('${f.id}')">接下比賽</button></div>
    </div>`;
  }).join("");
}
function render(){
  const app=document.querySelector("#app");
  if(!G){ resetAlloc(); app.innerHTML=startScreen(); updateAllocUI(); updateCityOptions(); return; }
  const dest=(START_DESTINATIONS[G.destinationCountry]||{zh:G.destinationCountry}).zh;
  const side=`<aside class="desktop-side">
    <div class="brand">BOXING <em>LIFE</em></div><div class="brand-sub">拳擊人生模擬器 · V11</div>
    <div class="side-route"><b>🇹🇼 留學路線</b><span>台灣 → ${dest}<br>${G.baseCity} · ${G.isPro?"職業":"業餘"}</span></div>
    <div class="side-nav">
      <button class="active">📖 事件劇情</button><button>🥊 訓練</button><button>🏆 比賽</button><button>📅 行程</button><button>⭐ 技能樹</button><button>📊 數據</button><button>🏅 成就</button><button onclick="save()">💾 儲存</button><button onclick="resetGame()">⚙️ 重開人生</button>
    </div>
    <div class="side-mini">SEED ${esc(G.seed||"")}<br>${G.year} · Week ${G.week}<br>所有事件圖片：獨立 Q 版復古像素圖</div>
  </aside>`;
  const hud=`<div class="hud">
      <div class="hud-top">
        <div class="avatar">${fullAvatar(G)}</div>
        <div class="hud-name"><b>${esc(G.name)}</b><span>${G.weight} · ${STYLES[G.style].zh} · 台灣 → ${dest} / ${G.baseCity}</span><div class="trip">台灣留學生拳手</div></div>
        <div class="ovr"><b>${ovr()}</b><span>OVR</span></div>
      </div>
      <div class="hud-stats">
        <div class="hs"><b>${G.isPro?`${G.record.w}-${G.record.l}-${G.record.d}`:`${G.amateur.w}-${G.amateur.l}`}</b><span>${G.isPro?"RECORD":"AMATEUR"}</span></div>
        <div class="hs"><b>${G.record.ko}</b><span>KO</span></div>
        <div class="hs"><b>${G.isPro?`#${G.rank}`:"未職業"}</b><span>RANK</span></div>
        <div class="hs"><b>${G.age}</b><span>AGE</span></div>
        <div class="hs"><b>${money(G.money)}</b><span>MONEY</span></div>
      </div>
    </div>`;
  const normal=`
      <div class="phase-banner"><b>目前階段：</b> ${currentPhase().zh} ｜ ${currentPhase().desc}<br><span class="note">故事背景：來自台灣，正在 ${dest} 留學兼打拳 ｜ 下一階段門檻：${G.isPro?G.record.w:G.amateur.w}/${stageWinsNeeded()} 勝 ｜ 可用自由點數：${G.skillPoints}</span></div>
      <div class="dashboard-grid">
        <div class="primary-col">
          <div class="panel"><div class="label">Career Stage</div>${phaseHTML()}</div>
          <div id="eventBox" class="panel ${isSpecialEvent(G.currentEvent)?"special-panel":""}">${eventHTML()}</div>
          <div class="panel"><div class="label">Arcade Career Log</div><div class="timeline">${G.logs.map(l=>`<div class="log ${l.type}"><span class="when">${l.when}</span>${esc(l.text)}</div>`).join("")}</div></div>
        </div>
        <div class="secondary-col">
          <div class="panel"><div class="label">Attributes · 可用點數 ${G.skillPoints}</div><div class="attrs">${SKILLS.map(k=>attrHTML(k)).join("")}</div><div class="note" style="margin-top:10px">每次獲勝 +1 自由點數；升級階段與冠軍賽還有額外獎勵。</div></div>
          <div class="panel"><div class="season"><b>${G.isPro?"FIGHT OFFERS":"AMATEUR BOUTS"}</b><span>${G.isPro?"職業賽場":"業餘賽場"}</span></div>${offersHTML()}</div>
          <div class="panel"><div class="label">Titles</div><div class="badges" style="margin-top:8px">${G.titles.length?G.titles.map(id=>{const t=TITLE_DEFS.find(x=>x.id===id);return `<span class="badge">🏆 ${t.zh}</span>`}).join(""):`<span class="note">尚未取得冠軍</span>`}</div></div>
        </div>
      </div>`;
  app.innerHTML=`<div class="desktop-shell">${side}<main class="game-main">${hud}<div class="wrap">${G.storyCard?renderStoryCard():normal}</div><div class="actionbar"><div class="inner"><button class="btn ghost" onclick="save()">儲存</button><button class="btn ghost" onclick="resetGame()">重開</button></div></div></main></div>`;
}
function eventHTML(){
  if(G.lastOutcome)return "";
  const e=G.currentEvent||pickEvent();
  return `${isSpecialEvent(e)?`<div class="special-tag">★ SPECIAL EVENT</div>`:""}
    <div class="season" style="margin-top:${isSpecialEvent(e)?"9px":"0"}"><b>${e.cat}</b><span>${G.year} · Week ${G.week}</span></div>
    <div class="title">${e.title}</div>
    ${eventImageHTML(e)}
    <div class="text">${e.text}</div>
    <div class="opts">${e.options.map((o,i)=>`<button class="opt" onclick="chooseEvent(${i})"><div class="ico">${o.ico}</div><div class="ot"><b>${o.label}</b><span>${o.hint}</span></div></button>`).join("")}</div>`;
}
window.addEventListener("load",()=>{
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){ try{ G=JSON.parse(raw); setSeed(G.seed||"boxing"); if(!G.currentEvent)G.currentEvent=pickEvent(); if(!G.offers?.length)generateOffers(); }catch(e){G=null} }
  render();
  if(!G) setTimeout(()=>{ try{ updateCityOptions(); }catch(e){} },0);
});
</script>
</body>
</html>
