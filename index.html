<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拳擊人生 · Boxing Life USA</title>
<style>
:root{
  --bg:#090b10;--surface:#121722;--surface2:#191f2c;--line:#2b3444;
  --ink:#f4f6f8;--dim:#9aa7b8;--faint:#66748a;
  --red:#e64a4a;--red2:#a92525;--gold:#f2bf54;--green:#55c985;--blue:#62a8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -80px,rgba(230,74,74,.20),transparent 330px),
    linear-gradient(180deg,#090b10,#0c1017 55%,#090b10);
}
button,input,select{font:inherit}
button{border:0;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:88px}
.wrap{padding:14px}
.hero{padding:48px 18px 24px;text-align:center}
.hero .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--red);font-weight:800}
.hero h1{font-size:52px;line-height:.88;margin:8px 0 8px;letter-spacing:-2px}
.hero p{color:var(--dim);font-size:14px;margin:0 auto;max-width:360px;line-height:1.6}
.panel{
  background:linear-gradient(180deg,var(--surface),#0f141d);
  border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;
  box-shadow:0 12px 30px rgba(0,0,0,.16)
}
.label{font-size:10px;letter-spacing:.15em;color:var(--faint);font-weight:800;text-transform:uppercase}
.field{margin-top:13px}
.field label{display:block;color:var(--dim);font-size:12px;margin-bottom:7px}
input,select{
  width:100%;border:1px solid var(--line);background:#0b1018;color:var(--ink);
  border-radius:11px;padding:11px 12px;outline:none
}
input:focus,select:focus{border-color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  flex:1;min-width:88px;padding:10px 10px;border-radius:999px;background:#0c1119;
  border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700
}
.chip.on{background:var(--red);border-color:var(--red);color:white}
.btn{
  width:100%;padding:12px 14px;border-radius:12px;background:linear-gradient(100deg,var(--red),#ff6c55);
  font-weight:850;color:white;box-shadow:0 8px 24px -14px var(--red)
}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.gold{background:linear-gradient(100deg,#e5a72a,var(--gold));color:#201504}
.btn.small{width:auto;padding:9px 12px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.hud{
  position:sticky;top:0;z-index:30;background:rgba(9,11,16,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);border-top:2px solid var(--red)
}
.hud-top{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:9px 12px}
.avatar{
  width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,var(--red),#6f1616);
  display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900
}
.hud-name{min-width:0}.hud-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-name span{display:block;color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ovr{text-align:center;border-left:1px solid var(--line);padding-left:10px}
.ovr b{display:block;font-size:27px;color:var(--gold);line-height:1}.ovr span{font-size:9px;color:var(--faint);letter-spacing:.1em}
.hud-stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.hs{text-align:center;padding:6px 2px;border-right:1px solid var(--line)}.hs:last-child{border-right:0}
.hs b{display:block;font-size:13px}.hs span{display:block;font-size:8.5px;color:var(--faint);margin-top:1px}
.season{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:5px}
.season b{font-size:12px;color:var(--red);letter-spacing:.08em}.season span{font-size:11px;color:var(--faint)}
.title{font-size:21px;font-weight:900;margin:4px 0 7px}
.text{font-size:14px;color:var(--dim);line-height:1.65}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.opt{
  background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--red);
  padding:12px;border-radius:12px;text-align:left;display:grid;grid-template-columns:35px 1fr;gap:10px;align-items:center
}
.opt:active{transform:scale(.99)}
.ico{width:35px;height:35px;border-radius:9px;background:#0c1118;display:flex;align-items:center;justify-content:center;font-size:18px}
.ot b{display:block;font-size:14px}.ot span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}
.dice-stage{text-align:center;padding:8px 0}
.die{
  width:82px;height:82px;border-radius:17px;background:linear-gradient(145deg,#fff,#ddd8ca);
  margin:8px auto;color:#141414;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;
  box-shadow:0 10px 25px rgba(0,0,0,.35)
}
.die.rolling{animation:shake .16s linear infinite}
@keyframes shake{0%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-5px)}100%{transform:rotate(-9deg)}}
.outcome{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--surface2);border-radius:12px;padding:12px;margin-top:10px}
.outcome.good{border-left-color:var(--green)}.outcome.bad{border-left-color:var(--red)}
.deltas{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.delta{font-size:11px;padding:3px 7px;border-radius:6px;background:#0c1118;border:1px solid var(--line)}
.delta.pos{color:var(--green)}.delta.neg{color:#ff8989}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px 13px}
.attr .r{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.attr .r b{color:var(--ink)}
.bar{height:6px;background:#222a37;border-radius:999px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red))}
.xp{font-size:8.5px;color:var(--faint);margin-top:3px;text-align:right}
.offer{
  padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;margin-top:9px
}
.offer.titlefight{border-color:#7e662e;background:linear-gradient(135deg,#211b0d,var(--surface2))}
.offer-h{display:flex;justify-content:space-between;gap:8px}.offer-h b{font-size:15px}.offer-h span{font-size:10px;color:var(--gold)}
.offer-meta{color:var(--dim);font-size:11px;margin-top:4px;line-height:1.6}
.offer-actions{display:flex;gap:8px;margin-top:10px}.offer-actions .btn{flex:1}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{padding:5px 9px;border-radius:999px;border:1px solid #66562a;background:#211b0e;color:var(--gold);font-size:11px;font-weight:700}
.timeline{max-height:310px;overflow:auto}
.log{padding:9px 0;border-bottom:1px dashed #273041;font-size:12.5px;line-height:1.5}
.log:last-child{border-bottom:0}.log .when{display:block;color:var(--faint);font-size:9.5px;margin-bottom:2px}
.log.good{color:#c8f5d8}.log.bad{color:#ffd0d0}.log.titlelog{color:#ffe39a}
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,transparent,rgba(9,11,16,.97) 28%);padding:12px 14px 16px
}
.actionbar .inner{max-width:520px;margin:auto;display:flex;gap:8px}
.actionbar .btn{flex:1}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.modalbox{width:min(500px,100%);max-height:90vh;overflow:auto;background:#10151e;border:1px solid var(--line);border-radius:18px;padding:16px}
.fightlog{white-space:pre-line;background:#090d13;border:1px solid var(--line);border-radius:12px;padding:11px;font:12px/1.6 ui-monospace,monospace;max-height:310px;overflow:auto}
.note{font-size:11px;color:var(--faint);line-height:1.55}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.hidden{display:none!important}

.alloc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.points-left{font-size:12px;color:var(--gold);font-weight:900}
.alloc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alloc{
  background:#0c1118;border:1px solid var(--line);border-radius:11px;padding:9px
}
.alloc .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.alloc .name{font-size:11px;color:var(--dim);font-weight:800}
.alloc .value{font-size:17px;font-weight:900}
.alloc .ctrl{display:flex;gap:5px;margin-top:7px}
.alloc .ctrl button{
  flex:1;background:#171e2a;border:1px solid var(--line);border-radius:8px;padding:5px;color:var(--ink);font-weight:900
}
.alloc .ctrl button:disabled{opacity:.28}
.event-image{
  width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:12px;border:1px solid var(--line);
  margin:9px 0 11px;background:#090d13
}
.special-panel{
  border-color:#72561c!important;
  background:linear-gradient(160deg,#20190b,#111722 46%,#0f141d)!important;
  box-shadow:0 12px 34px rgba(242,191,84,.08)!important
}
.special-tag{
  display:inline-flex;padding:4px 8px;border-radius:999px;background:#2b210c;border:1px solid #735919;
  color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.13em
}

</style>
</head>
<body>
<div id="app"></div>

<div id="fightModal" class="modal hidden">
  <div class="modalbox">
    <div class="label">Fight Night</div>
    <h2 id="fightModalTitle" style="margin:5px 0 10px"></h2>
    <div id="fightLog" class="fightlog"></div>
    <button class="btn" style="margin-top:12px" onclick="closeFightModal()">繼續生涯</button>
  </div>
</div>

<script>
// =========================================================
// BOXING LIFE USA V4 — single-file GitHub Pages game
// =========================================================
const SAVE_KEY="boxing-life-usa-v4";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let rng=Math.random;
function seedHash(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}
function setSeed(s){
  let a=seedHash(String(s||"boxing"));
  rng=function(){
    a+=0x6D2B79F5;
    let t=a;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const rnd=(a,b)=>Math.floor(rng()*(b-a+1))+a;
const chance=p=>rng()<p;
const pick=a=>a[Math.floor(rng()*a.length)];
const money=n=>"$"+Math.round(n).toLocaleString();

const WEIGHTS=[
  "Bantamweight","Featherweight","Super Featherweight","Lightweight",
  "Super Lightweight","Welterweight","Middleweight","Super Middleweight"
];
const CITIES=["Las Vegas, NV","Los Angeles, CA","New York, NY","Miami, FL","Houston, TX","Philadelphia, PA"];
const FIGHT_CITIES=["Las Vegas, NV","Los Angeles, CA","New York, NY","Atlantic City, NJ","Miami, FL","Dallas, TX","Houston, TX","Philadelphia, PA"];
const STYLES={
  pressure:{name:"Pressure Fighter",zh:"壓迫型",mods:{stamina:5,chin:3,speed:-2}},
  boxer:{name:"Out-Boxer",zh:"技巧型",mods:{speed:5,technique:4,power:-2}},
  puncher:{name:"Puncher",zh:"重砲型",mods:{power:7,speed:-3,defense:-2}},
  counter:{name:"Counter Puncher",zh:"反擊型",mods:{defense:5,technique:5,stamina:-2}}
};
const SKILLS=["power","speed","stamina","defense","chin","technique"];
const SKILL_NAMES={power:"POWER",speed:"SPEED",stamina:"STAMINA",defense:"DEFENSE",chin:"CHIN",technique:"TECHNIQUE"};

const TITLE_DEFS=[
  {id:"state",name:"State Champion",zh:"州級冠軍",rank:650},
  {id:"regional",name:"American Regional Champion",zh:"美國區域冠軍",rank:300},
  {id:"northamerica",name:"North American Champion",zh:"北美冠軍",rank:100},
  {id:"international",name:"International Champion",zh:"國際冠軍",rank:35},
  {id:"world",name:"World Champion",zh:"世界冠軍",rank:8}
];

const MALE_FIRST=["Andre","Marcus","Diego","Luis","Jamal","Ethan","Miguel","Darius","Carlos","Noah","Rafael","Jordan","Isaiah","Marco"];
const FEMALE_FIRST=["Alyssa","Maya","Sofia","Bianca","Naomi","Gabriela","Jasmine","Kayla","Elena","Tiana","Maria","Ariana","Nina","Camila"];
const LAST=["Santos","Reyes","Miller","Johnson","Garcia","Torres","Williams","Ramirez","Cruz","Davis","Lopez","Brown","Flores","Martinez"];

let G=null;
let pendingOutcome=null;
let START_POINTS=8;
let alloc={power:0,speed:0,stamina:0,defense:0,chin:0,technique:0};

function makeSeed(){return Math.random().toString(36).slice(2,10)}
function opponentName(){
  return pick(G.gender==="female"?FEMALE_FIRST:MALE_FIRST)+" "+pick(LAST);
}
function ovr(){
  const a=G.stats;
  return Math.round(a.power*.18+a.speed*.17+a.stamina*.17+a.defense*.16+a.chin*.13+a.technique*.19);
}
function xpNeed(v){
  if(v<60)return 12+(v-45)*.5;
  if(v<70)return 22+(v-60)*1.1;
  if(v<80)return 38+(v-70)*2.2;
  if(v<90)return 64+(v-80)*4.0;
  return 115+(v-90)*8.5;
}
function trainXP(skill,amount){
  if(G.stats[skill]>=99)return 0;
  const potential=G.potential[skill]||80;
  let ageFactor=G.age<=27?1:G.age<=31?.90:G.age<=34?.76:G.age<=37?.60:.43;
  let fatigueFactor=G.fatigue<45?1:G.fatigue<65?.78:.53;
  let potFactor=G.stats[skill]<potential?1:G.stats[skill]<potential+4?.45:.15;
  G.xp[skill]+=amount*ageFactor*fatigueFactor*potFactor;
  let ups=0;
  while(G.stats[skill]<99 && G.xp[skill]>=xpNeed(G.stats[skill])){
    G.xp[skill]-=xpNeed(G.stats[skill]);
    G.stats[skill]++;ups++;
  }
  return ups;
}
function addLog(text,type=""){
  G.logs.unshift({text,type,when:`${G.year} · Week ${G.week}`});
  G.logs=G.logs.slice(0,100);
}
function advanceWeek(n=1){
  for(let i=0;i<n;i++){
    G.week++;
    G.fatigue=clamp(G.fatigue-rnd(1,3),0,100);
    G.health=clamp(G.health+1,0,100);
    if(G.week>52){
      G.week=1;G.year++;G.age++;
      if(G.age>=34 && chance(.65))G.stats.speed=clamp(G.stats.speed-1,25,99);
      if(G.age>=36 && chance(.55))G.stats.stamina=clamp(G.stats.stamina-1,25,99);
    }
  }
  G.turn++;
  if(G.age>=43 && !G.retired){
    G.retired=true;addLog("你正式宣布退休，職業生涯落幕。","titlelog");
  }
}
function baseGame(){
  return {
    version:4,name:"",gender:"male",age:20,weight:"Lightweight",style:"pressure",baseCity:"Las Vegas, NV",
    seed:makeSeed(),year:2026,week:1,turn:0,phase:"event",retired:false,
    record:{w:0,l:0,d:0,ko:0},rank:1450,money:800,fame:4,health:100,fatigue:6,morale:70,
    manager:50,promoterInterest:12,readiness:35,weightRisk:10,
    stats:{power:50,speed:50,stamina:50,defense:50,chin:50,technique:50},
    xp:{power:0,speed:0,stamina:0,defense:0,chin:0,technique:0},
    allocation:{power:0,speed:0,stamina:0,defense:0,chin:0,technique:0},
    potential:{},titles:[],logs:[],offers:[],currentEvent:null,lastOutcome:null,
    fightsSinceOffer:0
  }
}
function createGame(){
  let g=baseGame();
  g.name=document.querySelector("#nm").value.trim()||"Rising Fighter";
  g.gender=document.querySelector(".gender.on").dataset.v;
  g.age=parseInt(document.querySelector("#age").value);
  g.weight=document.querySelector("#weight").value;
  g.style=document.querySelector(".style.on").dataset.v;
  g.baseCity=document.querySelector("#city").value;
  g.seed=document.querySelector("#seed").value.trim()||makeSeed();
  G=g;setSeed(G.seed);

  // 套用玩家開局自由點數（總共 8 點，單項最多 +3）
  G.allocation={...alloc};
  SKILLS.forEach(k=>G.stats[k]=clamp(G.stats[k]+(alloc[k]||0),30,70));

  const m=STYLES[G.style].mods;
  Object.entries(m).forEach(([k,v])=>G.stats[k]=clamp(G.stats[k]+v,30,70));
  SKILLS.forEach(k=>{
    let p=rnd(76,88);
    if(chance(.16))p+=rnd(4,8);
    G.potential[k]=clamp(p,74,96);
  });

  addLog(`${G.name} 在 ${G.baseCity} 取得職業拳手執照，以 0-0 戰績正式開始美國職業生涯。`,"good");
  G.currentEvent=pickEvent();
  save(false);render();
}

const EVENTS=[
  {
    id:"sparring",cat:"TRAINING",title:"高強度 Sparring",
    text:"教練找來一名風格強硬的陪練。這是提升實戰能力的好機會，但你最近的身體負荷不算低。",
    options:[
      {ico:"🥊",label:"硬打 8 回合",hint:"高收益 · 傷病風險",skill:"technique",base:7,risk:.22,
       low:["最後幾回合被打得很亂，手腕也有點不舒服。",{health:-8,fatigue:12,morale:-2}],
       mid:["你適應了強度，實戰細節有所進步。",{xp:{technique:7,defense:3},fatigue:9,readiness:6}],
       high:["你完全掌握節奏，把陪練打得無法舒服出拳。",{xp:{technique:10,defense:5},fame:2,readiness:10,fatigue:8}]},
      {ico:"🧠",label:"控制強度，專練戰術",hint:"穩定成長",skill:"technique",base:5,risk:.06,
       low:["今天節奏普通，但至少沒有受傷。",{xp:{technique:3},fatigue:4}],
       mid:["你把教練要求的戰術走得很完整。",{xp:{technique:6,defense:3},readiness:5}],
       high:["戰術理解突然開竅，整個團隊都很滿意。",{xp:{technique:8,defense:4},morale:4,readiness:8}]}
    ]
  },
  {
    id:"strength",cat:"TRAINING",title:"力量教練的新課表",
    text:"體能教練提出一套爆發力週期，但這會壓縮拳擊技術訓練時間。",
    options:[
      {ico:"🏋️",label:"進入力量週期",hint:"Power / Stamina",low:["課表太重，你累得不像拳手。",{fatigue:12,health:-3}],mid:["身體力量開始有感。",{xp:{power:7,stamina:3},fatigue:8}],high:["爆發力測試大幅進步。",{xp:{power:10,stamina:5},readiness:3}]},
      {ico:"🎯",label:"維持拳擊專項",hint:"Technique / Speed",low:["訓練很平淡。",{xp:{technique:2}}],mid:["拳擊節奏越來越流暢。",{xp:{technique:5,speed:3},readiness:4}],high:["手眼協調狀態極佳。",{xp:{technique:8,speed:5},morale:3}]}
    ]
  },
  {
    id:"viral",cat:"MEDIA",title:"訓練片段突然爆紅",
    text:"你在健身房打靶的短影片被拳擊帳號轉發，一晚多了大量觀看。",
    options:[
      {ico:"📱",label:"趁勢經營社群",hint:"人氣 / 贊助",low:["你花很多時間回留言，反而影響訓練。",{fame:3,fatigue:3}],mid:["追蹤與詢問合作的人明顯增加。",{fame:7,money:250}],high:["影片衝上熱門，地方品牌主動找上門。",{fame:13,money:650,promoterInterest:5}]},
      {ico:"🥷",label:"低調，專心訓練",hint:"士氣 / 準備度",low:["熱度很快過去。",{morale:-1}],mid:["你維持節奏，沒有被流量打亂。",{readiness:5,morale:2}],high:["教練很欣賞你的專注。",{xp:{technique:5},readiness:7,morale:4}]}
    ]
  },
  {
    id:"sponsor",cat:"BUSINESS",title:"地方品牌提出贊助",

function pickEvent(){
  const normal=EVENTS.filter(e=>!e.cond||e.cond(G));
  const special=SPECIAL_EVENTS.filter(e=>!e.cond||e.cond(G));

  // 稀有事件約 11%，避免每週都在發生大事
  let pool=(special.length && chance(.11)) ? special : normal;
  let ev=pick(pool);

  if(G.currentEvent && pool.length>1){
    let tries=0;
    while(ev.id===G.currentEvent.id && tries++<6) ev=pick(pool);
  }
  return ev;
}


function eventImageHTML(e){
  return e && e.image ? `<img class="event-image" src="${e.image}" alt="${e.title}" onerror="this.style.display='none'">` : "";
}

function isSpecialEvent(e){
  return !!(e && e.special);
}

function applyDelta(delta){
  const labels=[];
  const simple={
    health:"健康",fatigue:"疲勞",morale:"士氣",fame:"人氣",money:"資金",
    readiness:"備戰",weightRisk:"減重風險",manager:"經紀關係",promoterInterest:"Promoter 興趣"
  };
  Object.entries(delta||{}).forEach(([k,v])=>{
    if(k==="xp"){
      Object.entries(v).forEach(([sk,amt])=>{
        const up=trainXP(sk,amt);
        labels.push({txt:`${SKILL_NAMES[sk]} ${up?`+${up}`:`+${amt} XP`}`,pos:true});
      });
    }else if(k==="offerBoost"){
      generateOffers(v);labels.push({txt:"比賽機會 ↑",pos:true});
    }else if(G[k]!==undefined){
      G[k]+=v;
      if(["health","fatigue","morale","fame","readiness","weightRisk","manager","promoterInterest"].includes(k))G[k]=clamp(G[k],0,100);
      if(k==="money")G.money=Math.max(0,G.money);
      labels.push({txt:`${simple[k]||k} ${v>0?"+":""}${v}${k==="money"?"$":""}`,pos:(k==="fatigue"||k==="weightRisk")?v<0:v>0});
    }
  });
  return labels;
}

function chooseEvent(idx){
  const ev=G.currentEvent,op=ev.options[idx];
  document.querySelector("#eventBox").innerHTML=`
    ${isSpecialEvent(ev)?`<div class="special-tag">★ SPECIAL EVENT</div>`:""}
    <div class="season" style="margin-top:${isSpecialEvent(ev)?"9px":"0"}"><b>${ev.cat}</b><span>${G.year} · Week ${G.week}</span></div>
    <div class="title">${ev.title}</div>
    ${eventImageHTML(ev)}
    <div class="dice-stage">
      <div id="die" class="die rolling">?</div>
      <div class="text">命運骰子正在決定結果…</div>
    </div>`;
  let ticks=0;
  const timer=setInterval(()=>{
    const d=document.querySelector("#die");if(d)d.textContent=rnd(1,6);
    ticks++;
    if(ticks>=10){
      clearInterval(timer);
      const roll=rnd(1,6);
      resolveEvent(ev,op,roll);
    }
  },70);
}
function resolveEvent(ev,op,roll){
  let mod=0;
  if(G.morale>=80)mod++;
  if(G.fatigue>=70)mod--;
  if(G.health<55)mod--;
  const final=clamp(roll+mod,1,6);
  const tier=final<=2?"low":final<=4?"mid":"high";
  const [txt,delta]=op[tier];
  const labels=applyDelta(delta);
  advanceWeek();
  G.lastOutcome={ev:ev.title,roll,final,tier,txt,labels};
  addLog(`${ev.title}：${txt}`,tier==="high"?"good":tier==="low"?"bad":"");
  if(G.turn%3===0 || G.offers.length===0)generateOffers();
  G.currentEvent=pickEvent();
  save(false);
  renderOutcome();
}
function renderOutcome(){
  const o=G.lastOutcome;
  const cls=o.tier==="high"?"good":o.tier==="low"?"bad":"";
  document.querySelector("#eventBox").innerHTML=`
    <div class="season"><b>OUTCOME</b><span>${G.year} · Week ${G.week}</span></div>
    <div class="dice-stage"><div class="die">${o.roll}</div></div>
    <div class="outcome ${cls}">
      <b>${o.ev}</b>
      <div class="text" style="margin-top:5px">${o.txt}</div>
      <div class="deltas">${o.labels.map(x=>`<span class="delta ${x.pos?"pos":"neg"}">${x.txt}</span>`).join("")}</div>
    </div>
    <button class="btn" style="margin-top:12px" onclick="nextEvent()">進入下一週</button>`;
}
function nextEvent(){G.lastOutcome=null;render()}

function generateOffers(boost=0){
  if(!G||G.retired)return;
  const me=ovr(),count=3;
  G.offers=[];
  for(let i=0;i<count;i++){
    let difficulty=(i-1)*rnd(3,6)+boost*3;
    let oppOvr=clamp(me+difficulty+rnd(-2,3),38,96);
    let oppRank=clamp(Math.round(G.rank*(1+(me-oppOvr)/55)+rnd(-80,80)),1,2500);
    let wins=Math.max(1,Math.round((oppOvr-38)*.35)+rnd(1,6));
    let losses=clamp(rnd(0,Math.max(1,Math.round((79-oppOvr)/9))),0,7);
    let kos=clamp(Math.round(wins*(.32+(oppOvr-45)/160)),0,wins);
    let purse=Math.max(350,Math.round(300+oppOvr*17+G.fame*12+(1600/Math.max(35,G.rank))*300));
    purse=Math.round(purse*(1+i*.28));
    let rounds=G.record.w<4?4:G.rank>650?6:G.rank>220?8:G.rank>40?10:12;
    let title=null;
    for(const t of TITLE_DEFS){
      if(!G.titles.includes(t.id)&&G.rank<=t.rank&&chance(.30+i*.10)){title=t.id;rounds=Math.max(rounds,t.id==="world"?12:10);purse=Math.round(purse*1.7);break}
    }
    G.offers.push({id:String(Date.now())+i+String(rnd(10,99)),name:opponentName(),ovr:oppOvr,rank:oppRank,
      record:`${wins}-${losses} (${kos}KO)`,purse,rounds,title,city:pick(FIGHT_CITIES)});
  }
}

function resolvePreFight(action){
  const pf=G.preFightEvent;
  if(!pf)return;
  const f=G.offers.find(x=>x.id===pf.fightId) || G.pendingFight;
  if(!f){delete G.preFightEvent;render();return}

  if(action==="acceptOver"){
    f.purse=Math.round(f.purse*1.20);
    f.ovr=clamp(f.ovr+2,38,99);
    G.fame=clamp(G.fame+3,0,100);
    addLog(`對手 ${f.name} 過磅超重，你接受額外補償後照常出賽。`,"");
    G.pendingFight=f;delete G.preFightEvent;renderFightPrep(f);return;
  }
  if(action==="declineOver"){
    addLog(`因對手 ${f.name} 過磅超重，你拒絕出賽。`,"bad");
    G.morale=clamp(G.morale+2,0,100);
    G.offers=G.offers.filter(x=>x.id!==f.id);
    delete G.pendingFight;delete G.preFightEvent;generateOffers();save(false);render();return;
  }
  if(action==="acceptReplacement"){
    f.name=opponentName();
    f.ovr=clamp(f.ovr+rnd(-3,5),38,97);
    f.rank=clamp(f.rank+rnd(-120,120),1,2500);
    G.readiness=clamp(G.readiness-5,0,100);
    addLog(`原對手退出，你接受臨時替補 ${f.name}。`,"");
    G.pendingFight=f;delete G.preFightEvent;renderFightPrep(f);return;
  }
  if(action==="declineReplacement"){
    addLog("原對手臨時退出，你選擇不接受替補對手。","bad");
    delete G.pendingFight;delete G.preFightEvent;generateOffers();save(false);render();return;
  }
  if(action==="takeTV"){
    f.purse=Math.round(f.purse*1.35);
    G.fame=clamp(G.fame+6,0,100);
    G.morale=clamp(G.morale+rnd(-2,4),0,100);
    addLog("比賽升上電視主卡，你接受了更大的舞台。","good");
    G.pendingFight=f;delete G.preFightEvent;renderFightPrep(f);return;
  }
  if(action==="keepSlot"){
    addLog("你選擇維持原本的比賽時段。","");
    G.pendingFight=f;delete G.preFightEvent;renderFightPrep(f);return;
  }
}

function acceptFight(id){
  const f=G.offers.find(x=>x.id===id);if(!f)return;
  if(G.health<45){addLog("醫療狀況不適合現在接賽。","bad");render();return}
  G.pendingFight=f;
  if(maybePreFightEvent(f)) return;
  renderFightPrep(f);
}
function renderFightPrep(f){
  const t=TITLE_DEFS.find(x=>x.id===f.title);
  document.querySelector("#eventBox").innerHTML=`
    <div class="season"><b>FIGHT CAMP</b><span>${f.city}</span></div>
    <div class="title">${G.name} vs ${f.name}</div>
    <div class="text">${f.record} · OVR ${f.ovr} · 世界 #${f.rank}<br>${f.rounds} 回合 · ${money(f.purse)}${t?` · 🏆 ${t.zh}`:""}</div>
    <div class="outcome ${G.weightRisk>55?"bad":""}">
      <b>賽前狀態</b>
      <div class="text">備戰 ${G.readiness}/100 · 健康 ${G.health}/100 · 疲勞 ${G.fatigue}/100 · 減重風險 ${G.weightRisk}/100</div>
    </div>
    <div class="opts">
      <button class="opt" onclick="fightStrategy('pressure')"><div class="ico">🔥</div><div class="ot"><b>前壓身體戰</b><span>Power / Stamina 主導，KO 機率較高</span></div></button>
      <button class="opt" onclick="fightStrategy('box')"><div class="ico">🦶</div><div class="ot"><b>控制距離</b><span>Speed / Technique 主導，判定較穩</span></div></button>
      <button class="opt" onclick="fightStrategy('counter')"><div class="ico">🎯</div><div class="ot"><b>等待反擊</b><span>Defense / Technique 主導，高變異</span></div></button>
    </div>
    <button class="btn ghost" style="margin-top:10px" onclick="cancelFight()">先不接這場</button>`;
}
function cancelFight(){delete G.pendingFight;render()}
function fightStrategy(strategy){
  const f=G.pendingFight;if(!f)return;
  simulateFight(f,strategy);
}
function simulateFight(f,strategy){
  const log=[];
  let myHP=100,opHP=100,myPts=0,opPts=0,winner=null,method="",end=f.rounds;
  const a=G.stats;
  const readiness=.82+G.readiness/400;
  const health=.78+G.health/455;
  const fatigue=1-G.fatigue/330;
  const weight=1-G.weightRisk/520;
  const age=G.age<=33?1:Math.max(.80,1-(G.age-33)*.018);
  let atk=a.power*.27+a.speed*.16+a.technique*.25+a.stamina*.17+a.chin*.05+a.defense*.10;
  let def=a.defense*.31+a.speed*.20+a.technique*.24+a.chin*.16+a.stamina*.09;
  let koMod=1,scoreMod=1;
  if(strategy==="pressure"){atk*=1.05;def*=.96;koMod=1.13}
  if(strategy==="box"){atk*=.98;def*=1.06;scoreMod=1.12;koMod=.86}
  if(strategy==="counter"){atk*=1.01;def*=1.04;koMod=1.04}
  atk*=readiness*health*fatigue*weight*age;
  def*=readiness*health*fatigue*weight*age;

  log.push(`${G.name}  vs  ${f.name}`);
  log.push(`${G.record.w}-${G.record.l}-${G.record.d} (${G.record.ko}KO)  vs  ${f.record}`);
  log.push(`${f.city} · ${f.rounds} rounds\n`);

  for(let r=1;r<=f.rounds;r++){
    const ma=atk*rnd(90,110)/100,md=def*rnd(91,109)/100;
    const oa=f.ovr*rnd(90,111)/100,od=f.ovr*rnd(89,109)/100;
    const myRound=(ma-od)+rnd(-11,11),opRound=(oa-md)+rnd(-11,11);
    let line=`R${r}: `;
    if(myRound*scoreMod>opRound+3){myPts++;line+="你控制了有效進攻。";}
    else if(opRound>myRound*scoreMod+3){opPts++;line+=`${f.name} 拿下這回合。`;}
    else{myPts+=.5;opPts+=.5;line+="雙方非常接近。";}
    const dmgMe=clamp(Math.round((oa-md*.70+rnd(-7,10))/8),0,14);
    const dmgOp=clamp(Math.round((ma-od*.70+rnd(-7,10))/8),0,16);
    myHP-=dmgMe;opHP-=dmgOp;
    let myKo=clamp(((a.power-f.ovr)/520)+dmgOp/145+(100-opHP)/700,.004,.28)*koMod;
    let opKo=clamp(((f.ovr-a.chin)/510)+dmgMe/135+(100-myHP)/680,.004,.29);
    if(strategy==="counter"&&chance(.12))myKo*=1.6;
    if(chance(myKo)){winner="me";method=chance(.62)?"KO":"TKO";end=r;line+=` 你抓到終結機會，${method}！`;log.push(line);break}
    if(chance(opKo)){winner="opp";method=chance(.55)?"KO":"TKO";end=r;line+=" 你遭到重擊，比賽被終止。";log.push(line);break}
    log.push(line);
  }
  if(!winner){
    if(Math.abs(myPts-opPts)<1){winner="draw";method="Draw"}
    else if(myPts>opPts){winner="me";method=chance(.18)?"SD":"UD"}
    else{winner="opp";method=chance(.20)?"SD":"UD"}
  }
  applyFight(f,winner,method,end,log);
}
function applyFight(f,winner,method,end,log){
  const oldRank=G.rank;
  G.money+=f.purse;
  G.fatigue=clamp(G.fatigue+rnd(18,29),0,100);
  G.health=clamp(G.health-rnd(5,14)-(winner==="opp"?rnd(3,8):0),0,100);
  G.readiness=clamp(G.readiness-rnd(18,28),0,100);
  G.weightRisk=clamp(G.weightRisk-rnd(5,15),0,100);
  const title=TITLE_DEFS.find(x=>x.id===f.title);

  if(winner==="me"){
    G.record.w++;if(["KO","TKO"].includes(method))G.record.ko++;
    const quality=Math.max(.5,f.ovr/Math.max(45,ovr()));
    const jump=Math.round(rnd(50,150)*quality*(1+Math.min(2.2,oldRank/700)));
    G.rank=clamp(G.rank-jump,1,2500);
    G.fame=clamp(G.fame+rnd(3,7)+(method==="KO"?3:0),0,100);
    G.morale=clamp(G.morale+rnd(5,9),0,100);
    G.promoterInterest=clamp(G.promoterInterest+rnd(4,9),0,100);
    trainXP("technique",rnd(3,6));trainXP("stamina",rnd(2,5));
    addLog(`擊敗 ${f.name}（${method}${["KO","TKO"].includes(method)?" R"+end:""}），世界排名 #${oldRank} → #${G.rank}。`,"good");
    if(title&&!G.titles.includes(title.id)){G.titles.push(title.id);G.fame=clamp(G.fame+10,0,100);addLog(`🏆 贏得 ${title.zh}！`,"titlelog")}
    log.push(`\n✅ ${G.name} wins by ${method}${["KO","TKO"].includes(method)?" R"+end:""}`);
  }else if(winner==="opp"){
    G.record.l++;G.rank=clamp(G.rank+rnd(50,140),1,2500);G.morale=clamp(G.morale-rnd(6,11),0,100);
    addLog(`敗給 ${f.name}（${method}${["KO","TKO"].includes(method)?" R"+end:""}），排名退到 #${G.rank}。`,"bad");
    log.push(`\n❌ ${f.name} wins by ${method}${["KO","TKO"].includes(method)?" R"+end:""}`);
  }else{
    G.record.d++;G.rank=clamp(G.rank+rnd(-15,20),1,2500);addLog(`與 ${f.name} 戰成平手。`,"");
    log.push("\n➖ Draw");
  }
  log.push(`Ranking: #${oldRank} → #${G.rank}`);
  log.push(`Purse: ${money(f.purse)}`);

  advanceWeek(rnd(4,7));
  delete G.pendingFight;
  generateOffers();
  G.currentEvent=pickEvent();
  save(false);
  document.querySelector("#fightModalTitle").textContent=`${G.name} vs ${f.name}`;
  document.querySelector("#fightLog").textContent=log.join("\n");
  document.querySelector("#fightModal").classList.remove("hidden");
  render();
}
function closeFightModal(){document.querySelector("#fightModal").classList.add("hidden")}

function save(show=true){if(G)localStorage.setItem(SAVE_KEY,JSON.stringify(G));if(show&&G){addLog("生涯已儲存。","good");render()}}
function loadGame(){
  const r=localStorage.getItem(SAVE_KEY);if(!r)return;
  G=JSON.parse(r);setSeed(G.seed||"boxing");
  if(!G.currentEvent)G.currentEvent=pickEvent();
  if(!G.offers||!G.offers.length)generateOffers();
  render();
}
function resetGame(){
  if(confirm("確定要結束這次人生並重新建立拳手嗎？")){localStorage.removeItem(SAVE_KEY);G=null;render()}
}

function startScreen(){
  return `<div class="hero">
    <div class="eyebrow">BOXING LIFE · USA</div>
    <h1>拳擊<br>人生</h1>
    <p>從美國職業拳壇 0-0 開始。你的選擇、骰子、傷病、比賽與機會，會決定最後能走多遠。</p>
  </div>
  <div class="wrap">
    <div class="panel">
      <div class="label">Create Fighter</div>
      <div class="field"><label>拳手姓名</label><input id="nm" value="River Lee"></div>
      <div class="field"><label>性別</label><div class="chips">
        <button class="chip gender on" data-v="male" onclick="chipOne('gender',this)">♂ 男子</button>
        <button class="chip gender" data-v="female" onclick="chipOne('gender',this)">♀ 女子</button>
      </div></div>
      <div class="field"><label>職業出道年齡</label><select id="age">${Array.from({length:13},(_,i)=>`<option ${i===2?"selected":""}>${18+i}</option>`).join("")}</select></div>
      <div class="field"><label>量級</label><select id="weight">${WEIGHTS.map(x=>`<option ${x==="Lightweight"?"selected":""}>${x}</option>`).join("")}</select></div>
      <div class="field"><label>拳風</label><div class="chips">
        ${Object.entries(STYLES).map(([k,s],i)=>`<button class="chip style ${i===0?"on":""}" data-v="${k}" onclick="chipOne('style',this)">${s.zh}</button>`).join("")}
      </div></div>

      <div class="field">
        <div class="alloc-head">
          <label style="margin:0">自由能力點數</label>
          <span id="pointsLeft" class="points-left">剩餘 ${START_POINTS} 點</span>
        </div>
        <div class="note" style="margin-bottom:8px">總共只有 ${START_POINTS} 點，單一能力最多 +3。拳風加成會另外計算。</div>
        <div class="alloc-grid">
          ${SKILLS.map(k=>`<div class="alloc">
            <div class="top"><span class="name">${SKILL_NAMES[k]}</span><span id="alloc-${k}" class="value">+0</span></div>
            <div class="ctrl">
              <button onclick="changeAlloc('${k}',-1)">−</button>
              <button onclick="changeAlloc('${k}',1)">＋</button>
            </div>
          </div>`).join("")}
        </div>
      </div>

      <div class="field"><label>美國訓練基地</label><select id="city">${CITIES.map(x=>`<option>${x}</option>`).join("")}</select></div>
      <div class="field"><label>種子碼（同一種子可重玩相同隨機序列）</label><input id="seed" value="${makeSeed()}"></div>
      <button class="btn" style="margin-top:16px" onclick="createGame()">開始美國職業生涯 🥊</button>
    </div>
    ${localStorage.getItem(SAVE_KEY)?`<button class="btn ghost" onclick="loadGame()">讀取上次生涯</button>`:""}
    <p class="note" style="text-align:center;margin:14px">單檔 HTML / CSS / JavaScript，可直接放 GitHub Pages。</p>
  </div>`;
}

function resetAlloc(){
  alloc={power:0,speed:0,stamina:0,defense:0,chin:0,technique:0};
}
function allocUsed(){return SKILLS.reduce((s,k)=>s+(alloc[k]||0),0)}
function changeAlloc(skill,delta){
  const used=allocUsed();
  if(delta>0){
    if(used>=START_POINTS)return;
    if((alloc[skill]||0)>=3)return;
    alloc[skill]=(alloc[skill]||0)+1;
  }else{
    if((alloc[skill]||0)<=0)return;
    alloc[skill]-=1;
  }
  updateAllocUI();
}
function updateAllocUI(){
  SKILLS.forEach(k=>{
    const el=document.querySelector("#alloc-"+k);
    if(el)el.textContent="+"+(alloc[k]||0);
  });
  const left=document.querySelector("#pointsLeft");
  if(left)left.textContent=`剩餘 ${START_POINTS-allocUsed()} 點`;
}

function chipOne(cls,el){
  document.querySelectorAll("."+cls).forEach(x=>x.classList.remove("on"));el.classList.add("on");
}

function render(){
  const app=document.querySelector("#app");
  if(!G){
    resetAlloc();
    app.innerHTML=startScreen();
    updateAllocUI();
    return;
  }
  const genderIcon=G.gender==="female"?"♀":"♂";
  app.innerHTML=`
    <div class="hud">
      <div class="hud-top">
        <div class="avatar">${genderIcon}</div>
        <div class="hud-name"><b>${esc(G.name)}</b><span>${G.weight} · ${STYLES[G.style].zh} · ${G.baseCity}</span></div>
        <div class="ovr"><b>${ovr()}</b><span>OVR</span></div>
      </div>
      <div class="hud-stats">
        <div class="hs"><b>${G.record.w}-${G.record.l}-${G.record.d}</b><span>RECORD</span></div>
        <div class="hs"><b>${G.record.ko}</b><span>KO</span></div>
        <div class="hs"><b>#${G.rank}</b><span>RANK</span></div>
        <div class="hs"><b>${G.age}</b><span>AGE</span></div>
        <div class="hs"><b>${money(G.money)}</b><span>MONEY</span></div>
      </div>
    </div>
    <div class="wrap">
      ${G.retired?renderEnd():`
        <div id="eventBox" class="panel ${isSpecialEvent(G.currentEvent)?"special-panel":""}">${eventHTML()}</div>
        <div class="panel">
          <div class="label">Attributes</div>
          <div class="attrs">${SKILLS.map(k=>attrHTML(k)).join("")}</div>
          <div class="note" style="margin-top:10px">高能力值成長會越來越慢；每項能力都有隱藏天賦上限，超過天賦後仍能成長，但效率會大幅下降。</div>
        </div>
        <div class="panel">
          <div class="season"><b>FIGHT OFFERS</b><span>美國職業拳壇</span></div>
          ${offersHTML()}
        </div>
        <div class="panel">
          <div class="label">Titles</div>
          <div class="badges" style="margin-top:8px">${G.titles.length?G.titles.map(id=>{const t=TITLE_DEFS.find(x=>x.id===id);return `<span class="badge">🏆 ${t.zh}</span>`}).join(""):`<span class="note">尚未取得冠軍</span>`}</div>
        </div>
        <div class="panel">
          <div class="label">Career Log</div>
          <div class="timeline">${G.logs.map(l=>`<div class="log ${l.type}"><span class="when">${l.when}</span>${esc(l.text)}</div>`).join("")}</div>
        </div>
      `}
    </div>
    <div class="actionbar"><div class="inner">
      <button class="btn ghost" onclick="save()">儲存</button>
      <button class="btn ghost" onclick="resetGame()">重開</button>
    </div></div>`;
}
function eventHTML(){
  if(G.lastOutcome)return "";
  const e=G.currentEvent||pickEvent();
  return `${isSpecialEvent(e)?`<div class="special-tag">★ SPECIAL EVENT</div>`:""}
    <div class="season" style="margin-top:${isSpecialEvent(e)?"9px":"0"}"><b>${e.cat}</b><span>${G.year} · Week ${G.week}</span></div>
    <div class="title">${e.title}</div>
    ${eventImageHTML(e)}
    <div class="text">${e.text}</div>
    <div class="opts">${e.options.map((o,i)=>`<button class="opt" onclick="chooseEvent(${i})">
      <div class="ico">${o.ico}</div><div class="ot"><b>${o.label}</b><span>${o.hint}</span></div></button>`).join("")}</div>`;
}
function attrHTML(k){
  const v=G.stats[k],need=xpNeed(v),x=G.xp[k]||0;
  return `<div class="attr"><div class="r"><span>${SKILL_NAMES[k]}</span><b>${v}</b></div>
    <div class="bar"><i style="width:${v}%"></i></div><div class="xp">${Math.floor(x)}/${Math.ceil(need)} XP</div></div>`;
}
function offersHTML(){
  if(!G.offers.length)generateOffers();
  return G.offers.map(f=>{
    const t=TITLE_DEFS.find(x=>x.id===f.title);
    return `<div class="offer ${t?"titlefight":""}">
      <div class="offer-h"><b>${f.name}</b><span>${t?"🏆 "+t.zh:"WORLD #"+f.rank}</span></div>
      <div class="offer-meta">${f.record} · OVR ${f.ovr}<br>${f.city} · ${f.rounds} 回合 · ${money(f.purse)}</div>
      <div class="offer-actions"><button class="btn small" onclick="acceptFight('${f.id}')">接下比賽</button></div>
    </div>`;
  }).join("");
}
function renderEnd(){
  return `<div class="hero" style="padding:30px 10px 12px">
    <div class="eyebrow">CAREER OVER</div><h1 style="font-size:38px">生涯落幕</h1></div>
    <div class="panel" style="text-align:center">
      <div style="font-size:28px;font-weight:900">${esc(G.name)}</div>
      <div class="text">${G.gender==="female"?"女子":"男子"} ${G.weight}<br>
      最終戰績 ${G.record.w}-${G.record.l}-${G.record.d} (${G.record.ko}KO) · 世界 #${G.rank}</div>
      <div class="badges" style="justify-content:center;margin-top:10px">${G.titles.map(id=>`<span class="badge">🏆 ${TITLE_DEFS.find(x=>x.id===id).zh}</span>`).join("")}</div>
    </div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

window.addEventListener("load",()=>{
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){
    try{G=JSON.parse(raw);setSeed(G.seed||"boxing");if(!G.currentEvent)G.currentEvent=pickEvent();if(!G.offers?.length)generateOffers()}catch(e){G=null}
  }
  render();
});
</script>
</body>
