<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Boxing Life V44 · 多結局稱號與生涯卡版</title>
<style>
:root{
  --bg:#061911; --bg2:#09251b; --panel:#0f3427; --panel2:#153d2f;
  --line:#315d4b; --line2:#436d5a; --ink:#eef0e5; --dim:#b9c8bf;
  --faint:#81998d; --gold:#f1c553; --good:#78dc91; --bad:#ff766d; --blue:#8fd0eb;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
body{font-size:16px;overflow:hidden;background:linear-gradient(135deg,rgba(65,103,79,.08) 0 1px,transparent 1px 24px),linear-gradient(180deg,#09261b,#051710)}
button,input,select{font:inherit}
button{cursor:pointer}
#app{height:100vh}
.shell{height:100vh;max-width:1600px;margin:auto;display:grid;grid-template-columns:275px minmax(620px,1fr) 430px;border-left:1px solid #234b3b;border-right:1px solid #234b3b}
.left{background:linear-gradient(180deg,#0b2b20,#08241a);border-right:1px solid #264c3d;padding:18px 18px 14px;display:flex;flex-direction:column;overflow-y:auto}
.brand{font-size:42px;font-weight:1000;letter-spacing:-2px;line-height:1;text-align:center}
.brand em{font-style:normal;color:var(--gold)}
.brandSub{margin:9px 0 15px;padding-bottom:13px;border-bottom:1px solid #2b5142;text-align:center;color:#7d9689;font-size:11px;letter-spacing:.24em}
.school{font-size:14px;font-weight:900;color:#dbe1da}
.school small{display:block;color:#859d90;font-size:12px;margin-top:5px}
.timeline{position:relative;margin:16px 0 6px;padding-left:28px}
.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:8px;width:1px;background:#527160}
.node{position:relative;padding-bottom:14px}
.node:before{content:"";position:absolute;left:-28px;top:2px;width:15px;height:15px;border-radius:50%;background:#0a291e;border:2px solid #567466}
.node.done:before{background:#315c49;border-color:#638271}
.node.on:before{border-color:var(--gold);background:#0a291e;box-shadow:0 0 10px rgba(241,197,83,.55)}
.node b{display:block;font-size:14px}.node span{display:block;color:#80978b;font-size:11px;margin-top:4px;line-height:1.4}
.node.on b{color:var(--gold)}
.menu{margin-top:8px;display:grid;gap:3px}
.menu div{padding:9px 10px;border-radius:7px;color:#b9c9c0;font-size:13px;font-weight:850}
.menu div.active{background:#173b2e;color:var(--gold)}
.version{margin-top:12px;padding-top:12px;border-top:1px solid #2b5142;font-size:10px;color:#789184;line-height:1.7}
.version b{color:var(--gold)}

.center{background:#04140e;border-right:1px solid #264c3d;min-width:0;overflow-y:auto}
.header{position:sticky;top:0;z-index:5;background:rgba(12,45,33,.97);border-bottom:1px solid #2b5544;padding:12px 24px 11px;backdrop-filter:blur(8px)}
.profile{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.no{height:52px;border:1px solid #907929;border-radius:10px;text-align:center;display:grid;place-items:center;color:var(--gold);font-size:26px;font-weight:1000;background:#1a3726}
.name b{font-size:24px;display:block}.tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid #567363;border-radius:5px;padding:3px 7px;color:#d3ddd6}.tag.gold{color:var(--gold);border-color:#877229}
.affil{text-align:right;color:#81998c;font-size:11px}.affil b{display:block;color:var(--gold);font-size:15px;margin-top:3px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.metric{background:#153c2e;border:1px solid #2d5948;border-radius:9px;padding:7px;text-align:center}
.metric b{display:block;font-size:19px;color:var(--gold)}.metric span{display:block;font-size:10px;color:#839c8f;margin-top:3px}
.content{padding:18px 24px 38px}
.date{text-align:center;color:#819a8d;font-size:12px;letter-spacing:.22em;margin:4px 0 15px}
.card{background:linear-gradient(180deg,#103529,#0d3024);border:1px solid #315b49;border-radius:12px;padding:15px 17px;margin-bottom:14px}
.card.major{border-color:#8b742b;box-shadow:0 0 0 1px rgba(241,197,83,.08) inset}
.kicker{font-size:11px;letter-spacing:.11em;color:#9ab2a5;font-weight:900;margin-bottom:8px}.kicker.gold{color:var(--gold)}
.card h2{margin:0 0 8px;font-size:24px}.card h3{margin:0 0 7px;font-size:19px}.card p{margin:0;color:#d1dbd4;line-height:1.72;font-size:15px}
.progressBox{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.progressText{font-size:13px;color:#9fb2a7}.progressText b{color:var(--gold)}
.turnDots{display:flex;gap:6px}.turnDots i{display:block;width:12px;height:12px;border-radius:50%;background:#244739;border:1px solid #456b59}.turnDots i.done{background:var(--gold);border-color:var(--gold)}
.log{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}.log:last-child{border-bottom:0}.log small{display:block;color:#66877a;font-size:10px;margin-bottom:4px}.log div{font-size:13px;color:#cbd7d0;line-height:1.55}
.deltaWrap{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.delta{font-size:12px;font-weight:900;border:1px solid #456858;border-radius:99px;padding:5px 8px;background:#16392c}.delta.good{color:var(--good);border-color:#32744a}.delta.bad{color:var(--bad);border-color:#80433e}.delta.point{color:var(--gold);border-color:#89732c}

.right{background:linear-gradient(180deg,#0b2a20,#082219);padding:16px;overflow-y:auto}
.rightTitle{font-size:12px;letter-spacing:.1em;color:#8fa89a;font-weight:900;margin:2px 0 9px}
.rhythm{border:1px solid #315a49;background:#103429;border-radius:11px;padding:11px;margin-bottom:10px}
.rhythmRow{display:flex;gap:8px;align-items:center;font-size:12px;color:#c6d2cb;margin:5px 0}.rhythmRow i{width:8px;height:8px;border-radius:50%;background:#456858}.rhythmRow.on i{background:var(--gold);box-shadow:0 0 7px rgba(241,197,83,.5)}
.pointsBox{border:1px solid #806d2b;background:linear-gradient(180deg,#203e2d,#17382a);border-radius:12px;padding:12px;margin-bottom:10px}
.pointsHead{display:flex;justify-content:space-between;align-items:center}.pointsHead span{font-size:13px;color:#dce2dc;font-weight:900}.pointsHead b{font-size:24px;color:var(--gold)}
.attr{background:#12382b;border:1px solid #315949;border-radius:9px;padding:9px 10px;margin-bottom:7px}
.attrTop{display:grid;grid-template-columns:66px 1fr 56px 31px;gap:8px;align-items:center}
.attrName{font-size:13px;font-weight:900}.attrBar{height:8px;background:#061710;border-radius:99px;overflow:hidden}.attrBar i{display:block;height:100%;background:linear-gradient(90deg,#6dd78c,#efc652);border-radius:99px}
.attrValue{text-align:right;font-size:12px;font-weight:900}.attrValue span{color:#779084;font-weight:700}
.plus{width:31px;height:31px;border-radius:7px;border:1px solid #806d2b;background:#284933;color:var(--gold);font-size:18px;font-weight:1000}.plus:disabled{opacity:.3;cursor:not-allowed}
.cost{text-align:right;margin-top:4px;color:#80998d;font-size:9px}
.sidePanel{border:1px solid #315a49;background:#103429;border-radius:11px;padding:12px;margin-bottom:10px}
.choiceTitle{font-size:14px;color:#dfe4de;font-weight:900;margin-bottom:9px}
.choice{width:100%;text-align:left;border:1px solid #466958;background:#153b2d;color:#eef0e6;border-radius:10px;padding:11px;margin-bottom:8px}.choice:last-child{margin-bottom:0}.choice b{display:block;font-size:16px}.choice span{display:block;font-size:12px;color:#c4d0c9;margin-top:4px}.choice em{display:block;font-size:10px;color:#86a092;font-style:normal;margin-top:5px}.choice:hover{border-color:#8a742b}
.die{width:58px;height:58px;margin:7px auto 10px;border:2px solid #c3b99f;border-radius:13px;background:#eee7d8;color:#294035;display:grid;place-items:center;font-size:30px;font-weight:1000}
.resultText{font-size:13px;line-height:1.65;color:#d2ddd6}
.action{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(180deg,transparent,#082219 24%)}
.action button{width:100%;border:1px solid #6d6030;background:linear-gradient(180deg,#36583e,#294a34);color:#f0f2e8;border-radius:11px;padding:13px;font-size:17px;font-weight:1000}.action button small{display:block;font-size:11px;color:#b9c7bf;margin-top:4px}

.start{height:100vh;overflow:auto;max-width:1000px;margin:auto;padding:34px 20px}
.start h1{text-align:center;font-size:52px;margin:0;letter-spacing:-2px}.start h1 em{color:var(--gold);font-style:normal}
.startIntro{text-align:center;max-width:760px;margin:12px auto 22px;color:#c6d3cb;line-height:1.8;font-size:16px}
.startGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid #315a49;background:#103429;border-radius:13px;padding:16px}.panel label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.panel input,.panel select{width:100%;padding:11px;border-radius:8px;border:1px solid #436857;background:#071d15;color:#eef0e5}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.startBtn{width:100%;margin-top:14px;padding:14px;border-radius:11px;border:1px solid #846f29;background:#2b4d35;color:#f2ce64;font-size:18px;font-weight:1000}
@media(max-width:1280px){.shell{grid-template-columns:245px minmax(520px,1fr) 390px}.brand{font-size:36px}.content{padding-left:18px;padding-right:18px}}
@media(max-width:980px){body{overflow:auto}#app{height:auto}.shell{height:auto;display:block}.left{display:none}.center,.right{overflow:visible}.header{position:static}.startGrid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}}
</style>

<style id="v26-career-css">
.careerBtn{cursor:pointer}
.careerBtn:hover{background:#1b4434!important;color:var(--gold)!important}
.careerModal{
  position:fixed;inset:0;z-index:100;background:rgba(1,9,6,.88);
  display:flex;align-items:center;justify-content:center;padding:22px
}
.careerModal.hidden{display:none}
.careerSheet{
  width:min(980px,96vw);max-height:92vh;overflow:auto;
  background:linear-gradient(180deg,#0d3024,#071e16);
  border:1px solid #4b745f;border-radius:16px;padding:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.45)
}
.careerTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.careerTop h2{margin:0;font-size:27px}
.careerTop p{margin:5px 0 0;color:#90a69a;font-size:12px}
.closeX{border:1px solid #496b5a;background:#12382b;color:#e1e7e1;border-radius:9px;padding:8px 12px;font-weight:900}
.careerSummary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.careerMetric{background:#143a2d;border:1px solid #315949;border-radius:10px;text-align:center;padding:10px}
.careerMetric b{display:block;color:var(--gold);font-size:21px}.careerMetric span{display:block;color:#839b8f;font-size:10px;margin-top:4px}
.historyList{display:grid;gap:8px}
.historyItem{display:grid;grid-template-columns:95px 1fr;gap:10px;background:#103429;border:1px solid #2e5848;border-radius:10px;padding:10px}
.historyWhen{font-size:10px;color:#80998c;line-height:1.6}
.historyWhen b{display:block;color:var(--gold);font-size:12px}
.historyText{font-size:13px;line-height:1.65;color:#d5ddd7}
.historyText strong{display:block;color:#edf0e6;font-size:14px;margin-bottom:2px}
.shareArea{margin-top:14px;padding-top:14px;border-top:1px solid #315547}
.shareButtons{display:flex;gap:8px;flex-wrap:wrap}
.shareButtons button{border:1px solid #7d6a2a;background:#264933;color:#f0cc5e;border-radius:9px;padding:10px 13px;font-weight:900}
.retireCard{border-color:#91792a!important}
.retireBtn{
  width:100%;border:1px solid #8c7429;background:linear-gradient(180deg,#3e5839,#2b4431);
  color:#f2d168;border-radius:11px;padding:13px;font-size:16px;font-weight:1000;margin-top:10px
}
.sharePreview{
  margin-top:12px;background:#081d15;border:1px solid #315747;border-radius:11px;padding:10px;
  text-align:center
}
.sharePreview canvas{max-width:100%;height:auto;border-radius:8px}
.endHero{background:linear-gradient(180deg,#183d2e,#102c22);border:1px solid #8a742a;border-radius:14px;padding:18px;margin-bottom:14px}
.endHero h2{margin:0;color:#f0cf61;font-size:28px}.endHero p{color:#cbd7cf;line-height:1.7}
@media(max-width:760px){
  .careerSummary{grid-template-columns:repeat(2,1fr)}
  .historyItem{grid-template-columns:1fr}.careerModal{padding:8px}.careerSheet{padding:12px}
}
</style>


<style id="v27-story-css">
.storyProse{line-height:1.95;color:#d4ddd7;font-size:16px}
.storyProse .yearTag{display:inline-block;margin:8px 0 14px;padding:4px 10px;border:1px solid #6f5c25;border-radius:999px;color:#f0cc63;background:#201b0b;font-size:12px;font-weight:900}
.storyProse .bigLead{font-size:22px;font-weight:900;color:#f2efe2;margin:8px 0 12px}
.storyProse strong{color:#f0cc63}
.storyHint{margin-top:12px;padding:10px 12px;border-left:3px solid #f0cc63;background:#0d261d;border-radius:8px;color:#b8c4bd;font-size:13px}
.dieLabel{font-size:11px;letter-spacing:2px;color:#f0cc63;text-align:center;margin-bottom:8px}
.dieNote{font-size:12px;color:#a7b3ad;text-align:center;line-height:1.7;margin-top:10px}
.rollExplain{margin-top:12px;padding:12px;border:1px solid #315849;border-radius:10px;background:#102d22;color:#d2dcd5;line-height:1.8}
.choiceGuide{margin-top:8px;font-size:12px;color:#90a69a;line-height:1.7}
.prologueMark{display:inline-block;margin-left:8px;font-size:12px;color:#f0cc63}
</style>

<style id="v29-character-career-css">
/* ===== 主角像素角色 ===== */
.profile{grid-template-columns:72px 1fr auto!important}
.no{display:none!important}
.fighterAvatar{
  width:68px;height:68px;border-radius:13px;
  border:1px solid #8a742a;
  background:radial-gradient(circle at 50% 38%,#214b38,#09251b 72%);
  overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
  box-shadow:0 0 13px rgba(241,197,83,.08),0 0 0 1px rgba(255,255,255,.02) inset
}
.fighterAvatar img{
  width:96%;height:96%;object-fit:contain;object-position:center bottom;
  image-rendering:pixelated;filter:drop-shadow(0 5px 5px rgba(0,0,0,.38))
}
.startCharacter{
  display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center;
  max-width:900px;margin:0 auto 20px;padding:16px 18px;
  border:1px solid #315a49;border-radius:16px;
  background:linear-gradient(180deg,#11372a,#0d2d22)
}
.startCharacterArt{
  height:235px;border-radius:14px;border:1px solid #806c2b;
  background:radial-gradient(circle at 50% 38%,#214d39,#09261b 72%);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden
}
.startCharacterArt img{
  max-width:96%;max-height:97%;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 8px 7px rgba(0,0,0,.38))
}
.startCharacterText h2{margin:0 0 8px;font-size:27px;color:#f1c553}
.startCharacterText p{margin:0;color:#c7d3cc;line-height:1.8;font-size:15px}
.characterBadge{
  display:inline-block;margin-top:11px;padding:5px 10px;
  border:1px solid #826d2a;border-radius:999px;color:#f1c553;
  background:#1d3827;font-size:11px;font-weight:900
}

/* ===== 生涯路線圖 ===== */
.careerMap{
  margin:0 0 15px;padding:14px 14px 12px;
  border:1px solid #315b49;border-radius:13px;
  background:linear-gradient(180deg,#0f3428,#0b2a20);
  overflow:hidden
}
.careerMapHead{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:11px
}
.careerMapHead b{font-size:12px;letter-spacing:.12em;color:#9eb4a8}
.careerMapHead span{font-size:11px;color:#f1c553;font-weight:900}
.careerTrack{
  display:grid;grid-template-columns:repeat(7,minmax(82px,1fr));
  position:relative;gap:2px
}
.careerTrack:before{
  content:"";position:absolute;left:6%;right:6%;top:34px;height:3px;
  background:#294c3e;border-radius:99px;z-index:0
}
.careerTrackFill{
  position:absolute;left:6%;top:34px;height:3px;border-radius:99px;
  background:linear-gradient(90deg,#5fd284,#f1c553);
  z-index:1;transition:width .3s ease
}
.careerNode{
  position:relative;z-index:2;text-align:center;min-width:0
}
.careerCircle{
  width:68px;height:68px;margin:0 auto 7px;border-radius:50%;
  border:2px solid #3b6051;background:#0b241a;
  display:flex;align-items:center;justify-content:center;
  color:#718b7d;box-shadow:0 0 0 4px #0d2e23;
  transition:.2s
}
.careerCircle svg{width:33px;height:33px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.careerNode.done .careerCircle{
  border-color:#67cf83;color:#9be0ac;background:#163a29
}
.careerNode.current .careerCircle{
  border-color:#f1c553;color:#f1c553;background:#273b24;
  box-shadow:0 0 0 4px #0d2e23,0 0 18px rgba(241,197,83,.42)
}
.careerNode.locked .careerCircle{filter:saturate(.6);opacity:.65}
.careerNode .careerTitle{
  font-size:11px;font-weight:900;color:#bccbc3;white-space:nowrap
}
.careerNode.current .careerTitle{color:#f1c553}
.careerNode .careerSub{
  margin-top:2px;font-size:9px;color:#6f8d7e;line-height:1.35
}
.careerMiniPortrait{
  width:38px;height:47px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))
}

/* career record portrait */
.careerPortrait{
  float:right;width:105px;height:128px;margin:0 0 8px 14px;
  border:1px solid #776529;border-radius:10px;
  background:radial-gradient(circle,#1c4635,#082118);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden
}
.careerPortrait img{width:96%;height:96%;object-fit:contain;image-rendering:pixelated}

@media(max-width:1180px){
  .careerTrack{grid-template-columns:repeat(7,100px);overflow-x:auto;padding-bottom:8px}
  .careerMap{overflow-x:auto}
}
@media(max-width:760px){
  .startCharacter{grid-template-columns:1fr}
  .startCharacterArt{height:215px}
  .profile{grid-template-columns:62px 1fr!important}
  .affil{display:none}
  .fighterAvatar{width:60px;height:60px}
  .careerTrack{grid-template-columns:repeat(7,92px)}
  .careerCircle{width:60px;height:60px}
}
</style>


<style id="v30-country-portrait-css">
.countryPortraits{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 18px
}
.countryPortrait{
  position:relative;border:2px solid #315a49;border-radius:14px;overflow:hidden;
  background:#efe9dc;cursor:pointer;transition:.18s ease
}
.countryPortrait:hover{transform:translateY(-2px);border-color:#786a31}
.countryPortrait.selected{
  border-color:#f1c553;box-shadow:0 0 0 3px rgba(241,197,83,.1),0 0 18px rgba(241,197,83,.22)
}
.countryPortrait img{
  width:100%;aspect-ratio:1/1;display:block;object-fit:cover;image-rendering:pixelated
}
.countryPortraitInfo{
  background:linear-gradient(180deg,#12382b,#0b291f);padding:10px;text-align:center
}
.countryPortraitInfo b{display:block;color:#f0f2e8;font-size:15px}
.countryPortraitInfo span{display:block;color:#8ca497;font-size:11px;margin-top:3px}
.countryPortrait.selected .countryPortraitInfo b{color:#f1c553}
.countryCheck{
  position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;
  background:#0d2b20;border:1px solid #4e6d5d;color:#6e8b7b;
  display:grid;place-items:center;font-size:15px;font-weight:1000
}
.countryPortrait.selected .countryCheck{
  color:#17331f;background:#f1c553;border-color:#f1c553
}
.startCharacter{display:none!important}
.fighterAvatar{
  background:#efe9dc!important;
}
.fighterAvatar img{
  width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;
}
.careerMiniPortrait{
  width:54px!important;height:54px!important;object-fit:cover!important;border-radius:50%;
}
.careerPortrait{
  background:#efe9dc!important
}
.careerPortrait img{width:100%!important;height:100%!important;object-fit:cover!important}
@media(max-width:760px){
  .countryPortraits{grid-template-columns:1fr}
  .countryPortrait{display:grid;grid-template-columns:130px 1fr}
  .countryPortrait img{height:130px;aspect-ratio:auto}
  .countryPortraitInfo{display:flex;flex-direction:column;justify-content:center}
}
</style>


<style id="v31-intro-css">
.lifeIntro{
  margin:16px 0 18px;padding:18px 20px;
  border:1px solid #315b49;border-radius:14px;
  background:linear-gradient(180deg,#12372b,#0d2e23);
  color:#d2ddd6;font-size:15px;line-height:1.95
}
.lifeIntroTitle{
  display:flex;align-items:center;gap:9px;

}

<style id="v35-responsive-css">
/* =========================================================
   V35 RESPONSIVE LAYOUT

   ========================================================= */

:root{
  --v35-side-left:clamp(220px,16vw,285px);
  --v35-side-right:clamp(320px,25vw,420px);
}
html{
  width:100%;
  min-width:0;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  width:100%;
  min-width:0;
  max-width:100%;
  overscroll-behavior-y:none;
}
*,*:before,*:after{box-sizing:border-box}
img,canvas,svg{max-width:100%}
button,input,select{max-width:100%}

/* ---------- Desktop: true 3-column management layout ---------- */
#app{height:100dvh;min-height:100vh}
.shell{
  width:100%;
  max-width:1920px;
  height:100dvh;
  min-height:0;
  grid-template-columns:var(--v35-side-left) minmax(0,1fr) var(--v35-side-right);
}
.left,.center,.right{min-width:0}
.left{padding:clamp(14px,1.2vw,20px)}
.right{padding:clamp(12px,1.1vw,18px)}
.header{padding:12px clamp(16px,1.7vw,28px) 11px}
.content{padding:clamp(14px,1.4vw,22px) clamp(16px,1.8vw,30px) 42px}

.brand{font-size:clamp(34px,2.55vw,46px)}
.name b{font-size:clamp(21px,1.55vw,27px)}
.card h2{font-size:clamp(21px,1.55vw,27px)}
.card h3{font-size:clamp(17px,1.25vw,21px)}
.card p,.storyProse{font-size:clamp(14px,.96vw,16px)}
.metric b{font-size:clamp(17px,1.25vw,21px)}
.choice b{font-size:clamp(15px,1.08vw,17px)}
.choice{min-height:58px}
.action button{min-height:52px}

/* prevent long names / labels from forcing columns wider */
.name,.affil,.metric,.card,.choice,.historyText{min-width:0}
.name b,.affil b,.card h2,.card h3,.choice b{
  overflow-wrap:anywhere;
}
.card p,.resultText,.storyProse,.log div{
  overflow-wrap:anywhere;
  word-break:break-word;
}

/* career track should scroll rather than break page width */
.careerMap{
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.careerTrack{
  min-width:650px;
}
.careerNode{scroll-snap-align:center}
.careerMap{scroll-snap-type:x proximity}

/* start screen */
.start{
  width:min(1100px,100%);
  max-width:1100px;
  min-height:100dvh;
  height:100dvh;
  padding:clamp(24px,3vw,46px) clamp(16px,3vw,32px);
}
.start h1{font-size:clamp(38px,4vw,58px)}
.startIntro{font-size:clamp(14px,1.25vw,17px)}
.lifeIntro{font-size:clamp(14px,1.1vw,16px)}
.lifeIntroTitle{font-size:clamp(17px,1.35vw,20px)}
.countryPortrait img{width:100%;height:auto}

/* modal and share image */
.careerSheet{width:min(980px,96vw)}
.sharePreview canvas,.careerSheet canvas{
  display:block;
  width:min(100%,600px)!important;
  height:auto!important;
  margin-inline:auto;
}

/* compact navigation shown when desktop left rail disappears */
.mobileQuickbar{display:none}

/* ---------- Laptop / smaller desktop ---------- */
@media (max-width:1399px) and (min-width:1101px){
  :root{
    --v35-side-left:clamp(210px,17vw,240px);
    --v35-side-right:clamp(315px,27vw,370px);
  }
  .left{padding:14px}
  .right{padding:13px}
  .content{padding-left:18px;padding-right:18px}
  .brandSub{letter-spacing:.16em}
  .menu div{padding:8px;font-size:12px}
  .node{padding-bottom:11px}
}

/* ---------- Tablet: main game + operation rail ---------- */
@media (max-width:1100px) and (min-width:861px){
  body{overflow:hidden}
  #app,.shell{height:100dvh}
  .shell{
    display:grid!important;
    grid-template-columns:minmax(0,1fr) clamp(300px,34vw,355px)!important;
    grid-template-areas:"center right";
    max-width:none;
  }
  .left{display:none!important}
  .center{
    grid-area:center;
    overflow-y:auto!important;
    border-right:1px solid #264c3d;
  }
  .right{
    grid-area:right;
    overflow-y:auto!important;
  }
  .header{position:sticky!important;top:0}
  .content{padding:16px 18px 34px}
  .profile{grid-template-columns:64px minmax(0,1fr)}
  .affil{display:none}
  .metrics{grid-template-columns:repeat(5,minmax(0,1fr))}
  .metric{padding:6px 4px}
  .metric b{font-size:17px}
  .metric span{font-size:9px}
  .mobileQuickbar{
    display:flex;
    align-items:center;

    border-bottom:1px solid #284f40;
    background:#09281e;

  }
  .mobileQuickbar::-webkit-scrollbar{display:none}
  .mobileQuickbar .mqPhase{
    margin-right:auto;
    min-width:max-content;
    color:#bdcbc3;
    font-size:11px;
    font-weight:850;
  }
  .mobileQuickbar button{
    min-width:max-content;
    min-height:36px;
    border:1px solid #466958;
    border-radius:8px;
    padding:7px 10px;
    background:#12382b;

  }

function countryEventPool(){
  if(!G) return [];
  const g=phaseGroup(), id=phase().id;
  return (COUNTRY_EVENTS[G.country]||[]).filter(e =>
    (Array.isArray(e.phases)&&e.phases.includes(id)) ||
    (Array.isArray(e.tags)&&e.tags.includes(g))
  );
}

let G=null;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>"$"+Math.round(n).toLocaleString();

function getSequence(){
  const branch=G?.lifePath;
  const middle=branch==="college"?COLLEGE_PHASES:branch==="work"?WORK_PHASES:[];
  return [...COMMON_PHASES,...middle,...PRO_PHASES];
}
function phase(){const s=getSequence();return s[Math.min(G.phaseIndex,s.length-1)]}
function phaseGroup(){
  const id=phase().id;
  if(id.startsWith("hs"))return "hs";
  if(id.startsWith("uni"))return "uni";
  if(id.startsWith("work"))return "work";
  return "pro";
}
function ovr(){return Math.round(SKILLS.reduce((s,k)=>s+G.stats[k],0)/SKILLS.length)}
function statCost(k){const v=G.stats[k];return v>=80?3:v>=70?2:1}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(G))}
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"null")}catch{return null}}
function log(t){G.logs.unshift({when:`${G.year}・${phase().name}・回合 ${G.turnInPhase+1}`,text:t});G.logs=G.logs.slice(0,18)}
function apply(k,v){
 if(k in G.stats){G.stats[k]=clamp(G.stats[k]+v,30,95);return `${NAMES[k]} ${v>0?"+":""}${v}`}
 if(k==="health"){G.health=clamp(G.health+v,0,100);return `健康 ${v>0?"+":""}${v}`}
 if(k==="morale"){G.morale=clamp(G.morale+v,0,100);return `士氣 ${v>0?"+":""}${v}`}
 if(k==="fame"){G.fame=Math.max(0,G.fame+v);return `名氣 ${v>0?"+":""}${v}`}
 if(k==="income"){G.income=Math.max(0,G.income+v);return `收入 ${v>0?"+":""}${money(v)}`}
 return "";
}
function spendPoint(k){const c=statCost(k);if(G.skillPoints<c||G.stats[k]>=95)return;G.skillPoints-=c;G.stats[k]++;log(`分配能力點：${NAMES[k]} +1（花費 ${c} 點）。`);save();render()}
function createGame(){
 const country=document.getElementById("country").value;
 G={version:42,name:document.getElementById("name").value.trim()||"李逍遙",style:document.getElementById("style").value,country,base:COUNTRIES[country].base,
    lifePath:null,phaseIndex:0,turnInPhase:0,age:16,year:2026,health:100,morale:72,fame:3,income:0,skillPoints:3,
    stats:{power:rnd(43,49),speed:rnd(43,49),stamina:rnd(43,49),defense:rnd(42,48),chin:rnd(44,50),technique:rnd(43,49)},
    amateur:{w:0,l:0},pro:{w:0,l:0,d:0,ko:0},current:null,result:null,stageStory:false,logs:[],lastEvent:null,usedSpecial:{}};
 log(`高一開始留學，${G.name} 從台灣前往 ${COUNTRIES[country].name}・${G.base}。`);
 save();render();
}
function eventPool(){
 const id=phase().id,g=phaseGroup();
 const specific=(PHASE_EVENTS[id]||[]);
 const general=GENERAL_EVENTS.filter(e=>e.tags.includes(g));
 const local=countryEventPool();
 return [...specific,...general,...local];
}
function forcedSpecial(){
 const id=phase().id;
 const phaseSpecials=(PHASE_EVENTS[id]||[]).filter(e=>e.special&&!G.usedSpecial[e.id]);
 const localSpecials=countryEventPool().filter(e=>e.special&&!G.usedSpecial[e.id]);
 const specials=[...phaseSpecials,...localSpecials];
 if(!specials.length)return null;
 // 第 2、4 回合優先觸發特殊劇情，國家文化特殊事件也會加入候選。
 if(G.turnInPhase===1 || G.turnInPhase===3) return pick(specials);
 return null;
}
function drawEvent(){
 if(G.current||G.result)return;
 if(!Array.isArray(G.recentEvents))G.recentEvents=[];
 if(G.stageStory){G.current=buildStageStory();save();render();return;}
 const special=forcedSpecial();
 let ev;
 if(special){
   ev=special;
   G.usedSpecial[ev.id]=true;
 }else{
   const recent=new Set(G.recentEvents.slice(-4));
   let local=countryEventPool().filter(e=>!e.special&&!recent.has(e.id));
   if(!local.length)local=countryEventPool().filter(e=>!e.special&&e.id!==G.lastEvent);

   const id=phase().id,g=phaseGroup();
   let normal=[
     ...(PHASE_EVENTS[id]||[]).filter(e=>!e.special),
     ...GENERAL_EVENTS.filter(e=>e.tags.includes(g))
   ].filter(e=>!recent.has(e.id));
   if(!normal.length){
     normal=[
       ...(PHASE_EVENTS[id]||[]).filter(e=>!e.special),
       ...GENERAL_EVENTS.filter(e=>e.tags.includes(g))
     ].filter(e=>e.id!==G.lastEvent);
   }

   // 約 55% 的一般回合優先抽到旅外國家的在地文化事件。
   if(local.length && Math.random()<0.55) ev=pick(local);
   else ev=pick(normal.length?normal:(local.length?local:eventPool().filter(e=>!e.special)));
 }
 G.current=JSON.parse(JSON.stringify(ev));
 G.lastEvent=ev.id;
 G.recentEvents.push(ev.id);
 G.recentEvents=G.recentEvents.slice(-6);
 save();render();
}
function buildStageStory(){
 const p=phase();
 if(p.id==="hs1")return storyFight("年度劇情｜海外新人盃","第一個留學學年結束。你會升上高二，這場新人盃決定的是信心與能力點，不是升級門檻.",false);
 if(p.id==="hs2")return storyFight("年度劇情｜青年錦標賽","高二結束前，你迎來更正式的青年錦標賽。無論輸贏都會進高三。",false);
 if(p.id==="hs3")return {story:true,cat:"重大劇情｜高中畢業",title:"高中畢業：大學還是工作？",desc:"三年海外高中生活結束。你不打算放棄拳擊，但生活方式必須選一條：進大學邊讀邊練，或先工作邊賺錢邊練。",choices:[
   {label:"進大學邊讀邊練",sub:"接下來四年會有同學、室友、課業、實習與畢業事件",rate:"進入大學人生線",special:"choose_college"},
   {label:"先工作邊練",sub:"接下來會遇到主管、同事、加班、收入與升職事件",rate:"進入工作人生線",special:"choose_work"}
 ]};
 if(p.id==="uni4")return {story:true,cat:"重大劇情｜大學畢業",title:"大學畢業：拳擊終於要變成主業",desc:"四年大學生活結束。你拿到學位，也累積了足夠的拳擊經驗。下一階段將正式進入職業拳擊。",choices:[
   {label:"畢業後全職打拳",sub:"把時間全部投入職業拳擊",rate:"名氣與能力點加成",special:"college_grad_full"},
   {label:"先找兼職再轉職業",sub:"保留一些收入安全感",rate:"收入較穩，但仍會進職業階段",special:"college_grad_part"}
 ]};
 if(p.id==="work4")return {story:true,cat:"重大劇情｜職涯分岔",title:"工作第四年：還要一直兼顧下去嗎？",desc:"你已經證明自己能一邊上班一邊打拳，但更高層級的職業賽不可能永遠這樣準備。",choices:[
   {label:"辭職，全職拳擊",sub:"正式把拳擊放到第一順位",rate:"能力點與士氣加成",special:"work_full"},
   {label:"繼續工作，但減少工時",sub:"保留收入，再進職業賽程",rate:"收入較穩",special:"work_part"}
 ]};
 return storyFight(`年度劇情｜${p.story}`,`${p.name}走到尾聲。這個階段會用一場代表性比賽做結尾；無論輸贏，人生都會進下一階段。`,!p.id.startsWith("hs"));
}
function storyFight(cat,desc,pro){return {story:true,cat,title:phase().story,desc,choices:[
 {label:"全力搶勝",sub:"高風險、高回報",rate:"35%｜勝利時能力點較多",mode:"risk",fight:true,pro},
 {label:"照策略打",sub:"穩定執行教練計畫",rate:"50%｜標準",mode:"normal",fight:true,pro},
 {label:"保守累積經驗",sub:"降低失誤",rate:"70%｜低波動",mode:"safe",fight:true,pro}
]}}
function tierFor(mode,roll){if(mode==="risk")return roll>=5?"good":roll<=2?"bad":"mid";if(mode==="safe")return roll>=4?"good":roll===1?"bad":"mid";return roll>=5?"good":roll<=2?"bad":"mid"}
function choose(i){
 const ev=G.current,ch=ev?.choices[i];if(!ev||!ch)return;const roll=rnd(1,6);
 if(ch.special)resolveSpecial(ev,ch,roll); else if(ch.fight)resolveFight(ev,ch,roll); else resolveEvent(ev,ch,roll);
 G.current=null;save();render();
}
function resolveEvent(ev,ch,roll){
 const tier=tierFor(ch.mode,roll),effects=tier==="good"?(ch.good||[]):tier==="bad"?(ch.bad||[]):ch.mid||[],deltas=effects.map(([k,v])=>apply(k,v)).filter(Boolean);
 let pts=0;if(tier==="good")pts=roll===6?2:1;G.skillPoints+=pts;if(pts)deltas.push(`能力點 +${pts}`);
 G.turnInPhase++;if(G.turnInPhase>=phase().turns)G.stageStory=true;
 const text=tier==="good"?"這次選擇帶來正面收穫。":tier==="bad"?"結果不理想，但劇情不會因此停住。":"結果平穩，沒有太大波動。";
 G.result={title:ev.title,roll,tier,text,deltas,stageDone:false};log(`事件《${ev.title}》：選擇「${ch.label}」，擲出 ${roll}。`);
}
function resolveFight(ev,ch,roll){
 const my=ovr()+roll+rnd(-2,2),opp=ovr()+rnd(-4,5),win=my>=opp,p=phase(),deltas=[];
 const proFight=!p.id.startsWith("hs");
 if(proFight){win?G.pro.w++:G.pro.l++;if(win&&roll===6)G.pro.ko++;}else{win?G.amateur.w++:G.amateur.l++;}
 if(win){deltas.push(apply("fame",3),apply("morale",3));}else{deltas.push(apply("morale",-2),apply("health",-4));}
 const pts=win?(roll===6?6:4):(roll>=4?3:2);G.skillPoints+=pts;deltas.push(`能力點 +${pts}`);
 if(proFight)deltas.push(apply("income",win?rnd(3000,8000):rnd(1500,4000)));
 G.result={title:ev.title,roll,tier:win?"good":"bad",text:win?`你贏下 ${p.story}。`:`你輸掉 ${p.story}，但這不是門檻，生涯仍會進入下一階段。`,deltas:deltas.filter(Boolean),stageDone:true};
 log(`${p.story}：${win?"勝利":"落敗"}，獲得 ${pts} 能力點。`);
}
function resolveSpecial(ev,ch,roll){
 let deltas=[],text="";
 if(ch.special==="choose_college"){
   G.lifePath="college";G.skillPoints+=3;deltas=["能力點 +3",apply("morale",2)];text="你選擇進大學，接下來四年會一邊念書一邊拳擊。";
 }else if(ch.special==="choose_work"){
   G.lifePath="work";G.skillPoints+=3;deltas=["能力點 +3",apply("income",1200)];text="你選擇先工作，接下來會一邊上班一邊維持拳擊訓練。";
 }else if(ch.special==="college_grad_full"){
   G.skillPoints+=5;deltas=["能力點 +5",apply("fame",3),apply("morale",3)];text="大學畢業，你正式把拳擊變成主業。";
 }else if(ch.special==="college_grad_part"){
   G.skillPoints+=3;deltas=["能力點 +3",apply("income",1800),apply("morale",1)];text="你畢業後先保留兼職收入，再正式進入職業賽程。";
 }else if(ch.special==="work_full"){
   G.skillPoints+=5;deltas=["能力點 +5",apply("morale",3),apply("fame",2)];text="你辭掉工作，正式成為全職拳手。";
 }else if(ch.special==="work_part"){
   G.skillPoints+=3;deltas=["能力點 +3",apply("income",1800),apply("morale",1)];text="你把工作降成較少工時，同時正式進入職業賽程。";
 }
 G.result={title:ev.title,roll,tier:"good",text,deltas:deltas.filter(Boolean),stageDone:true};log(`重大選擇：${ch.label}。`);
}
function continueAfterResult(){
 if(!G.result)return;const done=G.result.stageDone;G.result=null;
 if(done){
   G.stageStory=false;G.turnInPhase=0;G.phaseIndex++;
   const seq=getSequence();if(G.phaseIndex>=seq.length)G.phaseIndex=seq.length-1;
   const p=phase();G.year=p.year;G.age=p.age;log(`進入下一階段：${p.name}。`);
 }
 save();render();
}
function timelineHTML(){
 const seq=getSequence(),max=Math.min(G.phaseIndex,seq.length-1);
 return seq.slice(0,max+1).map((p,i)=>`<div class="node ${i<max?"done":i===max?"on":""}"><b>${p.year}　${p.name.split("・")[0]}</b><span>${p.name}${i===max?`｜${G.turnInPhase}/${p.turns} 回合`:""}</span></div>`).join("");
}
function resetGame(){if(confirm("確定重開人生嗎？")){localStorage.removeItem(SAVE_KEY);G=null;render()}}
function startScreen(){return `<div class="start"><h1>Boxing <em>Life</em></h1><div class="startIntro">高一就開始海外留學。高一、高二、高三會照左側年表累積；高中畢業後，你可以選擇 <b style="color:var(--gold)">進大學邊讀邊練</b> 或 <b style="color:var(--gold)">工作邊練</b>。兩條人生線會出現不同事件，之後再匯入職業拳擊。</div><div class="startGrid"><div class="panel"><label>拳手名字</label><input id="name" value="李逍遙"><div class="row2" style="margin-top:12px"><div><label>拳風</label><select id="style"><option value="pressure">壓迫型</option><option value="boxer">技巧型</option><option value="puncher">重砲型</option></select></div><div><label>高一留學地</label><select id="country"><option value="usa">🇺🇸 美國</option><option value="japan">🇯🇵 日本</option><option value="philippines">🇵🇭 菲律賓</option></select></div></div></div><div class="panel"><label>展開你的拳擊人生</label><div style="color:#c6d4cc;line-height:1.9;font-size:15px"><br></div></div></div><button class="startBtn" onclick="createGame()">高一，出發 ▶</button></div>`}
function rightAttrs(){return `<div class="pointsBox"><div class="pointsHead"><span>可分配能力點</span><b>${G.skillPoints}</b></div></div>${SKILLS.map(k=>{const c=statCost(k);return `<div class="attr"><div class="attrTop"><div class="attrName">${NAMES[k]}</div><div class="attrBar"><i style="width:${G.stats[k]}%"></i></div><div class="attrValue">${G.stats[k]}<span>/95</span></div><button class="plus" ${G.skillPoints<c||G.stats[k]>=95?"disabled":""} onclick="spendPoint('${k}')">＋</button></div><div class="cost">升 1 點花費 ${c} 能力點</div></div>`}).join("")}`}
function render(){
 const app=document.getElementById("app");if(!G){G=load();if(!G){app.innerHTML=startScreen();return;}}if(!G.usedSpecial)G.usedSpecial={};if(!Array.isArray(G.recentEvents))G.recentEvents=[];
 const p=phase(),country=COUNTRIES[G.country],mode=G.current?"event":G.result?"result":"idle";
 const choices=mode==="event"?`<div class="sidePanel"><div class="choiceTitle">${G.current.cat}｜你要怎麼做？</div>${G.current.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c.label}</b><span>${c.sub}</span><em>${c.rate}</em></button>`).join("")}<div class="diceHint">每次選擇後，系統都會擲出 <b style="color:var(--gold)">1～6 命運骰</b>，同一個選項也可能因為運氣出現不同結果。</div></div>`:"";
 const res=mode==="result"?`<div class="sidePanel"><div class="rightTitle">RESULT</div><div class="die">${G.result.roll}</div><div class="resultText">${G.result.text}</div><div class="deltaWrap">${G.result.deltas.map(x=>`<span class="delta ${x.includes("能力點")?"point":x.includes("+")?"good":x.includes("-")?"bad":""}">${esc(x)}</span>`).join("")}</div></div>`:"";
 const nextSeq=getSequence();const nextName=nextSeq[Math.min(G.phaseIndex+1,nextSeq.length-1)]?.name||"下一階段";
 const action=mode==="idle"?`<button onclick="drawEvent()">${G.stageStory?`進入重大劇情：${p.story}`:`開始第 ${G.turnInPhase+1} / ${p.turns} 回合`}<small>${G.stageStory?"完成後進下一個人生階段":"每個人生階段都有不同事件池，且會避開最近抽過的內容"}</small></button>`:mode==="result"?`<button onclick="continueAfterResult()">${G.result.stageDone?"進入下一階段":"繼續"}<small>${G.result.stageDone?`下一站：${nextName}`:"回到下一個事件回合"}</small></button>`:"";
 const centerFlow=`<div class="eventFlow">${mode==="event"?choices:""}${mode==="result"?res:""}<div class="action">${action}</div></div>`;
 const center=mode==="event"?`<div class="card ${G.current.story||G.current.special?"major":""}"><div class="kicker ${G.current.story||G.current.special?"gold":""}">■ ${G.current.cat}</div><h2>${G.current.title}</h2><p>${G.current.desc}</p></div>`:mode==="result"?`<div class="card ${G.result.stageDone?"major":""}"><div class="kicker ${G.result.stageDone?"gold":""}">■ ${G.result.stageDone?"重大劇情結果":"事件結果"}</div><h2>${G.result.title}</h2><p>${G.result.text}</p><div class="deltaWrap">${G.result.deltas.map(x=>`<span class="delta ${x.includes("能力點")?"point":x.includes("+")?"good":x.includes("-")?"bad":""}">${esc(x)}</span>`).join("")}</div></div>`:`<div class="card"><div class="kicker">■ ${p.name}</div><h2>${G.stageStory?`4 回合完成：${p.story}`:`第 ${G.turnInPhase+1} 回合準備開始`}</h2><p>${G.stageStory?`這個人生階段的日常事件已完成，現在進入重大劇情。`:p.desc}</p><div class="progressBox"><div class="progressText">本階段進度 <b>${G.turnInPhase} / ${p.turns}</b></div><div class="turnDots">${Array.from({length:p.turns},(_,i)=>`<i class="${i<G.turnInPhase?"done":""}"></i>`).join("")}</div></div></div>`;
 app.innerHTML=`<div class="shell">
 <aside class="left"><div class="brand">Boxing <em>Life</em></div><div class="brandSub">拳 擊 人 生 模 擬 器</div><div class="school">台灣高中・拳擊部<small>${country.route}｜${country.name}・${G.base}</small></div><div class="timeline">${timelineHTML()}</div><div class="menu"><div class="active">▣ 生涯事件</div><div>◆ 能力點</div><div>♜ 劇情比賽</div><div>▦ 人生年表</div><div>★ 技能</div><div>▥ 數據</div><div>◉ 成就</div><div onclick="save()">▣ 儲存</div><div onclick="resetGame()">⚙ 重開人生</div></div><div class="version"><b>v4.4.0</b><br>${G.lifePath==="college"?"大學人生線":G.lifePath==="work"?"工作人生線":"高中人生線"}<br>4 回合推進・大量階段限定事件</div></aside>
 <main class="center"><header class="header"><div class="profile"><div class="no">1</div><div class="name"><b>${esc(G.name)}</b><div class="tags"><span class="tag">${p.identity}</span><span class="tag gold">${STYLES[G.style]}</span></div></div><div class="affil">所屬地區<b>${country.name}・${G.base}</b></div></div><div class="metrics"><div class="metric"><b>${G.age}</b><span>年齡</span></div><div class="metric"><b>${G.year}</b><span>年份</span></div><div class="metric"><b>${ovr()}</b><span>綜合</span></div><div class="metric"><b>${G.skillPoints}</b><span>能力點</span></div><div class="metric"><b>${G.pro.w}-${G.pro.l}</b><span>職業戰績</span></div></div></header><div class="content"><div class="card"><div class="kicker">■ 人生主線</div><p>左側會永久保留走過的年級／人生階段。高中畢業後會真正分成 <b>大學線</b> 或 <b>工作線</b>；每條線都有自己的特殊事件，再於 23 歲左右匯入職業拳擊。</p></div><div class="date">${G.year} 年 ・ ${G.age} 歲 ・ ${p.name}</div>${center}${centerFlow}<div class="card"><div class="kicker">■ 最近紀錄</div>${G.logs.slice(0,7).map(l=>`<div class="log"><small>${l.when}</small><div>${esc(l.text)}</div></div>`).join("")}</div></div></main>
 <aside class="right"><div class="rhythm"><div class="rightTitle">LIFE RHYTHM</div><div class="rhythmRow ${!G.stageStory&&!G.current&&!G.result?"on":""}"><i></i>${p.name}：${G.turnInPhase}/${p.turns} 回合</div><div class="rhythmRow ${G.current?"on":""}"><i></i>階段專屬事件／特殊事件</div><div class="rhythmRow ${G.result?"on":""}"><i></i>命運骰結算</div><div class="rhythmRow ${G.stageStory?"on":""}"><i></i>第 4 回合後：${p.story}</div></div>${rightAttrs()}</aside>
 </div>`;
}
render();
</script>

<script id="v26-career-js">
function ensureCareerData(){
  if(!G)return;
  if(!Array.isArray(G.careerHistory))G.careerHistory=[];
  if(!G.careerStats)G.careerStats={peakOvr:ovr(),peakFame:G.fame||0,totalEvents:0,specialEvents:0,fights:0};
  if(G.retired===undefined)G.retired=false;
  if(!G.retireReason)G.retireReason="";
}
function updateCareerPeaks(){
  ensureCareerData();
  G.careerStats.peakOvr=Math.max(G.careerStats.peakOvr||0,ovr());
  G.careerStats.peakFame=Math.max(G.careerStats.peakFame||0,G.fame||0);
}
function addCareerRecord(title,text,type="life"){
  ensureCareerData();
  const p=phase();
  const item={
    year:G.year,age:G.age,phase:p.name,title,text,type,
    route:G.lifePath||"highschool"
  };
  G.careerHistory.unshift(item);
  G.careerHistory=G.careerHistory.slice(0,80);
  updateCareerPeaks();
}
function routeLabel(){
  if(G.lifePath==="college")return "高中留學 → 大學邊讀邊練 → 職業拳擊";
  if(G.lifePath==="work")return "高中留學 → 工作邊練 → 職業拳擊";
  return "海外高中拳擊";
}
function proRecord(){return `${G.pro.w}-${G.pro.l}-${G.pro.d||0} (${G.pro.ko||0}KO)`}
function amateurRecord(){return `${G.amateur.w}-${G.amateur.l}`}
function careerRecordModal(){
  ensureCareerData();

  if(modal)modal.remove();

    <div class="historyItem">
      <div class="historyWhen"><b>${x.year}</b>${x.age} 歲<br>${x.phase}</div>
      <div class="historyText"><strong>${esc(x.title)}</strong>${esc(x.text)}</div>
    </div>`).join(""):`<div class="historyItem"><div class="historyText">目前還沒有重大生涯紀錄。</div></div>`;
  document.body.insertAdjacentHTML("beforeend",`
   <div id="careerModal" class="careerModal">

      <div class="careerTop">

        <button class="closeX" onclick="document.getElementById('careerModal').remove()">關閉</button>
      </div>
      <div class="careerSummary">
        <div class="careerMetric"><b>${amateurRecord()}</b><span>業餘戰績</span></div>
        <div class="careerMetric"><b>${proRecord()}</b><span>職業戰績</span></div>
        <div class="careerMetric"><b>${G.careerStats.peakOvr}</b><span>最高 OVR</span></div>
        <div class="careerMetric"><b>${money(G.income)}</b><span>生涯收入</span></div>
      </div>
      <div class="historyList">${list}</div>
      <div class="shareArea">
        <div class="shareButtons">
          <button onclick="buildShareCard()">產生生涯分享圖</button>
          ${G.retired?`<button onclick="downloadShareCard()">下載 PNG</button>`:""}
        </div>
        <div id="sharePreview" class="sharePreview" style="display:none"></div>
      </div>
    </div>
   </div>`);
}
function getShareHighlights(){
  ensureCareerData();
  return G.careerHistory.slice(0,7).reverse();
}

  ensureCareerData();

  ctx.fillStyle="#eef0e5";ctx.font="900 76px sans-serif";

    ["FAME",String(G.careerStats.peakFame)],["INCOME",money(G.income)],["AGE",`${G.age} 歲`]
  ];
  let cx=70,cy=290;
  cards.forEach((c,i)=>{
    const col=i%3,row=Math.floor(i/3),x=70+col*355,y=290+row*145;
    ctx.fillStyle="#143a2d";ctx.strokeStyle="#345d4b";ctx.lineWidth=2;
    roundRect(ctx,x,y,320,115,18,true,true);
    ctx.fillStyle="#81998d";ctx.font="700 20px sans-serif";ctx.fillText(c[0],x+20,y+34);
    ctx.fillStyle="#f1c553";ctx.font="900 35px sans-serif";ctx.fillText(c[1],x+20,y+82);
  });

  ctx.fillStyle="#eef0e5";ctx.font="900 34px sans-serif";ctx.fillText("生涯重要經歷",70,610);
  ctx.strokeStyle="#315b49";ctx.beginPath();ctx.moveTo(70,630);ctx.lineTo(1130,630);ctx.stroke();

  let y=685;
  const hs=getShareHighlights();
  if(!hs.length){
    ctx.fillStyle="#a6b8ad";ctx.font="26px sans-serif";ctx.fillText("尚無生涯紀錄",90,y);
  }else{
    hs.forEach((h,idx)=>{
      ctx.fillStyle="#f1c553";ctx.font="800 22px sans-serif";
      ctx.fillText(`${h.year} · ${h.age}歲`,80,y);
      ctx.fillStyle="#eef0e5";ctx.font="800 27px sans-serif";
      ctx.fillText(trimText(ctx,h.title,780),280,y);
      ctx.fillStyle="#9fb2a7";ctx.font="21px sans-serif";
      wrapCanvasText(ctx,h.text,280,y+34,800,28,2);
      y+=112;
    });
  }

  ctx.fillStyle="#80998c";ctx.font="700 21px sans-serif";
  ctx.fillText("從高一留學開始，每一次選擇都留下紀錄。",70,1430);
  ctx.fillStyle="#f1c553";ctx.font="900 23px sans-serif";
  ctx.fillText(G.retired?"CAREER COMPLETE":"CAREER IN PROGRESS",900,1430);

  canvas.id="careerShareCanvas";
  preview.appendChild(canvas);
}
function roundRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function trimText(ctx,text,maxWidth){
  let s=String(text);while(ctx.measureText(s).width>maxWidth&&s.length>2)s=s.slice(0,-2)+"…";return s;
}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  const chars=String(text).split("");let line="",lines=[];
  for(const ch of chars){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length>=maxLines)break;}
    else line=test;
  }
  if(lines.length<maxLines&&line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
}

<script id="v27-story-js">

function stageDesc(id){
 const map={
  hs1:`<div class="storyProse"><div class="yearTag">2026</div><div class="bigLead">第一個學年快結束了，你終於不再像剛來時那麼陌生。</div>你開始記得每天通往拳館的路，知道教練什麼時候會點你上台，知道這個城市白天和夜晚各自藏著什麼誘惑。<br>這場 <strong>海外新人盃</strong> 不只是比賽，更像是你留學第一年的成績單。輸贏不會阻止你升上高二，但會決定你帶著什麼心情進入下一個階段。`,

      die.insertAdjacentHTML('afterend',`<div class="dieNote">你這次擲出 <b style="color:var(--gold)">${G.result.roll}</b> 點。<br>${G.result.tier==='good'?'高點數帶來更好的結果。':G.result.tier==='bad'?'低點數讓事情變得比較辛苦。':'這次落在中間值，結果偏向穩定。'}</div>`);
   }
 }
 const card=document.querySelector('.content .card');
 if(card && G.current && G.current.story){
   const h2=card.querySelector('h2'); if(h2 && !h2.querySelector('.prologueMark')) h2.insertAdjacentHTML('beforeend','<span class="prologueMark">｜文字敘事</span>');
 }
}

function v28MajorNarrative(id){
 const m={
  hs1:`<div class="storyProse"><div class="yearTag">2026 · 高一結束</div><div class="bigLead">四個回合過去，你終於從「剛到的台灣學生」變成拳館裡有人認得的那個年輕拳手。</div>你學會聽懂更多口令，也開始知道自己在海外生活最容易在哪裡失控。<br><strong>海外新人盃</strong> 是第一個學年的句點。它不決定你能不能升高二，但會把一段很具體的記憶留進生涯紀錄。</div>`,
  hs2:`<div class="storyProse"><div class="yearTag">2027 · 高二結束</div><div class="bigLead">第二年，你開始理解拳擊真正難的地方不是只在擂台，而是如何把生活維持在可以出拳的狀態。</div>課業、感情、人際與訓練都已經留下痕跡。<br>現在，你要用 <strong>青年錦標賽</strong> 替高二做結算。</div>`,
  hs3:`<div class="storyProse"><div class="yearTag">2028 · 高中畢業</div><div class="bigLead">三年海外高中生活結束，你不再是當初拖著行李走進拳館的少年。</div>你確定自己不想停止拳擊，但人生必須選擇一個現實的支點。<br><strong>讀大學邊練</strong>，還是 <strong>工作邊練</strong>？兩條路最後都可能通往職業，但沿途會遇到完全不同的人和事情。</div>`,
  uni1:`<div class="storyProse"><div class="yearTag">大一結束</div><div class="bigLead">你撐過了第一次真正的大學生活與拳擊雙線。</div>這一年學到的不只是課堂內容，而是如何在沒有老師一直提醒的情況下管理自己。<br>年度新人賽會替第一年畫下句點。</div>`,
  uni2:`<div class="storyProse"><div class="yearTag">大二結束</div><div class="bigLead">人際關係開始比課表更難處理。</div>你可能跟同學吵過、跟室友磨合過，也可能因為感情分心。拳擊仍然在，但你已經不是只活在拳館裡的人。</div>`,
  uni3:`<div class="storyProse"><div class="yearTag">大三結束</div><div class="bigLead">曝光開始改變你的生活。</div>品牌、網紅、實習與遠征把你推到更公開的位置。你必須學會判斷：什麼是機會，什麼只是噪音。</div>`,
  uni4:`<div class="storyProse"><div class="yearTag">2032 · 大學畢業</div><div class="bigLead">四年過去，你拿到的不只有學位，還有一段沒有人能替你複製的拳擊履歷。</div>現在學生身分正式結束。<br>下一個決定，是把拳擊變成主業，還是先保留一部分收入安全感。</div>`,
  work1:`<div class="storyProse"><div class="yearTag">工作第一年結束</div><div class="bigLead">你第一次靠自己的薪水支付房租、交通、拳館與比賽成本。</div>這一年讓你知道，拳擊夢想其實每個月都有帳單。</div>`,
  work2:`<div class="storyProse"><div class="yearTag">工作第二年結束</div><div class="bigLead">你已經很會在公司和拳館之間切換身分。</div>但時間沒有變多，只是你越來越會承受疲勞。這場城市排名賽會再次測試這種生活能不能長久。</div>`,
  work3:`<div class="storyProse"><div class="yearTag">工作第三年結束</div><div class="bigLead">越來越多人先知道你是拳手，才知道你在哪裡上班。</div>名氣、社群與公司開始互相碰撞，你也越來越接近必須選邊的時刻。</div>`,
  work4:`<div class="storyProse"><div class="yearTag">2032 · 工作第四年</div><div class="bigLead">兼顧已經證明過了，現在真正的問題是：你願不願意承擔全職拳擊的風險？</div>繼續工作比較安全；把工時降下來甚至辭職，則可能讓你第一次真正知道自己的上限。</div>`,

  regional:`<div class="storyProse"><div class="yearTag">地區排名</div><div class="bigLead">你不再只是填補賽程的人。</div>這場比賽可能直接影響地區排名、酬勞與下一次主辦方願不願意再打電話來。</div>`,

function v28DiceNarrative(ev,ch,roll,tier){
 const subject=ev.cat||"事件";
 const exact={
  1:`命運骰停在 <strong>1</strong>。事情幾乎往最糟的方向滑去。你不是完全沒有補救，但這個回合肯定會留下代價。`,
  2:`你擲出 <strong>2</strong>。結果偏差，雖然沒有徹底失控，卻逼你重新調整下一步。`,
  3:`骰子是 <strong>3</strong>。沒有成功逆轉，也沒有真正崩掉；這是那種事後會想「如果剛剛再做好一點」的結果。`,
  4:`命運骰來到 <strong>4</strong>。事情基本按照計畫完成，沒有奇蹟，但足夠讓你繼續保持節奏。`,
  5:`你擲出 <strong>5</strong>。這次處理明顯高於預期，周圍的人也開始注意到你的選擇與表現。`,
  6:`骰子停在 <strong>6</strong>。這是少見的完美回合——不只得到結果，還可能成為日後回頭看時記得的一段故事。`
 }[roll];
 let context="";
 if(subject.includes("戀")||subject.includes("感情")||subject.includes("人際")) context="感情與人際的影響不會立刻消失，後面的訓練與選擇仍可能被今天牽動。";
 else if(subject.includes("媒體")||subject.includes("偷拍")||subject.includes("社群")) context="曝光會變成名氣，也可能變成壓力；這次風向會跟著你一段時間。";
 else if(subject.includes("拳館")||subject.includes("訓練")) context="拳館裡的人不一定會說出口，但教練與隊友都會記得你這次怎麼處理。";
 else if(subject.includes("工作")||subject.includes("大學")||subject.includes("高中")) context="這次不只是數值變化，也在塑造你這個階段的人生狀態。";
 else context="這一顆骰子不決定整個人生，但它會成為生涯路線上的一個小轉折。";
 return `<div class="rollExplain">${exact}<br>${context}</div>`;
}

<script id="v31-intro-js">
function v31LifeIntro(){
  return `<div class="lifeIntro lifeIntroV39">
    <div class="lifeIntroTitle">
      <span class="icon">🥊</span>
      <div>
        <small>YOUR BOXING LIFE BEGINS HERE</small>
        <div>展開你的拳擊人生</div>
      </div>
    </div>

    <div class="prologueLead">
      <span class="prologueQuote">「沒有人知道你最後會成為誰。現在，你只有一副拳套，和想知道自己能走多遠的念頭。」</span>
    </div>

    <div class="fullNarrative">
      <p>故事從你還只是高中生的時候開始。你離開熟悉的台灣，拖著行李來到日本、美國或菲律賓，在陌生的語言、校園與街道之間重新學會生活。行李裡沒有冠軍腰帶，也沒有什麼天選之人的證明，只有課本、拳鞋、拳套，以及一個很單純的想法：既然已經來到這裡，那就認真試一次，看看自己究竟能打到哪裡。</p>

      <p>第一次走進海外拳館時，你只是角落裡那個沒什麼人認識的台灣學生。別人可能比你更強、更有經驗，甚至根本不在意你從哪裡來。你要從最普通的訓練開始，慢慢適應當地的生活方式、拳館文化與人際關係。旅日、旅美與旅菲不只是換一面國旗，每個地方都會讓你遇見不同的人、不同的機會，也會讓同一個選擇產生完全不同的結果。</p>

      <p>隨著時間一年一年往前，你的人生也不會只剩下拳擊。你會長大，會開始在夢想和現實之間做決定。有人支持你，也可能有人離開你；有時候生活突然變順，一場勝利就讓更多人開始認識你的名字，有時候卻可能在覺得一切都要起飛的時候，被一次失敗、一段低潮或身體狀況狠狠拉回地面。遊戲中的每一個回合，都像人生中的一小段時間，你只能根據當下知道的事情做選擇，然後接受命運骰帶來的結果。</p>

      <p>每四個回合，你會走進下一個重要的人生階段。高中畢業後，你可能繼續念大學，一邊完成學業一邊維持訓練；也可能先進入職場，用自己的收入撐起生活與拳擊。兩條路都沒有比較輕鬆，也沒有哪一條保證比較成功。最後當你真正踏進職業拳壇，拳擊會從興趣與夢想，逐漸變成必須面對戰績、排名、收入、團隊、曝光與身體代價的職業人生。</p>

      <p>最重要的是，這不是一款保證你最後一定會成為世界冠軍的遊戲。你可能一路打上去，從無名新人變成有排名的職業拳手，甚至真的有一天把冠軍腰帶舉過頭頂；但你也可能輸掉關鍵比賽、長期停留在某個層級，或因為累積的傷病不得不提前離開擂台。有些人生最後留下的是冠軍，有些留下的是一段不算完美、卻很真實的職業戰績。甚至有時候，懂得在身體還能好好生活時退休，本身也是一種勝利。</p>

      <p>所以你真正要完成的，不是一條事先寫好的冠軍路線，而是<strong>屬於你自己的拳擊人生</strong>。你的能力、健康、士氣、戰績、金錢、人際關係和每一次選擇，都會在這條路上留下痕跡。等到最後一回合結束，生涯紀錄會告訴你：這名從台灣出發的年輕拳手，究竟走出了一段什麼樣的人生。</p>
    </div>

    <div class="prologueEnding">
      <strong>選擇你的旅外國家，戴上拳套。第一回合，從現在開始。</strong>
    </div>
  </div>`;
}

<script id="v32-real-outcomes-js">
function ensureOutcomeData(){
  if(!G)return;
  if(!G.outcomes)G.outcomes={
    worldTitle:false,
    regionalTitle:false,
    forcedRetirement:false,
    careerEndingInjury:false,
    peakStage:phase()?.name||"",
    losingStreak:0
  };
}
function updateCareerOutcomeAfterFight(win,roll){
  ensureOutcomeData();
  if(win){
    G.outcomes.losingStreak=0;
    if(phase().id==="regional" && roll>=5) G.outcomes.regionalTitle=true;
    if(phase().id==="prime" && roll===6 && (G.pro.w||0)>=6) G.outcomes.worldTitle=true;
  }else{
    G.outcomes.losingStreak=(G.outcomes.losingStreak||0)+1;
  }
  G.outcomes.peakStage=phase()?.name||G.outcomes.peakStage;
}
function injuryRetirementCheck(roll){
  ensureOutcomeData();
  // 只有在身體已經非常差，或生涯後段遇到極差骰運時，才有小機率被迫退休。
  const lowHealth=(G.health||100)<=12;
  const lateCareer=phase()?.id==="decline";
  const severeRoll=roll===1;
  if(lowHealth && severeRoll){
    G.outcomes.forcedRetirement=true;
    G.outcomes.careerEndingInjury=true;
    G.retired=true;
    G.retireReason="長期累積的傷病在這一次爆發，醫療團隊建議你不要再繼續承受職業比賽強度。你被迫提前結束拳擊生涯。";
    addCareerRecord("傷病迫使生涯提前結束",G.retireReason,"retire");
    return true;
  }
  if(lateCareer && severeRoll && (G.health||100)<=30 && Math.random()<0.35){
    G.outcomes.forcedRetirement=true;
    G.outcomes.careerEndingInjury=true;
    G.retired=true;
    G.retireReason="生涯後段的一次重傷，讓你無法再安全地維持比賽強度。你沒有等到預定的最後一戰，就先離開了擂台。";
    addCareerRecord("最後的傷病",G.retireReason,"retire");
    return true;
  }
  return false;
}
function v32CareerEndingText(){
  ensureOutcomeData();
  if(G.outcomes.careerEndingInjury) return "傷病提前退休";
  if(G.outcomes.worldTitle) return "世界冠軍";
  if(G.outcomes.regionalTitle) return "地區冠軍／國際排名拳手";
  if((G.pro.w||0)>=(G.pro.l||0)+3) return "成功職業拳手";
  if((G.pro.w||0)>0) return "職業拳手";
  return "拳擊人生";
}

// Change career map wording: reaching the top stage is not the same as winning a title.
const V32_oldCareerMap=v29CareerMap;
v29CareerMap=function(){
  let s=V32_oldCareerMap();
  s=s.replace(/冠軍舞台/g,"世界舞台");
  s=s.replace(/生涯巔峰/g,"最高舞台");
  return s;
};

const V32_oldResolveFight=resolveFight;
resolveFight=function(ev,ch,roll){
  const beforeW=(G.pro?.w||0)+(G.amateur?.w||0);
  V32_oldResolveFight(ev,ch,roll);
  const afterW=(G.pro?.w||0)+(G.amateur?.w||0);
  const win=afterW>beforeW;
  updateCareerOutcomeAfterFight(win,roll);

  if(G.result && phase().id==="prime"){
    if(G.outcomes.worldTitle){
      G.result.text=`<div class="rollExplain"><b>冠軍誕生：</b>這一次，你真的跨過了那道門檻。多年累積的訓練、選擇與運氣，終於把你推上世界冠軍的位置。</div>`+G.result.text;
      addCareerRecord("拿下世界冠軍","你在生涯巔峰真正贏得世界級冠軍頭銜。","title");
    }else{
      G.result.text=`<div class="rollExplain"><b>世界舞台：</b>能走到這裡已經很少見，但今晚沒有把你送上冠軍位置。世界舞台不是保證，每一次機會都可能只有一次。</div>`+G.result.text;
    }
  }

  if(!G.retired && injuryRetirementCheck(roll)){
    if(G.result){
      G.result.stageDone=true;
      G.result.text=`<div class="rollExplain"><b>生涯突變：</b>${G.retireReason}</div>`+G.result.text;
    }
  }
  save();
};

const V32_oldResolveEvent=resolveEvent;
resolveEvent=function(ev,ch,roll){
  V32_oldResolveEvent(ev,ch,roll);
  ensureOutcomeData();
  if(!G.retired && injuryRetirementCheck(roll)){
    if(G.result){
      G.result.stageDone=true;
      G.result.text=`<div class="rollExplain"><b>傷病警訊：</b>${G.retireReason}</div>`+G.result.text;
    }
  }
  save();
};

const V32_oldRetireCareer=retireCareer;
retireCareer=function(reason="正式結束拳擊生涯"){
  ensureOutcomeData();
  if(!G.outcomes.worldTitle && phase()?.id==="decline" && (G.pro.w||0)<3){
    reason="你沒有成為冠軍，但仍完成了一段真正屬於自己的職業拳擊人生。最後你選擇在身體還能健康生活時離開擂台。";
  }
  V32_oldRetireCareer(reason);
};

const V32_oldBuildShareCard=buildShareCard;
buildShareCard=function(){
  V32_oldBuildShareCard();
  const c=document.getElementById("careerShareCanvas");
  if(!c)return;
  const x=c.getContext("2d");
  ensureOutcomeData();

  x.fillStyle="#061912";

  x.strokeStyle="#8a742a";

  x.font="800 17px sans-serif";

  x.fillStyle="#f1c553";
  x.font="900 25px sans-serif";
  x.fillText(v32CareerEndingText(),760,1399);
};

  V32_oldRender();
  if(!G)return;
  ensureOutcomeData();

  const careerMini=document.getElementById("careerMini");
  if(careerMini && !careerMini.querySelector(".v32Ending")){
    careerMini.insertAdjacentHTML("beforeend",
      `<p class="v32Ending" style="margin-top:8px;color:#91a69a;font-size:12px">
        目前生涯定位：<b style="color:#f1c553">${v32CareerEndingText()}</b>
        ${G.outcomes.worldTitle?"｜🏆 已拿下世界冠軍":G.outcomes.regionalTitle?"｜🥇 已拿下地區級頭銜":""}
      </p>`);
  }

  if(G.retired){
    document.querySelectorAll(".action button").forEach(btn=>btn.disabled=true);

</script>

function v35BuildQuickbar(){

  return `<div class="mobileQuickbar" id="mobileQuickbar">

    <button type="button" onclick="careerRecordModal()">生涯紀錄</button>
    <button type="button" onclick="save()">儲存</button>
  </div>`;
}

function v35ArrangeLayout(){
  if(!G)return;
  const shell=document.querySelector(".shell");
  const center=document.querySelector(".center");
  const header=center?.querySelector(".header");
  let right=document.querySelector(".right");
  if(!shell||!center||!right)return;

  // Insert compact controls when the desktop left rail is unavailable.
  if(window.innerWidth<=1100 && !document.getElementById("mobileQuickbar")){
    if(header)header.insertAdjacentHTML("afterend",v35BuildQuickbar());
  }else if(window.innerWidth>1100){
    document.getElementById("mobileQuickbar")?.remove();
  }

  // Phone: put interaction rail immediately before recent logs.
  if(window.innerWidth<=860){
    const content=center.querySelector(".content");
    if(content && right.parentElement!==content){
      const cards=[...content.querySelectorAll(":scope > .card")];
      const recent=cards.find(c=>(c.querySelector(".kicker")?.textContent||"").includes("最近紀錄"));
      if(recent)content.insertBefore(right,recent);
      else content.appendChild(right);
    }
    right.classList.add("mobileEmbedded");

    // Center current career node on narrow screens.
    requestAnimationFrame(()=>{
      const map=document.querySelector(".careerMap");
      const current=map?.querySelector(".careerNode.current");
      if(map&&current){
        const target=current.offsetLeft-(map.clientWidth-current.clientWidth)/2;
        map.scrollLeft=Math.max(0,target);
      }
    });
  }else{
    // Restore normal DOM order on tablet/desktop after an orientation/resize change.
    if(right.parentElement!==shell)shell.appendChild(right);
    right.classList.remove("mobileEmbedded");
  }
}

let v35ResizeTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(v35ResizeTimer);
  v35ResizeTimer=setTimeout(v35ArrangeLayout,100);
});
window.addEventListener("orientationchange",()=>{
  setTimeout(v35ArrangeLayout,140);
});

const V35_prevRender=render;
render=function(){
  V35_prevRender();
  requestAnimationFrame(v35ArrangeLayout);
};
</script>

<script id="v41-career-system-js">

function drawRadarOnContext(ctx,cx,cy,radius,values,labels,opt={}){
  const levels=opt.levels||5;
  const axisColor=opt.axisColor||'#35596e';
  const gridColor=opt.gridColor||'#26485a';
  const labelColor=opt.labelColor||'#d8e1f0';
  const fillColor=opt.fillColor||'rgba(255,111,43,.22)';
  const strokeColor=opt.strokeColor||'#ff6f2b';
  const pointColor=opt.pointColor||'#ff6f2b';
  const font=opt.font||'14px sans-serif';
  const count=values.length;
  const angleStep=(Math.PI*2)/count;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.lineWidth=1.5;
  for(let level=1; level<=levels; level++){
    const r=radius*(level/levels);
    ctx.beginPath();
    for(let i=0;i<count;i++){
      const a=-Math.PI/2 + i*angleStep;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=gridColor;
    ctx.stroke();
  }
  for(let i=0;i<count;i++){
    const a=-Math.PI/2 + i*angleStep;
    const x=Math.cos(a)*radius, y=Math.sin(a)*radius;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(x,y);ctx.strokeStyle=axisColor;ctx.stroke();
  }
  ctx.beginPath();
  values.forEach((v,i)=>{
    const r=radius*(Math.max(0,Math.min(100,v))/100);
    const a=-Math.PI/2 + i*angleStep;
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle=fillColor;ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=strokeColor;ctx.stroke();
  values.forEach((v,i)=>{
    const r=radius*(Math.max(0,Math.min(100,v))/100);
    const a=-Math.PI/2 + i*angleStep;
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=pointColor;ctx.fill();
  });
  ctx.fillStyle=labelColor;
  ctx.font=font;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  labels.forEach((label,i)=>{
    const a=-Math.PI/2 + i*angleStep;
    const lr=radius+26;
    const x=Math.cos(a)*lr, y=Math.sin(a)*lr;
    ctx.fillText(label,x,y);
  });
  ctx.restore();
}
function drawCareerRadar(canvasId='careerRadar'){
  const canvas=document.getElementById(canvasId);
  if(!canvas||!window.G)return;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const w=Math.max(280,Math.round(rect.width||canvas.width));
  const h=Math.max(260,Math.round(rect.height||canvas.height));
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const grd=ctx.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'#15283f');
  grd.addColorStop(1,'#0d2234');
  ctx.fillStyle=grd; ctx.fillRect(0,0,w,h);
  drawRadarOnContext(ctx,w/2,h/2+8,Math.min(w,h)*0.28,SKILLS.map(k=>G.stats[k]),SKILLS.map(k=>NAMES[k]),{
    levels:5,
    axisColor:'#3e5c73',
    gridColor:'#2c4860',
    labelColor:'#dbe6ef',
    fillColor:'rgba(255,111,43,.25)',
    strokeColor:'#ff6f2b',
    pointColor:'#ff6f2b',
    font:(w<330?'12px':'14px')+' sans-serif'
  });
}

  const base=V41_oldForcedSpecial();
  if(base)return base;

  if(!pool.length)return null;
  if(G.turnInPhase===1 || G.turnInPhase===3){

function v41HandleCareerEffect(ch){
  if(!ch?.careerEffect||!G.result)return;
  v41EnsureCareerState();
  const tier=G.result.tier;
  switch(ch.careerEffect){
    case "agency_sign":
      if(tier==="bad"){
        G.careerState.scammed=true;
        G.careerState.agency="問題經紀合約";

        G.careerState.agency="正式經紀公司";

        addCareerRecord("被經紀公司簽下",G.result.text,"manager");
      }
      break;

      if(tier!=="bad"){
        G.careerState.agencySigned=true;
        G.careerState.agency="審約後簽約";
        G.result.text="你沒有急著簽字。確認條款後才完成合作，雖然多花一筆費用，卻避開幾個對拳手非常不利的條款。";

      }
      break;
    case "scam_risk":
      if(tier==="bad"||tier==="mid"){
        G.careerState.scammed=true;
        G.careerState.agency="遭黑心經紀詐騙";
        G.result.text=tier==="bad"?"錢匯出去後，對方開始已讀不回。幾週後你才確定，所謂排名與比賽全都是話術。":"你付了錢，最後只換到一場價值很低的比賽。你開始懷疑自己是不是被當成提款機。";
        addCareerRecord("遭黑心經紀騙錢",G.result.text,"scam");

      break;
    case "scam_check":
      G.result.text=tier==="good"?"你問了幾個拳手，很快發現對方早就有騙錢紀錄。你成功避掉一個大坑。":G.result.text;
      break;
    case "coach_path":
      G.careerState.coachPath=true;
      G.result.text=tier==="bad"?"帶課讓你的訓練時間變少，但你第一次發現自己其實很會教人。":"你開始帶幾個年輕拳手。收入不高，卻讓你看到拳擊生涯之外的下一條路。";
      addCareerRecord("開始兼任拳擊教練",G.result.text,"coach");
      break;
    case "coach_retire":
      if(tier==="good"){
        v41Retire("退休轉任拳擊教練","你沒有等到身體完全撐不住。你選擇在還能示範、還能上台帶人的時候離開職業擂台，正式把經驗傳給下一代。",true);
      }else{
        G.careerState.coachPath=true;
        G.result.text="你開始把重心慢慢轉向教練工作，但還沒有立刻宣布退役。";
      }
      break;
  }
  save();
}

const V41_oldResolveEvent=resolveEvent;

const V41_oldResolveFight=resolveFight;
resolveFight=function(ev,ch,roll){
  V41_oldResolveFight(ev,ch,roll);
  v41EnsureCareerState();
  const p=phase();
  const won=G.result?.tier==="good";
  if(!won)G.careerState.keyLosses=(G.careerState.keyLosses||0)+1;

  if(p.id==="regional" && won && roll>=5){
    G.careerState.regionalChampion=true;
    addCareerRecord("拿下地區級冠軍","你第一次真正拿到職業生涯的重要頭銜。","title");
  }

  if(p.id==="prime" && won && roll>=5 && (G.pro.w||0)>=5){
    G.careerState.worldChampion=true;
    G.result.text="你贏下生涯最重要的一場比賽。終場鐘響後，裁判舉起你的手——你真的成為世界冠軍。";
    G.result.deltas.push("世界冠軍 🏆");
    addCareerRecord("世界冠軍","你在世界舞台贏下冠軍戰，完成職業生涯最大的成就。","title");
  }else if(p.id==="prime" && !won){
    G.result.text="你站上了世界級舞台，但今晚沒有把冠軍帶回家。這場失敗會留在戰績上，人生卻仍然要繼續。";
    addCareerRecord("世界舞台關鍵戰失利","你挑戰最高舞台失敗，沒有拿下冠軍。","fight");
  }

  if(!won && (G.health||100)<=18 && roll<=2 && !G.retired){
    G.result.text+=" 比賽後檢查顯示傷勢比預期嚴重，醫師建議你不要再承受職業賽強度。";
    G.result.stageDone=true;
    setTimeout(()=>v41Retire("重傷被迫退休","一次關鍵比賽後的傷勢沒有完全恢復。醫療團隊認為繼續比賽風險太高，你被迫提前結束職業拳擊生涯。",G.careerState.coachPath),0);
  }
  save();
};

  const persona=v44CareerPersona();
  document.querySelectorAll(".pcEnding").forEach(el=>{
    el.classList.remove("goldEnding","injuryEnding","coachEnding","veteranEnding","flashEnding","starEnding");
    if(persona.theme)el.classList.add(persona.theme);
    if(!el.querySelector(".endingQuote")){
      el.insertAdjacentHTML("beforeend",`<span class="endingQuote">${persona.quote}</span>`);
    }
  });
}

const V44_prevCareerRecord=careerRecordModal;
careerRecordModal=function(){
  V44_prevCareerRecord();
  requestAnimationFrame(v44RefreshEndingTheme);
};

const V44_prevBuildShareCard=buildShareCard;
buildShareCard=function(){
  V44_prevBuildShareCard();
  const c=document.getElementById("careerShareCanvas");
  if(!c)return;
  const ctx=c.getContext("2d");
  const persona=v44CareerPersona();

  ctx.fillStyle="#0b2119";
  ctx.fillRect(62,1280,1076,72);
  ctx.strokeStyle="#6e6532";
  ctx.lineWidth=2;
  ctx.strokeRect(62,1280,1076,72);

  ctx.fillStyle="#f1c553";
  ctx.font="900 24px sans-serif";
  ctx.fillText(`${persona.style} · ${persona.title}`,82,1310);

  ctx.fillStyle="#9eb0a5";
  ctx.font="19px sans-serif";
  wrapCanvasText(ctx,persona.quote,82,1340,1010,23,1);
};
</script>

</body>
